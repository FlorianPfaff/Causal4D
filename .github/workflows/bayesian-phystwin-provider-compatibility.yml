name: Three-repository installed-wheel compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
      - "ci/three_repository_*.py"
      - "docs/ci.md"
      - "docs/molmo_visual_inputs_v2.md"
      - "docs/prob4d_provider_attestation.md"
      - "pyproject.toml"
      - "src/causal4d/bpt_belief.py"
      - "src/causal4d/claim_bearing_observation_lineage.py"
      - "src/causal4d/cli/molmo_phystwin_forecast_v2.py"
      - "src/causal4d/molmo_visual_inputs_v2.py"
      - "src/causal4d/observation_lineage.py"
      - "src/causal4d/phystwin_backend.py"
      - "src/causal4d/phystwin_resumable.py"
      - "src/causal4d/prob4d_observation_contract.py"
      - "src/causal4d/prob4d_observation_lineage.py"
      - "src/causal4d/prob4d_provider_attestation.py"
      - "src/causal4d/provider_contract.py"
      - "src/causal4d/replay_provider_contract.py"
      - "src/causal4d/rollout_cache.py"
      - "tests/test_bpt_provider_import_boundary.py"
      - "tests/test_bpt_provider_integration.py"
      - "tests/test_causal4d_bpt_belief.py"
      - "tests/test_causal4d_molmo_visual_inputs_v2.py"
      - "tests/test_causal4d_phystwin_backend.py"
      - "tests/test_phystwin_resumable.py"
      - "tests/test_prob4d_stream_contract_version.py"
      - "tests/test_replay_provider_contract.py"
      - "tests/test_rollout_cache.py"
      - "tests/test_three_repository_workflow_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
      - "ci/three_repository_*.py"
      - "docs/ci.md"
      - "docs/molmo_visual_inputs_v2.md"
      - "docs/prob4d_provider_attestation.md"
      - "pyproject.toml"
      - "src/causal4d/bpt_belief.py"
      - "src/causal4d/claim_bearing_observation_lineage.py"
      - "src/causal4d/cli/molmo_phystwin_forecast_v2.py"
      - "src/causal4d/molmo_visual_inputs_v2.py"
      - "src/causal4d/observation_lineage.py"
      - "src/causal4d/phystwin_backend.py"
      - "src/causal4d/phystwin_resumable.py"
      - "src/causal4d/prob4d_observation_contract.py"
      - "src/causal4d/prob4d_observation_lineage.py"
      - "src/causal4d/prob4d_provider_attestation.py"
      - "src/causal4d/provider_contract.py"
      - "src/causal4d/replay_provider_contract.py"
      - "src/causal4d/rollout_cache.py"
      - "tests/test_bpt_provider_import_boundary.py"
      - "tests/test_bpt_provider_integration.py"
      - "tests/test_causal4d_bpt_belief.py"
      - "tests/test_causal4d_molmo_visual_inputs_v2.py"
      - "tests/test_causal4d_phystwin_backend.py"
      - "tests/test_phystwin_resumable.py"
      - "tests/test_prob4d_stream_contract_version.py"
      - "tests/test_replay_provider_contract.py"
      - "tests/test_rollout_cache.py"
      - "tests/test_three_repository_workflow_policy.py"
  workflow_dispatch:
    inputs:
      bpt_ref:
        description: Bayesian-PhysTwin revision to test
        required: false
        default: main
      prob4d_ref:
        description: Prob4D revision to test
        required: false
        default: main
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: three-repository-installed-wheel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-gate:
    name: Require BayesianPhysTwin read access
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BPT_READ_SSH_KEY: ${{ secrets.BPT_READ_SSH_KEY }}
    steps:
      - name: Enforce BayesianPhysTwin credential
        run: |
          if [[ -z "${BPT_READ_SSH_KEY}" ]]; then
            echo "::error::BPT_READ_SSH_KEY is not configured; the BayesianPhysTwin consumer boundary cannot run."
            {
              echo "### Three-repository installed-wheel compatibility"
              echo
              echo "**Failed:** \`BPT_READ_SSH_KEY\` is absent."
              echo
              echo "The workflow is not allowed to claim current consumer compatibility without reading \`IPS-Stuttgart/BayesianPhysTwin\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "BayesianPhysTwin private-repository credential is configured."

  external-pull-request:
    name: External PR cannot access private providers
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report unavailable private coverage
        run: |
          echo "::warning::Repository secrets are unavailable to pull requests from forks; maintainers must run the installed-wheel golden path on a trusted branch before merge."
          {
            echo "### Three-repository installed-wheel compatibility"
            echo
            echo "This pull request originates from an external fork, so GitHub does not expose private-repository credentials."
            echo "The private golden path is intentionally marked unavailable rather than simulated with editable or public substitutes."
            echo "A maintainer must reproduce the head on a trusted same-repository branch before merging."
          } >> "$GITHUB_STEP_SUMMARY"

  installed-wheel-golden-path:
    name: Prob4D -> BPT -> Causal4D installed wheels
    needs: credential-gate
    if: needs.credential-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROB4D_READ_TOKEN: ${{ secrets.PROB4D_READ_TOKEN }}
    steps:
      - name: Probe Prob4D repository access
        id: prob4d-access
        shell: bash
        env:
          TOKEN: ${{ env.PROB4D_READ_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            status="missing"
          else
            http_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${TOKEN}" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/IPS-Stuttgart/Prob4D \
                || true
            )"
            case "${http_status}" in
              200) status="available" ;;
              401|403|404) status="inaccessible-${http_status}" ;;
              *) status="transport-${http_status:-unknown}" ;;
            esac
          fi
          if [[ "${status}" == "available" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "status=${status}" >> "$GITHUB_OUTPUT"
          fi

      - name: Record unavailable Prob4D gate on continuous events
        if: >-
          steps.prob4d-access.outputs.available != 'true' &&
          (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        run: |
          echo "::warning title=Credentialed three-repository gate unavailable::" \
            "PROB4D_READ_TOKEN is missing or cannot read IPS-Stuttgart/Prob4D."
          {
            echo "### Credentialed three-repository gate unavailable"
            echo
            echo "Status: \`${{ steps.prob4d-access.outputs.status }}\`"
            echo
            echo "The required Causal4D CI and BayesianPhysTwin integration run as separate checks,"
            echo "but no current-Prob4D execution or evidence is admitted by this workflow."
            echo "Scheduled and manual validation remains fail-closed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject unavailable Prob4D gate on explicit validation events
        if: >-
          steps.prob4d-access.outputs.available != 'true' &&
          github.event_name != 'pull_request' &&
          github.event_name != 'push'
        shell: bash
        run: |
          echo "::error title=Three-repository gate unavailable::" \
            "PROB4D_READ_TOKEN must read IPS-Stuttgart/Prob4D for scheduled and manual validation."
          exit 1

      - name: Check out Causal4D
        if: steps.prob4d-access.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: causal4d
          persist-credentials: false

      - name: Check out Bayesian-PhysTwin
        if: steps.prob4d-access.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ inputs.bpt_ref || 'main' }}
          ssh-key: ${{ secrets.BPT_READ_SSH_KEY }}
          path: bayesian-phystwin
          persist-credentials: false

      - name: Check out Prob4D
        if: steps.prob4d-access.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: ${{ inputs.prob4d_ref || 'main' }}
          token: ${{ env.PROB4D_READ_TOKEN }}
          path: prob4d
          persist-credentials: false

      - name: Set up Python
        if: steps.prob4d-access.outputs.available == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            causal4d/pyproject.toml
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml

      - name: Record exact clean repository revisions
        if: steps.prob4d-access.outputs.available == 'true'
        id: revisions
        run: |
          for repository in prob4d bayesian-phystwin causal4d; do
            test -z "$(git -C "$repository" status --porcelain=v1 --untracked-files=all)"
          done
          echo "prob4d=$(git -C prob4d rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "bpt=$(git -C bayesian-phystwin rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "causal4d=$(git -C causal4d rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check golden-path script quality
        if: steps.prob4d-access.outputs.available == 'true'
        run: |
          python -m pip install "ruff>=0.15.22,<0.17"
          python -m ruff check causal4d/ci/three_repository_*.py
          python -m ruff format --check --diff causal4d/ci/three_repository_*.py

      - name: Build all three wheels
        if: steps.prob4d-access.outputs.available == 'true'
        run: |
          python -m pip install --upgrade build pip
          wheelhouse="$RUNNER_TEMP/three-repository-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m build --wheel --outdir "$wheelhouse" prob4d
          python -m build --wheel --outdir "$wheelhouse" bayesian-phystwin
          python -m build --wheel --outdir "$wheelhouse" causal4d
          test "$(find "$wheelhouse" -maxdepth 1 -name '*.whl' | wc -l)" -eq 3

      - name: Record wheel SHA-256 identities
        if: steps.prob4d-access.outputs.available == 'true'
        run: |
          wheelhouse="$RUNNER_TEMP/three-repository-wheelhouse"
          (
            cd "$wheelhouse"
            sha256sum ./*.whl | sort
          ) | tee "$RUNNER_TEMP/three-repository-wheel-sha256.txt"

      - name: Install wheels in a clean virtual environment
        if: steps.prob4d-access.outputs.available == 'true'
        run: |
          venv="$RUNNER_TEMP/three-repository-venv"
          wheelhouse="$RUNNER_TEMP/three-repository-wheelhouse"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          mapfile -t wheels < <(find "$wheelhouse" -maxdepth 1 -name '*.whl' -print | sort)
          "$venv/bin/python" -m pip install \
            "${wheels[@]}" \
            pytest \
            opencv-python-headless
          "$venv/bin/python" -m pip check

      - name: Run the isolated three-repository compatibility path
        if: steps.prob4d-access.outputs.available == 'true'
        run: |
          set -o pipefail
          run_dir="$RUNNER_TEMP/three-repository-run"
          mkdir -p "$run_dir"
          cp causal4d/ci/three_repository_*.py "$run_dir/"
          cd "$run_dir"
          env -u PYTHONPATH \
            "$RUNNER_TEMP/three-repository-venv/bin/python" \
            three_repository_golden_path.py \
              --prob4d-fixture \
                "$GITHUB_WORKSPACE/prob4d/tests/fixtures/prob4d_joint_observation_v1.json" \
              --prob4d-revision "${{ steps.revisions.outputs.prob4d }}" \
              --bpt-revision "${{ steps.revisions.outputs.bpt }}" \
              --causal4d-revision "${{ steps.revisions.outputs.causal4d }}" \
              --checkout-root "$GITHUB_WORKSPACE/prob4d" \
              --checkout-root "$GITHUB_WORKSPACE/bayesian-phystwin" \
              --checkout-root "$GITHUB_WORKSPACE/causal4d" \
              --output "$RUNNER_TEMP/three-repository-summary.json" \
            | tee "$RUNNER_TEMP/three-repository-golden-path.log"
          test -s "$RUNNER_TEMP/three-repository-summary.json"
          "$RUNNER_TEMP/three-repository-venv/bin/python" -m json.tool \
            "$RUNNER_TEMP/three-repository-summary.json" >/dev/null

      - name: Run strict claim-bearing provider-v2 admission path
        if: steps.prob4d-access.outputs.available == 'true'
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/three-repository-run"
          env -u PYTHONPATH \
            "$RUNNER_TEMP/three-repository-venv/bin/python" \
            three_repository_provider_v2_attestation.py \
              --prob4d-fixture \
                "$GITHUB_WORKSPACE/prob4d/tests/fixtures/prob4d_joint_observation_v1.json" \
              --prob4d-revision "${{ steps.revisions.outputs.prob4d }}" \
              --output-dir "$RUNNER_TEMP/three-repository-provider-v2-work" \
              --output "$RUNNER_TEMP/three-repository-provider-v2-summary.json" \
            | tee "$RUNNER_TEMP/three-repository-provider-v2.log"
          test -s "$RUNNER_TEMP/three-repository-provider-v2-summary.json"
          "$RUNNER_TEMP/three-repository-venv/bin/python" -m json.tool \
            "$RUNNER_TEMP/three-repository-provider-v2-summary.json" >/dev/null

      - name: Run cross-repository contract tests against installed wheels
        if: steps.prob4d-access.outputs.available == 'true'
        env:
          CAUSAL4D_REQUIRE_BPT_PROVIDER: "1"
        run: |
          cd "$RUNNER_TEMP/three-repository-run"
          env -u PYTHONPATH \
            "$RUNNER_TEMP/three-repository-venv/bin/python" -m pytest -q \
              --import-mode=importlib \
              "$GITHUB_WORKSPACE/prob4d/tests/test_claim_bearing_observation.py" \
              "$GITHUB_WORKSPACE/prob4d/tests/test_joint_observation_contract_fixture.py" \
              "$GITHUB_WORKSPACE/bayesian-phystwin/tests/test_causal4d_provider_v1.py" \
              "$GITHUB_WORKSPACE/bayesian-phystwin/tests/test_causal4d_provider_v2.py" \
              "$GITHUB_WORKSPACE/bayesian-phystwin/tests/test_causal4d_artifacts_v2.py" \
              "$GITHUB_WORKSPACE/bayesian-phystwin/tests/test_observation_belief_gauge_adapter.py" \
              "$GITHUB_WORKSPACE/bayesian-phystwin/tests/test_prob4d_causal_lineage.py" \
              "$GITHUB_WORKSPACE/bayesian-phystwin/tests/test_run_manifest_v2.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_bpt_provider_import_boundary.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_bpt_provider_integration.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_causal4d_provider_contract.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_causal4d_phystwin_backend.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_causal4d_bpt_belief.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_causal4d_molmo_visual_inputs_v2.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_phystwin_resumable.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_replay_provider_contract.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_rollout_cache.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_observation_lineage.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_prob4d_joint_contract_fixture.py" \
              "$GITHUB_WORKSPACE/causal4d/tests/test_prob4d_stream_contract_version.py"

      - name: Publish compatibility summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/three-repository-summary.json" ]]; then
            {
              echo "### Compatibility path"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/three-repository-summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$RUNNER_TEMP/three-repository-provider-v2-summary.json" ]]; then
            {
              echo "### Strict claim-bearing provider-v2 path"
              echo
              echo '```json'
              cat "$RUNNER_TEMP/three-repository-provider-v2-summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$RUNNER_TEMP/three-repository-wheel-sha256.txt" ]]; then
            {
              echo "### Wheel SHA-256 identities"
              echo
              echo '```text'
              cat "$RUNNER_TEMP/three-repository-wheel-sha256.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload golden-path diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: three-repository-installed-wheel-golden-path
          path: |
            ${{ runner.temp }}/three-repository-summary.json
            ${{ runner.temp }}/three-repository-golden-path.log
            ${{ runner.temp }}/three-repository-provider-v2-summary.json
            ${{ runner.temp }}/three-repository-provider-v2.log
            ${{ runner.temp }}/three-repository-wheel-sha256.txt
          if-no-files-found: warn
          retention-days: 7
