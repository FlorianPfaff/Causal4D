name: Rebase PR 221 action-support admission

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebase-pr221-action-support.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-pr221-action-support
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 7d82dc6e43c4eda4437f4de2b51c10531458489e
  PRODUCT_BRANCH: agent/action-support-certificate-v1

jobs:
  rebuild:
    name: Replay action-support commit on current main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and verify immutable product head
        run: |
          set -euo pipefail
          git fetch origin \
            "${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PRODUCT_BRANCH}")" \
            = "${EXPECTED_HEAD}"

      - name: Replay the exact product commit
        run: |
          set -euo pipefail
          base_head="$(git rev-parse origin/main)"
          git checkout -B pr221-rebuilt "${base_head}"
          git cherry-pick "${EXPECTED_HEAD}"
          git diff --name-only "${base_head}" HEAD | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/action_support_certificate.md
          src/causal4d/__init__.py
          src/causal4d/action_support.py
          src/causal4d/action_support_counterfactual.py
          tests/test_action_support.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Validate focused and repository quality boundaries
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m ruff format --check \
            src/causal4d/__init__.py \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py \
            tests/test_action_support.py
          python -m mypy --python-version 3.12 \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f \
              src/causal4d/__init__.py \
              src/causal4d/action_support.py \
              src/causal4d/action_support_counterfactual.py \
              tests/test_action_support.py
          python -m pytest -q tests/test_action_support.py
          git diff --check "${base_head}"...HEAD

      - name: Publish rebuilt branch with lease
        run: |
          git push --force-with-lease=refs/heads/${PRODUCT_BRANCH}:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/${PRODUCT_BRANCH}

      - name: Remove this temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f \
            cleanup/.github/workflows/rebase-pr221-action-support.yml; then
            git -C cleanup rm \
              .github/workflows/rebase-pr221-action-support.yml
            git -C cleanup commit -m \
              "Remove temporary PR 221 rebase workflow"
            git -C cleanup push origin HEAD:main
          fi
