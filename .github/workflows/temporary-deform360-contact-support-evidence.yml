name: Temporary Deform360 contact-support evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-contact-support.yml"
      - ".github/workflows/temporary-deform360-contact-support-evidence.yml"
      - "configs/causal4d_public/deform360_contact_support_v1.json"
      - "docs/causal4d_deform360_contact_support.md"
      - "scripts/remote/run_deform360_contact_support.py"
      - "scripts/remote/run_deform360_contact_support_workflow.sh"
      - "src/causal4d_public/deform360_contact_support_contract.py"
      - "src/causal4d_public/deform360_contact_support_diagnostic.py"
      - "src/causal4d_public/deform360_contact_support_episode.py"
      - "tests/test_deform360_contact_support_diagnostic.py"
      - "tests/test_deform360_contact_support_workflow_policy.py"

permissions:
  contents: read

concurrency:
  group: temporary-deform360-contact-support-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  contract:
    name: Validate exact diagnostic head
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Causal4D pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate source-only implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            scripts/remote/run_deform360_contact_support.py
            src/causal4d_public/deform360_contact_support_contract.py
            src/causal4d_public/deform360_contact_support_diagnostic.py
            src/causal4d_public/deform360_contact_support_episode.py
            tests/test_deform360_contact_support_diagnostic.py
            tests/test_deform360_contact_support_workflow_policy.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/deform360_contact_support_contract.py \
            src/causal4d_public/deform360_contact_support_diagnostic.py \
            src/causal4d_public/deform360_contact_support_episode.py \
            scripts/remote/run_deform360_contact_support.py
          bash -n scripts/remote/run_deform360_contact_support_workflow.sh
          python -m pytest -q \
            tests/test_deform360_contact_support_diagnostic.py \
            tests/test_deform360_contact_support_workflow_policy.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_replication_warp.py \
            tests/test_deform360_prefix_kinematics_milestone.py \
            tests/test_deform360_source_failure_attribution.py

  evaluate:
    name: Evaluate exact source-only mechanism panel
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: contract
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out exact Causal4D pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          persist-credentials: false
          clean: true

      - name: Initialize source-evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-contact-support
          printf '%s\n' \
            '{"schema_version":1,"state":"initialized","head_sha":"'"${PR_HEAD_SHA}"'","run_id":"'"${GITHUB_RUN_ID}"'"}' \
            > deform360-contact-support/status.json

      - name: Require BayesianPhysTwin read access
        env:
          BPT_READ_SSH_KEY: ${{ secrets.BPT_READ_SSH_KEY }}
        run: test -n "${BPT_READ_SSH_KEY}"

      - name: Select the conditional reproduction runtime
        shell: bash
        run: |
          set -euo pipefail
          selected="$(
            /usr/bin/python3 \
              scripts/remote/select_deform360_prefix_kinematics_python.py \
              --report deform360-contact-support/python-selection.json
          )"
          test -x "${selected}"
          echo "CONTACT_SUPPORT_PYTHON=${selected}" >> "$GITHUB_ENV"

      - name: Read locked repository pins
        id: repository-pins
        shell: bash
        run: |
          set -euo pipefail
          "$CONTACT_SUPPORT_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "configs/causal4d_public/deform360_replication_v1.json"
              ).read_text(encoding="utf-8")
          )["config"]
          pins = {
              "bpt_sha": subprocess.check_output(
                  [sys.executable, "scripts/ci/read_bpt_pin.py"],
                  text=True,
              ).strip(),
              "deform360_sha": protocol["deform360_code_commit"],
              "official_phystwin_sha": protocol["official_phystwin_commit"],
          }
          for name, value in pins.items():
              if type(value) is not str or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{name} is not a lowercase 40-hex commit")
              print(f"{name}={value}")
          PY

      - name: Check out pinned BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.repository-pins.outputs.bpt_sha }}
          ssh-key: ${{ secrets.BPT_READ_SSH_KEY }}
          path: _bpt
          persist-credentials: false
          clean: true

      - name: Check out pinned Deform360 code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ steps.repository-pins.outputs.deform360_sha }}
          path: _deform360
          persist-credentials: false
          clean: true

      - name: Check out pinned official PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jianghanxiao/PhysTwin
          ref: ${{ steps.repository-pins.outputs.official_phystwin_sha }}
          path: _official_phystwin
          persist-credentials: false
          clean: true

      - name: Run locked source-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/remote/run_deform360_contact_support_workflow.sh \
            "$PWD" \
            "$PWD/_bpt" \
            "$PWD/_deform360" \
            "$PWD/_official_phystwin" \
            "$PWD/deform360-contact-support" \
            2>&1 | tee deform360-contact-support/run.log
          "$CONTACT_SUPPORT_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deform360-contact-support/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "state": "completed",
                      "head_sha": os.environ["PR_HEAD_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "python": os.environ["CONTACT_SUPPORT_PYTHON"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-contact-support-evidence-${{ env.PR_HEAD_SHA }}
          path: deform360-contact-support/
          if-no-files-found: error
          retention-days: 30
