name: Apply single CLI PR payload

on:
  pull_request:
    branches:
      - agent/single-cli-apply-base
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: apply-single-cli-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/single-cli-surface' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/single-cli-surface
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          cat scripts/ci/single-cli-patch.xz.b64.part* > /tmp/single-cli.patch.xz.b64
          base64 --decode /tmp/single-cli.patch.xz.b64 > /tmp/single-cli.patch.xz
          echo "7f9f56ddcc0c2153bdca781d54d346775dc94ecdb4e97560a4f22e382b8daa2a  /tmp/single-cli.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/single-cli.patch.xz > /tmp/single-cli.patch
          echo "c38e683bab566ba789423edc20cae5d6840d2900e3df3e030c30fb10d0bf2452  /tmp/single-cli.patch" | sha256sum --check --strict
          git apply --check /tmp/single-cli.patch
          git apply /tmp/single-cli.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          marker = 'readme = "README.md"\n'
          license_line = 'license = { file = "LICENSE" }\n'
          if license_line not in text:
              if marker not in text:
                  raise SystemExit("pyproject readme marker is missing")
              text = text.replace(marker, marker + license_line, 1)
              path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/apply-single-cli.yml
          rm -f scripts/ci/single-cli-patch.xz.b64.part*
          git diff --check

      - name: Validate consolidated command surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests scripts/ci/check_console_help.py
          python -m pytest -q
          python -m build --wheel --sdist --outdir dist
          python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          scripts = payload["project"]["scripts"]
          assert scripts == {"causal4d": "causal4d.cli.root:main"}, scripts
          assert payload["project"]["version"] == "0.5.0"
          assert payload["project"]["license"] == {"file": "LICENSE"}
          PY
          rm -rf dist build

      - name: Publish implementation through Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: agent/single-cli-surface
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import urllib.error
          import urllib.request

          repository = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          target_branch = os.environ["TARGET_BRANCH"]
          api_root = f"https://api.github.com/repos/{repository}"

          def api(method: str, path: str, payload: object | None = None) -> dict:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.read().decode("utf-8", errors="replace"))
                  raise

          main_ref = api("GET", "/git/ref/heads/main")
          base_sha = main_ref["object"]["sha"]
          base_commit = api("GET", f"/git/commits/{base_sha}")
          base_tree_sha = base_commit["tree"]["sha"]

          diff = subprocess.check_output(
              ["git", "diff", "--cached", "--name-status", "-z", "origin/main", "--"],
              text=False,
          ).split(b"\0")
          entries: list[dict[str, object]] = []
          index = 0
          while index < len(diff) and diff[index]:
              status_code = diff[index].decode("ascii")
              index += 1
              if status_code.startswith(("R", "C")):
                  raise SystemExit(f"unsupported rename/copy status: {status_code}")
              path = diff[index].decode("utf-8")
              index += 1
              if status_code == "D":
                  # Staging transport files are absent from current main, so no tree
                  # deletion entry is needed when constructing from main's base tree.
                  continue
              if status_code not in {"A", "M", "T"}:
                  raise SystemExit(f"unsupported diff status: {status_code} {path}")
              file_path = Path(path)
              if file_path.is_symlink():
                  content = os.readlink(file_path).encode("utf-8")
                  mode = "120000"
              else:
                  content = file_path.read_bytes()
                  mode = (
                      "100755"
                      if file_path.stat().st_mode & stat.S_IXUSR
                      else "100644"
                  )
              blob = api(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              entries.append(
                  {"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]}
              )

          if not entries:
              raise SystemExit("no implementation changes were detected")
          tree = api(
              "POST",
              "/git/trees",
              {"base_tree": base_tree_sha, "tree": entries},
          )
          commit = api(
              "POST",
              "/git/commits",
              {
                  "message": "Consolidate Causal4D into one executable",
                  "tree": tree["sha"],
                  "parents": [base_sha],
              },
          )
          api(
              "PATCH",
              f"/git/refs/heads/{target_branch}",
              {"sha": commit["sha"], "force": True},
          )
          print(json.dumps({"base_sha": base_sha, "commit_sha": commit["sha"], "files": len(entries)}))
          PY
