name: Temporary provider hardening formatter

on:
  push:
    branches:
      - agent/harden-provider-manifest-loading

permissions:
  contents: write

concurrency:
  group: tmp-provider-hardening-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-provider-manifest-loading
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Harden falsey requirement inputs and format
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d/provider_contract.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        required_artifact_versions or {},\n"
              "        name=\"required_artifact_versions\",\n"
          )
          new = (
              "        (\n"
              "            {}\n"
              "            if required_artifact_versions is None\n"
              "            else required_artifact_versions\n"
              "        ),\n"
              "        name=\"required_artifact_versions\",\n"
          )
          if old not in text:
              raise RuntimeError("provider requirement normalization marker is missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            src/causal4d/provider_contract.py \
            tests/test_causal4d_provider_contract.py
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/provider_contract.py \
            tests/test_causal4d_provider_contract.py
          git rm .github/workflows/tmp-provider-hardening-format.yml
          git commit -m "Format strict provider manifest validation"
          git push origin HEAD:agent/harden-provider-manifest-loading
