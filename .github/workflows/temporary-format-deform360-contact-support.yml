name: Temporary format Deform360 contact-support

on:
  push:
    branches:
      - agent/deform360-contact-support-v1

permissions:
  contents: write

concurrency:
  group: temporary-format-deform360-contact-support
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-contact-support-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Format, validate, and publish
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            src/causal4d_public/deform360_contact_support_contract.py
            tests/test_deform360_contact_support_diagnostic.py
            tests/test_deform360_contact_support_workflow_policy.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q \
            tests/test_deform360_contact_support_diagnostic.py \
            tests/test_deform360_contact_support_workflow_policy.py
          git diff --check
          git config --local core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m "Format Deform360 contact-support diagnostic"
          git push origin HEAD:agent/deform360-contact-support-v1
