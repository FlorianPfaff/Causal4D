name: Format diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print exact Ruff formatting diff
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.0'
          args: >-
            format --diff
            src/causal4d/prob4d_observation_lineage.py
            tests/test_prob4d_stream_contract_version.py
