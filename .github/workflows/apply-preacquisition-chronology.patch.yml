name: Apply pre-acquisition chronology hardening

on:
  push:
    branches:
      - agent/preacquisition-evidence-chronology
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
      - name: Decode, verify, and apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path
          import zlib

          encoded = Path('.github/agent-pr67-chronology.patch.z.b64').read_text().strip()
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          expected = '16d683d73f1e5f243e25b0e7d8136e5d849452d8dc5a8151d18a092c781f6165'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch digest mismatch: {actual} != {expected}')
          Path('/tmp/preacquisition-chronology.patch').write_bytes(patch)
          PY
          git apply --check /tmp/preacquisition-chronology.patch
          git apply --index /tmp/preacquisition-chronology.patch
          git rm .github/agent-pr67-chronology.patch.z.b64
          git rm .github/workflows/apply-preacquisition-chronology.patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Enforce pre-acquisition evidence chronology'
          git push origin "HEAD:${HEAD_BRANCH}"
