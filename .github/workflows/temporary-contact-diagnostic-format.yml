name: Temporary contact diagnostic formatter

on:
  push:
    branches:
      - agent/reproducibility-contact-diagnostics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reproducibility-contact-diagnostics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Apply canonical Ruff formatting
        run: |
          set -euo pipefail
          python -m pip install "ruff==0.16.1"
          python -m ruff format \
            scripts/ci/analyze_contact_posterior.py \
            src/causal4d/contact_posterior_diagnostics.py \
            tests/test_contact_posterior_diagnostics.py
          if git diff --quiet --exit-code; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/ci/analyze_contact_posterior.py \
            src/causal4d/contact_posterior_diagnostics.py \
            tests/test_contact_posterior_diagnostics.py
          git commit -m "Format contact posterior diagnostics"
          git push origin HEAD:agent/reproducibility-contact-diagnostics
