name: PR 45 format repair

on:
  push:
    branches: ["agent/resumable-phystwin-rollout-cache"]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: pr45-format-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'agent/resumable-phystwin-rollout-cache' || github.ref_name == 'agent/resumable-phystwin-rollout-cache'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/resumable-phystwin-rollout-cache
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply and verify Ruff formatting
        run: |
          files=(
            scripts/ci/run_bpt_integration_tests.py
            src/causal4d/cli/counterfactual_phystwin.py
            src/causal4d/cli/phystwin_rollout_bank.py
            src/causal4d/phystwin_resumable.py
            src/causal4d/rollout_cache.py
            tests/conftest.py
            tests/test_phystwin_resumable.py
            tests/test_rollout_cache.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
      - name: Run public cache tests and capture diagnostics
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_rollout_cache.py \
            > pr45-pytest-diagnostics.txt 2>&1
          status=$?
          cat pr45-pytest-diagnostics.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish formatting or diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status="${{ steps.focused.outputs.status }}"
          if [[ "${status}" == "0" ]]; then
            rm -f pr45-pytest-diagnostics.txt
            rm .github/workflows/pr45-format-repair.yml
            message="Format and validate rollout-cache implementation"
          else
            message="Capture rollout-cache test diagnostics"
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to publish"
            [[ "${status}" == "0" ]]
            exit
          fi
          git commit -m "${message}"
          git push origin HEAD:agent/resumable-phystwin-rollout-cache
          [[ "${status}" == "0" ]]
