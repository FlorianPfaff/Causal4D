name: PR 45 format repair

on:
  push:
    branches: ["agent/resumable-phystwin-rollout-cache"]

permissions:
  contents: write

concurrency:
  group: pr45-format-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/resumable-phystwin-rollout-cache
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply and verify Ruff formatting
        run: |
          files=(
            scripts/ci/run_bpt_integration_tests.py
            src/causal4d/cli/counterfactual_phystwin.py
            src/causal4d/cli/phystwin_rollout_bank.py
            src/causal4d/phystwin_resumable.py
            src/causal4d/rollout_cache.py
            tests/conftest.py
            tests/test_phystwin_resumable.py
            tests/test_rollout_cache.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
      - name: Run focused cache tests
        run: python -m pytest -q tests/test_rollout_cache.py tests/test_phystwin_resumable.py
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/pr45-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "Format rollout-cache implementation"
          git push origin HEAD:agent/resumable-phystwin-rollout-cache
