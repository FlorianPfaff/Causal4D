name: Format command registry once

on:
  push:
    branches:
      - agent/single-cli-surface
    paths:
      - .github/workflows/format-command-registry-once.yml
      - src/causal4d/cli/command_registry.py

permissions:
  contents: write

jobs:
  format:
    name: Apply pinned Ruff formatting
    if: github.event.head_commit.message != 'Format command registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install the CI formatter
        run: python -m pip install --disable-pip-version-check --no-deps 'ruff==0.16.1'
      - name: Format only the failing registry
        run: |
          set -euo pipefail
          python -m ruff format src/causal4d/cli/command_registry.py
          python -m ruff format --check src/causal4d/cli/command_registry.py
          git diff --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/causal4d/cli/command_registry.py; then
            echo 'No formatter change was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/causal4d/cli/command_registry.py
          git commit -m 'Format command registry'
          git push origin "HEAD:${GITHUB_REF_NAME}"
