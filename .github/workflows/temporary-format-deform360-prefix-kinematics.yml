name: Temporary format Deform360 prefix kinematics

on:
  push:
    branches:
      - agent/deform360-prefix-kinematics-v1
    paths:
      - ".github/workflows/temporary-format-deform360-prefix-kinematics.yml"

permissions:
  contents: write

concurrency:
  group: temporary-format-deform360-prefix-kinematics
  cancel-in-progress: true

jobs:
  format-and-publish:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref_name == 'agent/deform360-prefix-kinematics-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-prefix-kinematics-v1
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Format and validate the exact diagnostic surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            scripts/remote/find_deform360_replication_root.py
            scripts/remote/run_deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics.py
            tests/test_deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics_workflow_policy.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q \
            tests/test_deform360_prefix_kinematics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_prefix_kinematics_workflow_policy.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_source_failure_attribution.py
          bash -n scripts/remote/run_deform360_prefix_kinematics_workflow.sh
          git diff --check

      - name: Remove this one-shot workflow and publish formatting
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-format-deform360-prefix-kinematics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d_public/deform360_prefix_kinematics.py \
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_prefix_kinematics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            .github/workflows/temporary-format-deform360-prefix-kinematics.yml
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 1
          fi
          git commit -m "Format Deform360 prefix-kinematics diagnostic"
          basic_auth="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c \
            http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:agent/deform360-prefix-kinematics-v1
