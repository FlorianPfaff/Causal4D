name: Format PR77 chronology regression

on:
  push:
    branches:
      - agent/preacquisition-evidence-chronology

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/preacquisition-evidence-chronology
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Apply pinned formatter
        run: |
          python -m pip install 'ruff>=0.15.22,<0.17'
          python -m ruff format tests/test_real_evidence_contract_v2.py
      - name: Commit formatted regression
        run: |
          git rm .github/workflows/format-pr77.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_real_evidence_contract_v2.py
          git commit -m 'Format pre-acquisition chronology regression'
          git push origin HEAD:agent/preacquisition-evidence-chronology
