name: Rebase PR 214 graph-contact diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebase-pr214-graph-contact.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-pr214-graph-contact-diagnostics
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 95eeda13d61fe6eeb1f96a98d7b3c115e6f51796
  PRODUCT_BRANCH: agent/graph-contact-measure-v1

jobs:
  rebuild:
    name: Rebuild four-file product diff on current main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable source head and rebuild product commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            "${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PRODUCT_BRANCH}")" \
            = "${EXPECTED_HEAD}"
          source_head="${EXPECTED_HEAD}"
          base_head="$(git rev-parse origin/main)"
          git checkout -B pr214-rebuilt "${base_head}"
          git checkout "${source_head}" -- \
            docs/causal4d_graph_contact_measure.md \
            src/causal4d/graph_contact_distance.py \
            src/causal4d/graph_contact_measure.py \
            tests/test_graph_contact_measure.py
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/causal4d_graph_contact_measure.md
          src/causal4d/graph_contact_distance.py
          src/causal4d/graph_contact_measure.py
          tests/test_graph_contact_measure.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(git rev-parse ":docs/causal4d_graph_contact_measure.md")" \
            = "46d682261d4e2c32b61445832e3128f757a6cf71"
          test "$(git rev-parse ":src/causal4d/graph_contact_distance.py")" \
            = "69ca68aa43358cc1a740a84d97759f06a4ff7f28"
          test "$(git rev-parse ":src/causal4d/graph_contact_measure.py")" \
            = "8bcf6ea857dda2a63e379244947fd02a80f3e6e5"
          test "$(git rev-parse ":tests/test_graph_contact_measure.py")" \
            = "dd44f5044a24dcc246c3756625bffc5a5c55f08f"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add graph-valued contact posterior diagnostics"

      - name: Validate focused and repository quality boundaries
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m ruff format --check \
            src/causal4d/graph_contact_distance.py \
            src/causal4d/graph_contact_measure.py \
            tests/test_graph_contact_measure.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f \
              src/causal4d/graph_contact_distance.py \
              src/causal4d/graph_contact_measure.py \
              tests/test_graph_contact_measure.py
          python -m pytest -q tests/test_graph_contact_measure.py
          git diff --check origin/main...HEAD

      - name: Publish rebuilt branch with lease
        run: |
          git push --force-with-lease=refs/heads/${PRODUCT_BRANCH}:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/${PRODUCT_BRANCH}

      - name: Remove this temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f \
            cleanup/.github/workflows/rebase-pr214-graph-contact.yml; then
            git -C cleanup rm \
              .github/workflows/rebase-pr214-graph-contact.yml
            git -C cleanup commit -m \
              "Remove temporary PR 214 rebase workflow"
            git -C cleanup push origin HEAD:main
          fi
