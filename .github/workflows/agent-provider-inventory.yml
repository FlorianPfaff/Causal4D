name: Agent provider inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'agent/bpt-provider-api-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory private Bayesian-PhysTwin imports
        run: |
          mkdir -p .agent
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          records = []
          for root_name in ("src", "scripts", "tests"):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  try:
                      tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.ImportFrom):
                          continue
                      if not (node.module or "").startswith("bayesian_phystwin."):
                          continue
                      private = [alias.name for alias in node.names if alias.name.startswith("_")]
                      if private:
                          records.append(
                              {
                                  "path": str(path),
                                  "line": node.lineno,
                                  "module": node.module,
                                  "names": private,
                              }
                          )
          result = {
              "imports": records,
              "private_name_count": sum(len(item["names"]) for item in records),
          }
          Path(".agent/bpt_private_imports.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("BPT_PRIVATE_IMPORT_COUNT=" + str(result["private_name_count"]))
          PY
      - name: Package source snapshot
        run: tar --exclude=.git -czf /tmp/causal4d-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: causal4d-source
          path: /tmp/causal4d-source.tgz
          retention-days: 1
