name: Apply reviewed provider migration patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/bpt-provider-api-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bpt-provider-api-v1

      - name: Decode reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/provider.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/provider.patch
          test "$(sha256sum /tmp/provider.patch | cut -d' ' -f1)" = \
            "b9340285e4a9006ac40318ae62f7f8e524102c843a824debfab0ab0c3f7f7f7d"

      - name: Apply and commit reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/provider.patch
          git apply /tmp/provider.patch
          rm -f .github/workflows/bayesian-phystwin-provider-compatibility.yml
          git rm -r .agent
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consume the Bayesian-PhysTwin provider API"

      - name: Push reviewed migration
        run: git push origin HEAD:agent/bpt-provider-api-v1
