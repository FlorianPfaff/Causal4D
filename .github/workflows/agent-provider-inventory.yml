name: Apply reviewed provider migration patch

on:
  push:
    branches: [agent/bpt-provider-api-v1]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bpt-provider-api-v1
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/provider.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/provider.patch
          echo "b9340285e4a9006ac40318ae62f7f8e524102c843a824debfab0ab0c3f7f7f7d  /tmp/provider.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/provider.patch
          git apply /tmp/provider.patch
          git rm -r .agent .github/workflows/agent-provider-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consume the Bayesian-PhysTwin provider API"
          git push origin HEAD:agent/bpt-provider-api-v1
