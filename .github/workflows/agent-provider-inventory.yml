name: Apply reviewed BPT provider migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      contains(github.event.head_commit.message,
      'Bootstrap reviewed BPT provider migration')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/provider.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/provider.patch
          test "$(sha256sum /tmp/provider.patch | cut -d' ' -f1)" = \
            "b9340285e4a9006ac40318ae62f7f8e524102c843a824debfab0ab0c3f7f7f7d"
          git apply --check /tmp/provider.patch
      - name: Apply migration on a clean branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c agent/applied-bpt-provider-api-v1
          git apply /tmp/provider.patch
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          revision = "9f58f4608cfcb0ec215d370395b46d519effb676"
          pattern = re.compile(
              r"(Bayesian-PhysTwin\.git@)[0-9a-f]{40}"
          )
          text, count = pattern.subn(lambda match: match.group(1) + revision, text)
          if count == 0:
              raise RuntimeError("the reviewed patch contains no exact BPT git pin")
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/bayesian-phystwin-provider-compatibility.yml
          git rm -r .agent
          git rm .github/workflows/agent-provider-inventory.yml
      - name: Validate migrated source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          python -m pytest -q --tb=short
          git diff --check
      - name: Commit and publish applied branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consume Bayesian-PhysTwin provider API v1"
          git push origin HEAD:agent/applied-bpt-provider-api-v1
