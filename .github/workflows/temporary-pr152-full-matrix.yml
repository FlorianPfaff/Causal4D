name: Temporary PR 152 full trusted matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr152-full-matrix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Check out mutable pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-contract-evidence-boundaries
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Run Python 3.10 quality and core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-3.10
          .core-3.10/bin/python -m pip install --upgrade pip
          .core-3.10/bin/python -m pip install -e ".[dev]"
          .core-3.10/bin/python -m pip check
          .core-3.10/bin/python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into 3.10 core: {present}")
          PY
          .core-3.10/bin/python -m ruff check .
          .core-3.10/bin/python -m ruff format --check \
            src/causal4d/contracts.py \
            src/causal4d/immutable_array.py \
            src/causal4d/observation_evidence.py \
            tests/test_causal4d_contracts.py \
            tests/test_observation_evidence.py
          .core-3.10/bin/python -m mypy \
            scripts/ci \
            src/causal4d/atomic_io.py \
            src/causal4d/immutable_array.py \
            src/causal4d/immutable_json.py \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py
          .core-3.10/bin/python -m pytest -q

      - name: Run exact dependency floors on Python 3.10
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .floor-build-3.10
          .floor-build-3.10/bin/python -m pip install build
          .floor-build-3.10/bin/python -m build --wheel --outdir dist-floor
          python -m venv .floor-3.10
          .floor-3.10/bin/python -m pip install \
            "numpy==1.24.0" \
            "packaging==23.0" \
            "scipy==1.10.0" \
            "pytest==8.0.0"
          artifact=$(find dist-floor -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$artifact"
          .floor-3.10/bin/python -m pip install --no-deps "$artifact"
          .floor-3.10/bin/python -m pip check
          .floor-3.10/bin/python - <<'PY'
          import importlib.util
          from importlib.metadata import version

          expected = {
              "numpy": "1.24.0",
              "packaging": "23.0",
              "scipy": "1.10.0",
              "pytest": "8.0.0",
          }
          actual = {name: version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"dependency floors drifted: {actual!r}")
          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into floor suite: {present}")
          PY
          .floor-3.10/bin/python -m pytest -q

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run Python 3.11 core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-3.11
          .core-3.11/bin/python -m pip install --upgrade pip
          .core-3.11/bin/python -m pip install -e ".[dev]"
          .core-3.11/bin/python -m pip check
          .core-3.11/bin/python - <<'PY'
          import importlib.util
          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into 3.11 core: {present}")
          PY
          .core-3.11/bin/python -m pytest -q

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Python 3.12 core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-3.12
          .core-3.12/bin/python -m pip install --upgrade pip
          .core-3.12/bin/python -m pip install -e ".[dev]"
          .core-3.12/bin/python -m pip check
          .core-3.12/bin/python - <<'PY'
          import importlib.util
          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into 3.12 core: {present}")
          PY
          .core-3.12/bin/python -m pytest -q

      - name: Build and inspect installed artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          .core-3.12/bin/python -m build
          .core-3.12/bin/python -m twine check dist/*
          for kind in wheel sdist; do
            venv=".artifact-${kind}-3.12"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade pip
            if [[ "$kind" == wheel ]]; then
              artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
            else
              artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
            fi
            test -n "$artifact"
            "$venv/bin/python" -m pip install "$artifact"
            "$venv/bin/python" -m pip check
            "$venv/bin/python" - <<'PY'
          import importlib.util
          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into installed artifact: {present}")
          PY
            PATH="$PWD/$venv/bin:$PATH" \
              "$venv/bin/python" scripts/ci/check_console_help.py \
                --pyproject pyproject.toml
          done

      - name: Produce, archive, and consume smoke bundles
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .bundle-3.12
          .bundle-3.12/bin/python -m pip install --upgrade pip
          .bundle-3.12/bin/python -m pip install -e .
          PATH="$PWD/.bundle-3.12/bin:$PATH" \
            causal4d benchmark counterfactual \
              --output-dir build/bundles/counterfactual \
              --seeds 0 \
              --frames 18 \
              --training-repeats 1 \
              --parameter-grid-count 3
          PATH="$PWD/.bundle-3.12/bin:$PATH" \
            causal4d benchmark latent-contact \
              --output-dir build/bundles/latent-contact \
              --seeds 0 \
              --frames 18 \
              --training-repeats 1 \
              --parameter-grid-count 3 \
              --contact-parameter-particles 4
          .bundle-3.12/bin/python scripts/ci/verify_result_bundle.py \
            build/bundles/counterfactual/manifest.json
          .bundle-3.12/bin/python scripts/ci/verify_result_bundle.py \
            build/bundles/latent-contact/manifest.json
          mkdir -p build/archives build/consumed
          tar -C build/bundles -czf build/archives/counterfactual.tar.gz counterfactual
          tar -C build/bundles -czf build/archives/latent-contact.tar.gz latent-contact
          tar -C build/consumed -xzf build/archives/counterfactual.tar.gz
          tar -C build/consumed -xzf build/archives/latent-contact.tar.gz
          .bundle-3.12/bin/python scripts/ci/verify_result_bundle.py \
            build/consumed/counterfactual/manifest.json
          .bundle-3.12/bin/python scripts/ci/verify_result_bundle.py \
            build/consumed/latent-contact/manifest.json
          .core-3.12/bin/python scripts/ci/verify_frozen_manifest.py \
            milestones/v0.3.0-causal4d-aip

      - name: Require BayesianPhysTwin credential
        env:
          BPT_READ_SSH_KEY: ${{ secrets.BPT_READ_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BPT_READ_SSH_KEY"

      - name: Read exact BayesianPhysTwin pin
        id: bpt-pin
        shell: bash
        run: |
          echo "sha=$(.core-3.12/bin/python scripts/ci/read_bpt_pin.py)" \
            >> "$GITHUB_OUTPUT"

      - name: Check out pinned BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.bpt-pin.outputs.sha }}
          ssh-key: ${{ secrets.BPT_READ_SSH_KEY }}
          path: _bpt
          persist-credentials: false

      - name: Run pinned BayesianPhysTwin integration
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .bpt-3.12
          .bpt-3.12/bin/python -m pip install --upgrade pip
          .bpt-3.12/bin/python -m pip install -e ".[dev]"
          .bpt-3.12/bin/python -m pip install -e ./_bpt
          .bpt-3.12/bin/python -m pip check
          .bpt-3.12/bin/python scripts/ci/run_bpt_integration_tests.py

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run Python 3.13 core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-3.13
          .core-3.13/bin/python -m pip install --upgrade pip
          .core-3.13/bin/python -m pip install -e ".[dev]"
          .core-3.13/bin/python -m pip check
          .core-3.13/bin/python - <<'PY'
          import importlib.util
          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into 3.13 core: {present}")
          PY
          .core-3.13/bin/python -m pytest -q

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run Python 3.14 core suite
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .core-3.14
          .core-3.14/bin/python -m pip install --upgrade pip
          .core-3.14/bin/python -m pip install -e ".[dev]"
          .core-3.14/bin/python -m pip check
          .core-3.14/bin/python - <<'PY'
          import importlib.util
          forbidden = ("bayesian_phystwin", "cv2", "pyrecest", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into 3.14 core: {present}")
          PY
          .core-3.14/bin/python -m pytest -q

      - name: Publish matrix evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            .core-* \
            .floor-* \
            .artifact-* \
            .bundle-* \
            .bpt-* \
            _bpt \
            dist \
            dist-floor \
            build \
            .pytest_cache
          git rm .github/workflows/temporary-pr152-full-matrix.yml
          git add --all
          git diff --cached --check
          git commit \
            -m "Record full trusted matrix for contract hardening" \
            -m "workflow_run_id=${GITHUB_RUN_ID};python=3.10,3.11,3.12,3.13,3.14;dependency_floors=passed;pinned_bpt=passed;artifacts=passed;bundles=passed;frozen_manifest=passed"
          git push origin HEAD:agent/harden-contract-evidence-boundaries
