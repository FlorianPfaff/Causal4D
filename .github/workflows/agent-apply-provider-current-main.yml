name: Apply reviewed provider migration to current main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message,
       'Bootstrap current-main BPT provider migration')) ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/run-bpt-provider-current-main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/provider.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/provider.patch
          test "$(sha256sum /tmp/provider.patch | cut -d' ' -f1)" = \
            "b9340285e4a9006ac40318ae62f7f8e524102c843a824debfab0ab0c3f7f7f7d"
      - name: Apply to current main
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git switch -C agent/applied-bpt-provider-current-main
          if ! git apply --3way --index /tmp/provider.patch; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || \
                  "${conflicts[0]}" != "src/causal4d/__init__.py" ]]; then
              {
                echo "git status --short"
                git status --short
                echo
                echo "unmerged index entries"
                git ls-files -u
              } > provider-apply-conflicts.txt
              exit 1
            fi
            git checkout --ours src/causal4d/__init__.py
            git add src/causal4d/__init__.py
          fi
          python - <<'PY'
          from pathlib import Path

          init_path = Path("src/causal4d/__init__.py")
          text = init_path.read_text(encoding="utf-8")
          old_import = '''from causal4d.provider_contract import (
              BASE_CAUSAL4D_PROVIDER_CAPABILITIES,
              PHYSICAL_BELIEF_PROVIDER_SCHEMA_VERSION,
              PhysicalBeliefProviderManifest,
              ProviderCompatibilityResult,
              validate_provider_compatibility,
          )'''
          new_import = '''from causal4d.provider_contract import (
              BASE_CAUSAL4D_PROVIDER_CAPABILITIES,
              BAYESIAN_PHYSTWIN_ARTIFACT_SCHEMA_VERSIONS,
              BAYESIAN_PHYSTWIN_COMPATIBILITY_RANGE,
              BAYESIAN_PHYSTWIN_PROVIDER_CAPABILITIES,
              PHYSICAL_BELIEF_PROVIDER_SCHEMA_VERSION,
              PhysicalBeliefProviderManifest,
              ProviderCompatibilityResult,
              load_bayesian_phystwin_provider_manifest,
              require_bayesian_phystwin_provider,
              validate_bayesian_phystwin_provider,
              validate_provider_compatibility,
          )'''
          if old_import not in text and new_import not in text:
              raise RuntimeError("provider-contract import block changed unexpectedly")
          text = text.replace(old_import, new_import, 1)

          additions = {
              '    "BASE_CAUSAL4D_PROVIDER_CAPABILITIES",\n': (
                  '    "BASE_CAUSAL4D_PROVIDER_CAPABILITIES",\n'
                  '    "BAYESIAN_PHYSTWIN_ARTIFACT_SCHEMA_VERSIONS",\n'
                  '    "BAYESIAN_PHYSTWIN_COMPATIBILITY_RANGE",\n'
                  '    "BAYESIAN_PHYSTWIN_PROVIDER_CAPABILITIES",\n'
              ),
              '    "load_graph_discrepancy_belief",\n': (
                  '    "load_bayesian_phystwin_provider_manifest",\n'
                  '    "load_graph_discrepancy_belief",\n'
              ),
              '    "run_counterfactual_benchmark",\n': (
                  '    "require_bayesian_phystwin_provider",\n'
                  '    "run_counterfactual_benchmark",\n'
              ),
              '    "validate_provider_compatibility",\n': (
                  '    "validate_bayesian_phystwin_provider",\n'
                  '    "validate_provider_compatibility",\n'
              ),
          }
          for anchor, replacement in additions.items():
              if replacement not in text:
                  if anchor not in text:
                      raise RuntimeError(f"initializer anchor missing: {anchor!r}")
                  text = text.replace(anchor, replacement, 1)
          text = text.replace('__version__ = "0.3.0"', '__version__ = "0.4.1"')
          init_path.write_text(text, encoding="utf-8")

          project_path = Path("pyproject.toml")
          project = project_path.read_text(encoding="utf-8")
          project = project.replace('version = "0.4.0"', 'version = "0.4.1"', 1)
          project_path.write_text(project, encoding="utf-8")
          PY
          git add src/causal4d/__init__.py pyproject.toml
          git rm -r .agent
          git rm .github/workflows/agent-apply-provider-current-main.yml
          rm -f .github/provider-current-main-trigger
      - name: Upload unexpected conflict report
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: provider-current-main-conflicts
          path: provider-apply-conflicts.txt
          if-no-files-found: error
          retention-days: 2
      - name: Stop after unexpected conflict report
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1
      - name: Validate current Causal4D suite
        if: steps.apply_patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests scripts
          python -m pytest --tb=short
          python -m ruff check .
          git diff --check
      - name: Commit and publish clean branch
        id: publish
        if: steps.apply_patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          compatibility_workflow=
            ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
          cp "$compatibility_workflow" /tmp/bpt-provider-compatibility.yml
          rm "$compatibility_workflow"
          {
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Consume Bayesian-PhysTwin provider API v1"
            git push --force origin \
              HEAD:agent/applied-bpt-provider-current-main
          } > /tmp/provider-publish.log 2>&1
          status=$?
          cat /tmp/provider-publish.log
          exit "$status"
      - name: Upload compatibility workflow
        if: steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: bpt-provider-compatibility-workflow
          path: /tmp/bpt-provider-compatibility.yml
          if-no-files-found: error
          retention-days: 2
      - name: Upload publication failure
        if: steps.publish.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: provider-current-main-publication
          path: /tmp/provider-publish.log
          if-no-files-found: error
          retention-days: 2
      - name: Stop after publication failure
        if: steps.publish.outcome == 'failure'
        run: exit 1
