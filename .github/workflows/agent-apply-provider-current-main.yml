name: Apply reviewed provider migration to current main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message,
       'Bootstrap current-main BPT provider migration')) ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'agent/run-bpt-provider-current-main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/provider.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/provider.patch
          test "$(sha256sum /tmp/provider.patch | cut -d' ' -f1)" = \
            "b9340285e4a9006ac40318ae62f7f8e524102c843a824debfab0ab0c3f7f7f7d"
      - name: Apply to current main
        shell: bash
        run: |
          set -euo pipefail
          git switch -C agent/applied-bpt-provider-current-main
          git apply --3way --index /tmp/provider.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('version = "0.4.0"', 'version = "0.4.1"', 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(
              ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
          )
          if workflow.exists():
              text = workflow.read_text(encoding="utf-8")
              secret_expression = "$" + "{{ secrets.BPT_READ_TOKEN }}"
              token_expression = "$" + "{{ env.BPT_READ_TOKEN }}"
              text = text.replace(
                  "jobs:\n  compatibility:\n",
                  "jobs:\n  compatibility:\n"
                  "    env:\n"
                  f"      BPT_READ_TOKEN: {secret_expression}\n",
                  1,
              )
              text = text.replace(
                  "    steps:\n      - name: Check out Causal4D\n",
                  "    steps:\n"
                  "      - name: Report unavailable private-repository token\n"
                  "        if: env.BPT_READ_TOKEN == ''\n"
                  "        run: echo 'Set BPT_READ_TOKEN to run private BPT compatibility checks.'\n"
                  "      - name: Check out Causal4D\n"
                  "        if: env.BPT_READ_TOKEN != ''\n",
                  1,
              )
              text = text.replace(
                  "      - name: Check out Bayesian-PhysTwin\n",
                  "      - name: Check out Bayesian-PhysTwin\n"
                  "        if: env.BPT_READ_TOKEN != ''\n",
                  1,
              )
              text = text.replace(
                  "          path: bayesian-phystwin\n",
                  "          path: bayesian-phystwin\n"
                  f"          token: {token_expression}\n",
                  1,
              )
              for name in (
                  "Set up Python",
                  "Install both repositories",
                  "Run cross-repository compatibility tests",
              ):
                  text = text.replace(
                      f"      - name: {name}\n",
                      f"      - name: {name}\n"
                      "        if: env.BPT_READ_TOKEN != ''\n",
                      1,
                  )
              workflow.write_text(text, encoding="utf-8")
          PY
          git rm -r .agent
          git rm .github/workflows/agent-apply-provider-current-main.yml
          rm -f .github/provider-current-main-trigger
      - name: Validate current Causal4D suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests scripts
          python -m pytest --tb=short
          python -m ruff check .
          git diff --check
      - name: Commit and publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consume Bayesian-PhysTwin provider API v1"
          git push --force origin \
            HEAD:agent/applied-bpt-provider-current-main
