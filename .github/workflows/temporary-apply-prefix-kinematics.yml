name: Temporary apply Deform360 prefix-kinematics patch

on:
  push:
    branches:
      - agent/deform360-prefix-kinematics-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-apply-deform360-prefix-kinematics
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-prefix-kinematics-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: python -m pip install -e ".[dev]"

      - name: Apply, validate, and publish clean non-workflow product
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/deform360-prefix-kinematics/part* \
            | base64 --decode > /tmp/causal4d-prefix-kinematics-patch.tar.gz
          echo "8c5e3a2fe06d1d7baa01fcaa00d3058bd57acd8f25d0ec3f3df6a6eb8cd58983  /tmp/causal4d-prefix-kinematics-patch.tar.gz" \
            | sha256sum --check -
          tar -xzf /tmp/causal4d-prefix-kinematics-patch.tar.gz -C .

          # GitHub's workflow token may not create workflow files. Publish the
          # validated code product first; the permanent workflow is added in a
          # separate content-addressed Git-data commit.
          rm -f .github/workflows/deform360-prefix-kinematics.yml
          rm -rf .tmp/deform360-prefix-kinematics
          rm -f .github/workflows/temporary-apply-prefix-kinematics.yml
          chmod +x \
            scripts/remote/find_deform360_replication_root.py \
            scripts/remote/run_deform360_prefix_kinematics.py \
            scripts/remote/run_deform360_prefix_kinematics_workflow.sh

          python -m pytest -q \
            tests/test_deform360_prefix_kinematics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py
          bash -n scripts/remote/run_deform360_prefix_kinematics_workflow.sh
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add source-only Deform360 prefix kinematics diagnostic"
          git push origin HEAD:agent/deform360-prefix-kinematics-v1
