name: Bayesian-PhysTwin main compatibility

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bpt-main-compatibility
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  bpt-main:
    name: Causal4D against Bayesian-PhysTwin main
    runs-on: ubuntu-latest
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Detect private-repository credential
        id: access
        env:
          BPT_REPOSITORY_TOKEN: ${{ secrets.BPT_REPOSITORY_TOKEN }}
        run: |
          if [[ -n "${BPT_REPOSITORY_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BPT_REPOSITORY_TOKEN is not configured; nightly BPT-main compatibility was not exercised."
            echo "### Bayesian-PhysTwin main compatibility" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped because the repository secret \`BPT_REPOSITORY_TOKEN\` is absent." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out Bayesian-PhysTwin main
        if: steps.access.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: FlorianPfaff/Bayesian-PhysTwin
          ref: main
          token: ${{ secrets.BPT_REPOSITORY_TOKEN }}
          path: _bpt
      - name: Install both development trees
        if: steps.access.outputs.enabled == 'true'
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e ./_bpt
          python -m pip check
      - name: Run compatibility suite
        if: steps.access.outputs.enabled == 'true'
        run: python scripts/ci/run_bpt_integration_tests.py
