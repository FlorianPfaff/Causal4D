name: Format finite-support patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install pinned formatter
        run: python -m pip install 'ruff>=0.15.22,<0.17'
      - name: Format changed inference modules
        run: |
          python -m ruff format \
            src/causal4d/closed_loop.py \
            src/causal4d/dynamic_contact.py \
            src/causal4d/graph_mode_abduction.py \
            src/causal4d/hierarchical_abduction.py \
            src/causal4d/molmo_acceptance.py \
            src/causal4d/sensor_factorized_abduction.py
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/causal4d
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Format finite-support invariant changes'
          git push origin "HEAD:${HEAD_BRANCH}"
