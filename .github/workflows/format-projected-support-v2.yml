name: Format projected-support V2 branch

on:
  push:
    branches:
      - agent/projected-support-v2-profile
    paths:
      - .github/workflows/format-projected-support-v2.yml

permissions:
  contents: write

concurrency:
  group: format-projected-support-v2
  cancel-in-progress: false

jobs:
  format:
    name: Format, validate, and publish the reviewed branch
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref == 'refs/heads/agent/projected-support-v2-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact clean branch event
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = \
            "agent/projected-support-v2-profile"
          test -z "$(git status --porcelain)"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the repository development tools
        run: python -m pip install -e ".[dev]"

      - name: Apply the repository formatter and validate the focused scope
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/causal4d/_projected_functional_support_common.py
            src/causal4d/_projected_functional_support_inputs.py
            src/causal4d/_projected_functional_support_outputs.py
            src/causal4d/projected_functional_support_v1.py
            src/causal4d/prospective_v2_profile.py
            tests/test_projected_functional_support_v1.py
            tests/test_prospective_v2_profile.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m ruff check "${files[@]}"
          python -W error::SyntaxWarning -m compileall -q -f "${files[@]}"
          python -m pytest -q \
            tests/test_projected_functional_support_v1.py \
            tests/test_prospective_v2_profile.py

      - name: Commit only the formatted reviewable files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-projected-support-v2.yml
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(cat <<'EOF'
          .github/workflows/format-projected-support-v2.yml
          src/causal4d/_projected_functional_support_common.py
          src/causal4d/_projected_functional_support_inputs.py
          src/causal4d/_projected_functional_support_outputs.py
          src/causal4d/projected_functional_support_v1.py
          src/causal4d/prospective_v2_profile.py
          tests/test_projected_functional_support_v1.py
          tests/test_prospective_v2_profile.py
          EOF
          )"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Format projected support and V2 profile'
          git push origin HEAD:agent/projected-support-v2-profile
