name: Fix private provider authentication once

on:
  push:
    branches:
      - agent/single-cli-surface
    paths:
      - .github/workflows/fix-private-provider-auth-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: Split BPT and Prob4D credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact authentication and policy edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(
                      f"expected exactly one {label} occurrence, found {text.count(old)}"
                  )
              return text.replace(old, new)

          workflow_path = Path(
              ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          prefix, marker, remainder = workflow.partition("  credential-gate:\n")
          credential, next_marker, suffix = remainder.partition(
              "\n  external-pull-request:\n"
          )
          if not marker or not next_marker:
              raise SystemExit("credential-gate boundaries were not found")
          credential = replace_once(
              credential,
              "      PRIVATE_REPOSITORY_READ_TOKEN: ${{ secrets.BPT_READ_TOKEN }}\n",
              "      PRIVATE_REPOSITORY_READ_TOKEN: ${{ secrets.BPT_READ_TOKEN }}\n"
              "      BPT_READ_SSH_KEY: ${{ secrets.BPT_READ_SSH_KEY }}\n",
              label="credential environment",
          )
          credential = replace_once(
              credential,
              '          if [[ -z "${PRIVATE_REPOSITORY_READ_TOKEN}" ]]; then\n',
              '          if [[ -z "${PRIVATE_REPOSITORY_READ_TOKEN}" || '
              '-z "${BPT_READ_SSH_KEY}" ]]; then\n',
              label="credential condition",
          )
          credential = replace_once(
              credential,
              '            echo "::error::BPT_READ_TOKEN is not configured; '
              'the required three-repository golden path cannot run."\n',
              '            echo "::error::BPT_READ_TOKEN and BPT_READ_SSH_KEY '
              'must both be configured; the required three-repository golden '
              'path cannot run."\n',
              label="credential error",
          )
          credential = replace_once(
              credential,
              '              echo "**Failed:** the repository secret '
              '\\`BPT_READ_TOKEN\\` is absent."\n',
              '              echo "**Failed:** one or both required '
              'private-repository credentials are absent."\n',
              label="credential summary",
          )
          credential = replace_once(
              credential,
              '              echo "Configure a least-privilege token with read '
              'access to:"\n',
              '              echo "Configure least-privilege credentials with '
              'read access:"\n',
              label="credential instruction",
          )
          credential = replace_once(
              credential,
              '              echo "- \\`IPS-Stuttgart/BayesianPhysTwin\\`;"\n'
              '              echo "- \\`IPS-Stuttgart/Prob4D\\`."\n',
              '              echo "- \\`BPT_READ_SSH_KEY\\` for '
              '\\`IPS-Stuttgart/BayesianPhysTwin\\`;"\n'
              '              echo "- \\`BPT_READ_TOKEN\\` for '
              '\\`IPS-Stuttgart/Prob4D\\`."\n',
              label="credential repositories",
          )
          credential = replace_once(
              credential,
              '          echo "Private-repository credential is configured."\n',
              '          echo "Private-repository credentials are configured."\n',
              label="credential success",
          )
          workflow = (
              prefix
              + marker
              + credential
              + next_marker
              + suffix
          )
          workflow = replace_once(
              workflow,
              "          repository: IPS-Stuttgart/BayesianPhysTwin\n"
              "          ref: ${{ inputs.bpt_ref || 'main' }}\n"
              "          token: ${{ secrets.BPT_READ_TOKEN }}\n"
              "          path: bayesian-phystwin\n",
              "          repository: IPS-Stuttgart/BayesianPhysTwin\n"
              "          ref: ${{ inputs.bpt_ref || 'main' }}\n"
              "          ssh-key: ${{ secrets.BPT_READ_SSH_KEY }}\n"
              "          path: bayesian-phystwin\n",
              label="BayesianPhysTwin checkout",
          )
          workflow_path.write_text(workflow, encoding="utf-8")

          docs_path = Path("docs/ci.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_once(
              docs,
              "Configure the least-privilege repository secret `BPT_READ_TOKEN` with read\n"
              "access to both private repositories:\n\n"
              "- `IPS-Stuttgart/BayesianPhysTwin`;\n"
              "- `IPS-Stuttgart/Prob4D`.\n\n"
              "The historical secret name is retained so existing repository configuration\n"
              "does not need to change. Trusted same-repository pull requests, pushes,\n",
              "Configure two least-privilege repository credentials:\n\n"
              "- `BPT_READ_SSH_KEY`, a read-only deploy key for\n"
              "  `IPS-Stuttgart/BayesianPhysTwin`;\n"
              "- `BPT_READ_TOKEN`, a token with read access to\n"
              "  `IPS-Stuttgart/Prob4D`.\n\n"
              "The historical token name is retained for Prob4D, while BayesianPhysTwin uses\n"
              "the repository's working deploy-key path after the organization transfer.\n"
              "Trusted same-repository pull requests, pushes,\n",
              label="private-access documentation",
          )
          docs = replace_once(
              docs,
              "The workflow begins with a separate credential gate. For trusted events, a\n"
              "missing `BPT_READ_TOKEN` is a hard configuration failure and prevents a false\n"
              "green result. Only an external-fork pull request can use the explicitly labelled\n"
              "unavailable path, because GitHub withholds repository secrets by design.\n",
              "The workflow begins with a separate credential gate. For trusted events, a\n"
              "missing `BPT_READ_TOKEN` or `BPT_READ_SSH_KEY` is a hard configuration failure\n"
              "and prevents a false green result. Only an external-fork pull request can use\n"
              "the explicitly labelled unavailable path, because GitHub withholds repository\n"
              "secrets by design.\n",
              label="credential-gate documentation",
          )
          docs_path.write_text(docs, encoding="utf-8")

          policy_path = Path("tests/test_three_repository_workflow_policy.py")
          policy = policy_path.read_text(encoding="utf-8")
          policy = replace_once(
              policy,
              '    assert "the required three-repository golden path cannot run" in text\n',
              '    assert "the required three-repository golden path cannot run" in text\n'
              '    assert "BPT_READ_SSH_KEY" in text\n'
              '    assert "ssh-key: ${{ secrets.BPT_READ_SSH_KEY }}" in text\n'
              '    assert "token: ${{ secrets.BPT_READ_TOKEN }}" in text\n',
              label="workflow-policy assertions",
          )
          policy_path.write_text(policy, encoding="utf-8")
          PY
          git diff --check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate workflow policy
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check tests/test_three_repository_workflow_policy.py
          python -m ruff format --check tests/test_three_repository_workflow_policy.py
          python -m pytest -q tests/test_three_repository_workflow_policy.py
      - name: Commit authentication repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            docs/ci.md \
            tests/test_three_repository_workflow_policy.py
          git commit -m 'Use deploy key for BayesianPhysTwin compatibility'
          git push origin "HEAD:${GITHUB_REF_NAME}"
