name: Fix private provider authentication once

on:
  push:
    branches:
      - agent/single-cli-surface
    paths:
      - .github/workflows/fix-private-provider-auth-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: Split BPT and Prob4D credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply structural authentication and policy edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          token_expression = "$" + "{{ secrets.BPT_READ_TOKEN }}"
          ssh_expression = "$" + "{{ secrets.BPT_READ_SSH_KEY }}"

          workflow_path = Path(
              ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
          )
          lines = workflow_path.read_text(encoding="utf-8").splitlines()
          gate_start = lines.index("  credential-gate:")
          gate_end = lines.index("  external-pull-request:")
          gate = lines[gate_start:gate_end]

          token_line = f"      PRIVATE_REPOSITORY_READ_TOKEN: {token_expression}"
          token_index = gate.index(token_line)
          ssh_env_line = f"      BPT_READ_SSH_KEY: {ssh_expression}"
          if ssh_env_line not in gate:
              gate.insert(token_index + 1, ssh_env_line)

          substitutions = {
              '          if [[ -z "${PRIVATE_REPOSITORY_READ_TOKEN}" ]]; then': (
                  '          if [[ -z "${PRIVATE_REPOSITORY_READ_TOKEN}" || '
                  '-z "${BPT_READ_SSH_KEY}" ]]; then'
              ),
              (
                  '            echo "::error::BPT_READ_TOKEN is not configured; '
                  'the required three-repository golden path cannot run."'
              ): (
                  '            echo "::error::BPT_READ_TOKEN and '
                  'BPT_READ_SSH_KEY must both be configured; the required '
                  'three-repository golden path cannot run."'
              ),
              (
                  '              echo "**Failed:** the repository secret '
                  '\\`BPT_READ_TOKEN\\` is absent."'
              ): (
                  '              echo "**Failed:** one or both required '
                  'private-repository credentials are absent."'
              ),
              (
                  '              echo "Configure a least-privilege token with '
                  'read access to:"'
              ): (
                  '              echo "Configure least-privilege credentials '
                  'with read access:"'
              ),
              (
                  '              echo "- \\`IPS-Stuttgart/BayesianPhysTwin\\`;"'
              ): (
                  '              echo "- \\`BPT_READ_SSH_KEY\\` for '
                  '\\`IPS-Stuttgart/BayesianPhysTwin\\`;"'
              ),
              '              echo "- \\`IPS-Stuttgart/Prob4D\\`."': (
                  '              echo "- \\`BPT_READ_TOKEN\\` for '
                  '\\`IPS-Stuttgart/Prob4D\\`."'
              ),
              '          echo "Private-repository credential is configured."': (
                  '          echo "Private-repository credentials are configured."'
              ),
          }
          for old, new in substitutions.items():
              if gate.count(old) != 1:
                  raise SystemExit(
                      f"expected one credential-gate line {old!r}, "
                      f"found {gate.count(old)}"
                  )
              gate[gate.index(old)] = new
          lines[gate_start:gate_end] = gate

          bpt_repository = "          repository: IPS-Stuttgart/BayesianPhysTwin"
          bpt_index = lines.index(bpt_repository)
          checkout_window = lines[bpt_index : bpt_index + 6]
          old_checkout_auth = f"          token: {token_expression}"
          new_checkout_auth = f"          ssh-key: {ssh_expression}"
          if checkout_window.count(old_checkout_auth) != 1:
              raise SystemExit("BayesianPhysTwin checkout token line was not unique")
          lines[bpt_index + checkout_window.index(old_checkout_auth)] = (
              new_checkout_auth
          )
          workflow_text = "\n".join(lines) + "\n"
          required_workflow_fragments = (
              ssh_env_line,
              new_checkout_auth,
              "          repository: IPS-Stuttgart/Prob4D",
              old_checkout_auth,
          )
          for fragment in required_workflow_fragments:
              if fragment not in workflow_text:
                  raise SystemExit(f"missing workflow postcondition: {fragment}")
          workflow_path.write_text(workflow_text, encoding="utf-8")

          docs_path = Path("docs/ci.md")
          docs = docs_path.read_text(encoding="utf-8").splitlines()
          access_start = docs.index(
              "Configure the least-privilege repository secret `BPT_READ_TOKEN` with read"
          )
          trusted_line = docs.index(
              "does not need to change. Trusted same-repository pull requests, pushes,"
          )
          docs[access_start : trusted_line + 1] = [
              "Configure two least-privilege repository credentials:",
              "",
              "- `BPT_READ_SSH_KEY`, a read-only deploy key for",
              "  `IPS-Stuttgart/BayesianPhysTwin`;",
              "- `BPT_READ_TOKEN`, a token with read access to",
              "  `IPS-Stuttgart/Prob4D`.",
              "",
              "The historical token name is retained for Prob4D, while BayesianPhysTwin uses",
              "the repository's working deploy-key path after the organization transfer.",
              "Trusted same-repository pull requests, pushes,",
          ]
          gate_doc_start = docs.index(
              "The workflow begins with a separate credential gate. For trusted events, a"
          )
          gate_doc_end = docs.index(
              "unavailable path, because GitHub withholds repository secrets by design."
          )
          docs[gate_doc_start : gate_doc_end + 1] = [
              "The workflow begins with a separate credential gate. For trusted events, a",
              "missing `BPT_READ_TOKEN` or `BPT_READ_SSH_KEY` is a hard configuration failure",
              "and prevents a false green result. Only an external-fork pull request can use",
              "the explicitly labelled unavailable path, because GitHub withholds repository",
              "secrets by design.",
          ]
          docs_text = "\n".join(docs) + "\n"
          if "BPT_READ_SSH_KEY" not in docs_text:
              raise SystemExit("deploy-key documentation postcondition failed")
          docs_path.write_text(docs_text, encoding="utf-8")

          policy_path = Path("tests/test_three_repository_workflow_policy.py")
          policy = policy_path.read_text(encoding="utf-8").splitlines()
          anchor = (
              '    assert "the required three-repository golden path cannot run" '
              "in text"
          )
          anchor_index = policy.index(anchor)
          extra_assertions = [
              '    assert "BPT_READ_SSH_KEY" in text',
              f'    assert "ssh-key: {ssh_expression}" in text',
              f'    assert "token: {token_expression}" in text',
          ]
          for assertion in reversed(extra_assertions):
              if assertion not in policy:
                  policy.insert(anchor_index + 1, assertion)
          policy_path.write_text("\n".join(policy) + "\n", encoding="utf-8")
          PY
          git diff --check
          git diff -- \
            .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            docs/ci.md \
            tests/test_three_repository_workflow_policy.py
      - name: Commit authentication repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            docs/ci.md \
            tests/test_three_repository_workflow_policy.py
          git commit -m 'Use deploy key for BayesianPhysTwin compatibility'
          git push origin "HEAD:${GITHUB_REF_NAME}"
