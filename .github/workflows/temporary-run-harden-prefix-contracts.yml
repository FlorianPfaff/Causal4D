name: Temporary run prefix-contract hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-run-harden-prefix-contracts.yml"
      - ".github/workflows/temporary-harden-prefix-kinematics-contracts.yml"

permissions:
  contents: write

concurrency:
  group: temporary-run-prefix-contract-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract and apply the reviewed patch program
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/temporary-harden-prefix-kinematics-contracts.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format and validate hardened contracts"
          prefix, found, remainder = workflow.partition(start_marker)
          if not found:
              raise RuntimeError("patch-program start marker is missing")
          program, found, suffix = remainder.partition(end_marker)
          if not found:
              raise RuntimeError("patch-program end marker is missing")
          del prefix, suffix
          lines = []
          for line in program.splitlines():
              if line and not line.startswith("          "):
                  raise RuntimeError(f"unexpected patch-program indentation: {line!r}")
              lines.append(line[10:] if line else "")
          Path("/tmp/harden_prefix_contracts.py").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY
          python /tmp/harden_prefix_contracts.py

      - name: Format and validate hardened contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            scripts/remote/find_deform360_replication_root.py
            scripts/remote/run_deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics.py
            tests/test_deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics_workflow_policy.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/deform360_prefix_kinematics.py \
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py \
            scripts/remote/find_deform360_replication_root.py \
            scripts/remote/run_deform360_prefix_kinematics.py
          python -m pytest -q \
            tests/test_deform360_prefix_kinematics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_prefix_kinematics_workflow_policy.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_source_failure_attribution.py
          bash -n scripts/remote/run_deform360_prefix_kinematics_workflow.sh
          git diff --check

      - name: Remove temporary workflows and publish hardening
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-run-harden-prefix-contracts.yml
          rm .github/workflows/temporary-harden-prefix-kinematics-contracts.yml
          rm -f .github/workflows/temporary-probe-prefix-kinematics-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden prefix-kinematics evidence contracts"
          basic_auth="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c \
            http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:${{ github.event.pull_request.head.ref }}
