name: Temporary PR 193 validation

on:
  push:
    branches: [ci/validate-pr-193]
    paths: [.github/workflows/temporary-pr193-validation.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/temporary-pr193-validation.yml]

permissions:
  contents: read

concurrency:
  group: temporary-pr193-validation
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  EXPECTED_HEAD_SHA: b1b12357ccec6e8991c66e6fcf4919d749490b8e

jobs:
  validate:
    name: Validate exact PR 193 head
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lock-real-analysis-reporting
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_HEAD_SHA}"
          echo "Validated PR head: ${actual}"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/causal4d-pr193-${GITHUB_RUN_ID}"
          python -m venv "${venv}"
          echo "VIRTUAL_ENV=${venv}" >> "${GITHUB_ENV}"
          echo "${venv}/bin" >> "${GITHUB_PATH}"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate syntax, lint, and formatting
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pr193-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f src tests scripts
          python -m ruff check .
          python -m ruff format --check \
            src/causal4d/real_analysis_reporting.py \
            src/causal4d/real_result_source_verification.py \
            src/causal4d/cli/real_analysis_reporting.py \
            tests/test_real_analysis_reporting.py

      - name: Run complete default test suite
        run: python -m pytest --junitxml=pytest-pr193.xml

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: causal4d-pr193-validation-${{ github.run_id }}
          path: pytest-pr193.xml
          if-no-files-found: warn
          retention-days: 7
