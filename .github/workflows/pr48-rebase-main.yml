name: PR 48 format and remove bootstrap workflow

on:
  push:
    branches: ["agent/bpt-graph-provider-boundary"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr48-format-cleanup
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bpt-graph-provider-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install repository development tools
        run: python -m pip install -e ".[dev]"
      - name: Format the exact PR Python surface
        run: |
          python -m ruff format \
            scripts/ci/run_bpt_integration_tests.py \
            src/causal4d/cli/evaluate_graph_temporal_discrepancy.py \
            src/causal4d/graph_provider_contract.py \
            src/causal4d/phystwin_backend.py \
            src/causal4d/phystwin_canonical_graph.py \
            src/causal4d/phystwin_discrepancy_localization.py \
            src/causal4d/phystwin_propagated_state.py \
            src/causal4d/phystwin_rest_geometry.py \
            src/causal4d/phystwin_rest_geometry_transfer.py \
            src/causal4d/rest_geometry_transfer.py \
            tests/test_bpt_graph_provider_import_boundary.py \
            tests/test_bpt_graph_provider_integration.py \
            tests/test_causal4d_phystwin_backend.py \
            tests/test_graph_provider_contract.py
          python -m ruff check \
            scripts/ci/run_bpt_integration_tests.py \
            src/causal4d/cli/evaluate_graph_temporal_discrepancy.py \
            src/causal4d/graph_provider_contract.py \
            src/causal4d/phystwin_backend.py \
            src/causal4d/phystwin_canonical_graph.py \
            src/causal4d/phystwin_discrepancy_localization.py \
            src/causal4d/phystwin_propagated_state.py \
            src/causal4d/phystwin_rest_geometry.py \
            src/causal4d/phystwin_rest_geometry_transfer.py \
            src/causal4d/rest_geometry_transfer.py \
            tests/test_bpt_graph_provider_import_boundary.py \
            tests/test_bpt_graph_provider_integration.py \
            tests/test_causal4d_phystwin_backend.py \
            tests/test_graph_provider_contract.py
      - name: Remove bootstrap workflow and publish formatting commit
        shell: bash
        run: |
          rm .github/workflows/pr48-rebase-main.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No formatting or cleanup changes to commit."
            exit 0
          fi
          git commit -m "Format graph provider boundary"
          git push origin HEAD:agent/bpt-graph-provider-boundary
