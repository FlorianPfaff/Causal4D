name: PR 48 rebase onto cache-enabled main

on:
  push:
    branches: ["agent/bpt-graph-provider-boundary"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr48-rebase-main
  cancel-in-progress: true

jobs:
  rebase:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/bpt-graph-provider-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Merge cache-enabled main and resolve the test inventory
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( ${#conflicts[@]} )); then
            printf 'merge conflicts:\n%s\n' "${conflicts[@]}"
            for path in "${conflicts[@]}"; do
              case "${path}" in
                scripts/ci/run_bpt_integration_tests.py)
                  cat > "${path}" <<'PY'
          #!/usr/bin/env python3
          """Run the repository tests that exercise the Bayesian-PhysTwin boundary."""

          from __future__ import annotations

          import sys

          import pytest


          BPT_INTEGRATION_TESTS = (
              "tests/test_bpt_graph_provider_integration.py",
              "tests/test_causal4d_bpt_belief.py",
              "tests/test_causal4d_molmo_acceptance.py",
              "tests/test_causal4d_molmo_adapter.py",
              "tests/test_causal4d_phystwin_backend.py",
              "tests/test_causal4d_real_calibration.py",
              "tests/test_causal4d_real_oracle_audit.py",
              "tests/test_causal4d_rest_geometry.py",
              "tests/test_causal4d_rest_geometry_protocol.py",
              "tests/test_causal4d_rest_geometry_transfer.py",
              "tests/test_discrepancy_localization_aggregate.py",
              "tests/test_phystwin_propagated_state.py",
              "tests/test_phystwin_resumable.py",
          )


          def main() -> int:
              return pytest.main(["-ra", *BPT_INTEGRATION_TESTS])


          if __name__ == "__main__":
              sys.exit(main())
          PY
                  git add "${path}"
                  ;;
                .github/workflows/ci.yml)
                  git checkout --theirs -- "${path}"
                  git add "${path}"
                  ;;
                *)
                  echo "unexpected merge conflict: ${path}" >&2
                  exit 1
                  ;;
              esac
            done
          elif (( merge_status != 0 )); then
            echo "merge failed without a resolvable conflict" >&2
            exit 1
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi
          rm .github/workflows/pr48-rebase-main.yml
          git add -A
      - name: Validate combined public boundary
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check \
            scripts/ci/run_bpt_integration_tests.py \
            src/causal4d/graph_provider_contract.py \
            src/causal4d/rest_geometry.py \
            src/causal4d/phystwin_rest_geometry.py \
            src/causal4d/rollout_cache.py \
            tests/test_graph_provider_contract.py \
            tests/test_bpt_graph_provider_import_boundary.py \
            tests/test_rollout_cache.py
          python -m ruff format --check \
            scripts/ci/run_bpt_integration_tests.py \
            src/causal4d/graph_provider_contract.py \
            tests/test_graph_provider_contract.py \
            tests/test_bpt_graph_provider_import_boundary.py
          python -m pytest -q \
            tests/test_graph_provider_contract.py \
            tests/test_bpt_graph_provider_import_boundary.py \
            tests/test_rollout_cache.py
          python -m compileall -q src scripts
      - name: Commit rebased graph boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Merge rollout cache into graph provider boundary"
          git push origin HEAD:agent/bpt-graph-provider-boundary
