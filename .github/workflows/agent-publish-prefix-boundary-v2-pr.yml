name: Publish prefix-boundary hardening v2 from PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-prefix-boundary-v2
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/harden-prefix-boundary-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-prefix-boundary-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Rebase inputs onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply focused source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path("/tmp/apply_prefix_hardening.py").write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          python /tmp/apply_prefix_hardening.py

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format, lint, and test
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py \
            tests/test_probability_support_invariants.py
          python -m ruff check \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py \
            tests/test_probability_support_invariants.py
          python -m pytest -q \
            tests/test_contact_inference_edge_cases.py \
            tests/test_probability_support_invariants.py \
            tests/test_causal4d_contact_evaluation.py
          git diff --check

      - name: Publish validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-publish-prefix-boundary-v2.yml
          rm .github/workflows/agent-publish-prefix-boundary-v2-pr.yml
          rm .github/agent-prefix-boundary-trigger.txt
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden prefix-only contact updates"
          git push origin HEAD:agent/harden-prefix-boundary-v2
