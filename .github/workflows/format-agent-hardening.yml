name: Format Causal4D hardening patch

on:
  push:
    branches:
      - agent/harden-content-addresses-and-numerics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/harden-content-addresses-and-numerics
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Format changed Python files
        run: |
          python -m pip install "ruff>=0.15.22,<0.17"
          python -m ruff format \
            src/causal4d/action_conditioned_counterfactual.py \
            src/causal4d/contracts.py \
            src/causal4d/discrepancy_belief.py \
            src/causal4d/observation_evidence.py \
            tests/test_causal4d_contracts.py \
            tests/test_causal4d_execution_block_calibration.py \
            tests/test_causal4d_provider_contract.py \
            tests/test_observation_lineage.py \
            tests/test_package_contract.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/action_conditioned_counterfactual.py \
            src/causal4d/contracts.py \
            src/causal4d/discrepancy_belief.py \
            src/causal4d/observation_evidence.py \
            tests/test_causal4d_contracts.py \
            tests/test_causal4d_execution_block_calibration.py \
            tests/test_causal4d_provider_contract.py \
            tests/test_observation_lineage.py \
            tests/test_package_contract.py
          git commit -m "Format Causal4D hardening changes"
          git push origin HEAD:agent/harden-content-addresses-and-numerics
