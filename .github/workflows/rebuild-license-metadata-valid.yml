name: Rebuild license metadata valid

on:
  push:
    branches:
      - agent/license-metadata-rebuild-scratch
    paths:
      - .github/workflows/rebuild-license-metadata-valid.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/license-metadata-rebuild-scratch
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the current-main licensing delta and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > /tmp/rebuild_license.py
          python /tmp/rebuild_license.py
          git rm .github/workflows/rebuild-license-metadata-once.yml
          git rm .github/workflows/rebuild-license-metadata-valid.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff CONTRIBUTING.md README.md docs/licensing.md pyproject.toml tests/test_citation_metadata.py
          git commit -m "Rebuild MIT license metadata on current main"
          git push origin HEAD:refs/heads/agent/license-metadata-rebuild-scratch
