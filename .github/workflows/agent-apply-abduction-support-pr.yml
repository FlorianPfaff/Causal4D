name: Apply exact-support patch from pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/harden-abduction-support'
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposal branch
        uses: actions/checkout@v6
        with:
          ref: agent/harden-abduction-support
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          sed -n "/<<'PATCH_B64'/,/^[[:space:]]*PATCH_B64$/p" \
            .github/workflows/agent-apply-abduction-support.yml \
            | sed '1d;$d;s/^[[:space:]]*//' \
            | base64 -d > /tmp/abduction-support.patch
          git apply --index /tmp/abduction-support.patch

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Format and validate patch
        run: |
          python -m ruff format \
            src/causal4d/hierarchical_abduction.py \
            src/causal4d/sensor_factorized_abduction.py \
            tests/test_causal4d_hierarchical_abduction.py \
            tests/test_causal4d_sensor_factorized_abduction.py
          python -m ruff check \
            src/causal4d/hierarchical_abduction.py \
            src/causal4d/sensor_factorized_abduction.py \
            tests/test_causal4d_hierarchical_abduction.py \
            tests/test_causal4d_sensor_factorized_abduction.py
          python -m pytest -q \
            tests/test_exact_zero_support.py \
            tests/test_causal4d_hierarchical_abduction.py \
            tests/test_causal4d_sensor_factorized_abduction.py

      - name: Commit patch and remove staging workflows
        shell: bash
        run: |
          git rm \
            .github/workflows/agent-apply-abduction-support.yml \
            .github/workflows/agent-apply-abduction-support-pr.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve exact support in abduction updates"
          git push origin HEAD:agent/harden-abduction-support
