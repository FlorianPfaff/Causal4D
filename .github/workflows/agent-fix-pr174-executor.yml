name: Fix PR 174 repair executor

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-fix-pr174-executor.yml

permissions:
  contents: write

# This second revision intentionally triggers the already-registered repair workflow.
jobs:
  fix-executor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/schema4-factor-lineage
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Remove the redundant environment-sensitive mypy invocation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/agent-execute-pr174-repair.yml")
          text = path.read_text(encoding="utf-8")
          marker = "          python -m mypy src/causal4d/observation_factor_lineage.py\n"
          if marker not in text:
              raise SystemExit("mypy marker not found")
          path.write_text(text.replace(marker, "", 1), encoding="utf-8")
          PY
          rm -f .github/workflows/agent-fix-pr174-executor.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use repository CI for PR 174 type validation"
          git push origin HEAD:agent/schema4-factor-lineage
