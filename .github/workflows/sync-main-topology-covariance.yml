name: Sync main into topology covariance branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/sync-main-topology-covariance.yml"

permissions:
  contents: write

concurrency:
  group: sync-main-topology-covariance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/topology-conditioned-contact-covariance-v2'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          clean: true

      - name: Merge current main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git merge --no-edit --no-ff origin/main
          git rm .github/workflows/sync-main-topology-covariance.yml
          git commit -m "Remove topology branch synchronization workflow"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
