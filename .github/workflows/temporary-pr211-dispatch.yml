name: Trigger PR 211 exact-head validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-pr211-dispatch.yml

permissions: {}

jobs:
  dispatch:
    name: Dispatch immutable validation and remove trigger
    if: github.event.head_commit.message == 'Trigger PR 211 exact-head validation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Dispatch the registered validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run temporary-pr211-scheduled-validation.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main

      - name: Remove this one-shot dispatcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          trigger=cleanup/.github/workflows/temporary-pr211-dispatch.yml
          if test -f "${trigger}"; then
            git -C cleanup rm .github/workflows/temporary-pr211-dispatch.yml
            git -C cleanup commit -m \
              "Remove temporary PR 211 validation dispatcher"
            git -C cleanup push origin HEAD:main
          fi
