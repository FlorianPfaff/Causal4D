name: Apply contact inference hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/causal4d-hardening-aug4

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/causal4d-hardening-aug4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply focused fixes and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          dynamic_path = Path("src/causal4d/dynamic_contact.py")
          dynamic = dynamic_path.read_text(encoding="utf-8")
          old = "    retained_mass = 1.0\n    for frame in range(1, len(activation)):\n"
          new = (
              "    retained_mass = float(\n"
              "        np.sum(initial[initial > settings.minimum_transition_probability])\n"
              "    )\n"
              "    if not beam:\n"
              "        raise RuntimeError(\n"
              '            "contact-path beam removed all initial probability mass"\n'
              "        )\n"
              "    for frame in range(1, len(activation)):\n"
          )
          if dynamic.count(old) != 1:
              raise RuntimeError("dynamic-contact patch anchor is not unique")
          dynamic_path.write_text(dynamic.replace(old, new), encoding="utf-8")

          inference_path = Path("src/causal4d/contact_inference.py")
          inference = inference_path.read_text(encoding="utf-8")
          old = (
              '    """Return a fixed-contact predictive, optionally updating theta '
              'from a prefix."""\n\n'
              "    trajectories = simulate_particles(\n"
          )
          new = (
              '    """Return a fixed-contact predictive, optionally updating theta '
              'from a prefix."""\n\n'
              "    if not np.isfinite(posterior_temperature) or "
              "posterior_temperature <= 0.0:\n"
              "        raise ValueError(\n"
              '            "posterior_temperature must be finite and positive"\n'
              "        )\n\n"
              "    trajectories = simulate_particles(\n"
          )
          if inference.count(old) != 1:
              raise RuntimeError("posterior-temperature patch anchor is not unique")
          inference_path.write_text(inference.replace(old, new), encoding="utf-8")

          Path("tests/test_contact_inference_edge_cases.py").write_text(
              dedent(
                  '''\
                  from __future__ import annotations

                  import numpy as np
                  import pytest

                  from causal4d.baselines import ParameterPosterior
                  from causal4d.contact_inference import (
                      ContactState,
                      posterior_predictive_for_state,
                  )
                  from causal4d.dynamic_contact import (
                      ContactRegime,
                      ContactTransitionConfig,
                      enumerate_contact_paths,
                  )
                  from causal4d.simulator import (
                      Action,
                      GraphObject,
                      PhysicalParameters,
                      SimulatorConfig,
                  )


                  def test_single_frame_path_reports_initial_pruned_mass() -> None:
                      config = ContactTransitionConfig(
                          minimum_transition_probability=0.5,
                      )
                      prior = enumerate_contact_paths(
                          np.asarray([0.0]),
                          config=config,
                          initial_probabilities=np.asarray([0.6, 0.4, 0.0, 0.0]),
                      )

                      assert prior.path_ids == ("inactive:0-0",)
                      assert np.array_equal(
                          prior.regime_paths,
                          np.asarray([[ContactRegime.INACTIVE]], dtype=np.int8),
                      )
                      assert np.array_equal(prior.weights, np.ones(1))
                      assert prior.retained_prior_mass == pytest.approx(0.6)


                  def test_initial_path_pruning_fails_with_explicit_error() -> None:
                      config = ContactTransitionConfig(
                          minimum_transition_probability=0.3,
                      )
                      with pytest.raises(RuntimeError, match="initial probability mass"):
                          enumerate_contact_paths(
                              np.asarray([0.0]),
                              config=config,
                              initial_probabilities=np.full(4, 0.25),
                          )


                  def _fixed_contact_problem() -> tuple[
                      GraphObject,
                      Action,
                      ContactState,
                      ParameterPosterior,
                      SimulatorConfig,
                  ]:
                      graph = GraphObject(
                          name="line",
                          rest_positions=np.asarray([[0.0, 0.0], [1.0, 0.0]]),
                          edges=((0, 1),),
                          mass=1.0,
                          support_stiffness=0.1,
                          true_parameters=PhysicalParameters(1.0, 1.0, 1.0),
                          sensor_nodes=(0, 1),
                      )
                      action = Action(
                          action_id="push",
                          split="test",
                          contact_nodes=(0,),
                          commanded_forces=np.ones((4, 1, 2), dtype=float),
                      )
                      state = ContactState((0,), 1.0, 0, 0.0, 0.0)
                      posterior = ParameterPosterior(
                          particles=np.asarray([[1.0, 1.0, 1.0]]),
                          weights=np.ones(1),
                          log_likelihood=np.zeros(1),
                      )
                      return graph, action, state, posterior, SimulatorConfig(
                          frame_count=5,
                          dt=0.05,
                      )


                  @pytest.mark.parametrize("temperature", [0.0, -1.0, np.inf, np.nan])
                  def test_fixed_contact_rejects_invalid_posterior_temperature(
                      temperature: float,
                  ) -> None:
                      graph, action, state, posterior, simulator = (
                          _fixed_contact_problem()
                      )
                      with pytest.raises(
                          ValueError,
                          match="posterior_temperature must be finite and positive",
                      ):
                          posterior_predictive_for_state(
                              graph,
                              action,
                              state,
                              posterior,
                              simulator_config=simulator,
                              variance_floor_m2=1e-8,
                              method="invalid-temperature",
                              posterior_temperature=temperature,
                          )
                  '''
              ),
              encoding="utf-8",
          )
          PY

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/causal4d/dynamic_contact.py \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py
          python -m ruff check \
            src/causal4d/dynamic_contact.py \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py
          python -m pytest -q \
            tests/test_contact_inference_edge_cases.py \
            tests/test_dynamic_contact.py \
            tests/test_probability_support_invariants.py

      - name: Commit validated changes and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-causal4d-hardening.yml
          git add \
            src/causal4d/dynamic_contact.py \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden contact inference edge cases"
          git push origin HEAD:agent/causal4d-hardening-aug4
