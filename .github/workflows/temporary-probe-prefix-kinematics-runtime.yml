name: Temporary probe prefix-kinematics runtime

on:
  push:
    branches:
      - agent/deform360-prefix-kinematics-v1
    paths:
      - ".github/workflows/temporary-probe-prefix-kinematics-runtime.yml"

permissions:
  contents: read

concurrency:
  group: temporary-probe-prefix-kinematics-runtime
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref_name == 'agent/deform360-prefix-kinematics-v1'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 15
    steps:
      - name: Probe known Python runtime locations
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /home/florianpfaff/.venvs/bpt-gpu/bin/python
            /home/github-runner/.venvs/bpt-gpu/bin/python
            /home/github-runner/.cache/venvs/bpt-gpu/bin/python
            /home/github-runner/miniconda3/envs/bpt-gpu/bin/python
            /opt/hostedtoolcache/Python/3.12.3/x64/bin/python
            /usr/bin/python3
          )
          for candidate in "${candidates[@]}"; do
            if [[ ! -x "${candidate}" ]]; then
              echo "candidate=${candidate};status=absent"
              continue
            fi
            echo "candidate=${candidate};status=executable"
            "${candidate}" - <<'PY' || true
          import importlib.metadata
          import json
          import platform
          import sys

          result = {
              "executable": sys.executable,
              "platform": platform.platform(),
              "python": ".".join(map(str, sys.version_info[:3])),
              "packages": {},
          }
          for distribution in ("numpy", "scipy", "torch", "warp-lang", "pytest"):
              try:
                  result["packages"][distribution] = importlib.metadata.version(
                      distribution
                  )
              except importlib.metadata.PackageNotFoundError:
                  result["packages"][distribution] = None
          try:
              import torch
          except ImportError:
              result["torch_runtime"] = None
          else:
              result["torch_runtime"] = {
                  "cuda_available": torch.cuda.is_available(),
                  "cuda_version": torch.version.cuda,
                  "version": torch.__version__,
              }
          try:
              import warp as wp
          except ImportError:
              result["warp_runtime"] = None
          else:
              wp.init()
              result["warp_runtime"] = {
                  "cuda_devices": [str(device) for device in wp.get_cuda_devices()],
                  "version": getattr(wp, "__version__", None),
              }
          print(json.dumps(result, sort_keys=True))
          PY
          done
          echo "PATH=${PATH}"
          command -v python || true
          command -v python3 || true
          nvidia-smi --query-gpu=name,driver_version,memory.total \
            --format=csv,noheader
