name: Rebase CI branch onto current main

on:
  push:
    branches: [agent/ci-dependency-boundaries]

permissions:
  contents: write

jobs:
  rebase:
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.head_commit.message, 'Start CI current-main rebase')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out CI branch
        uses: actions/checkout@v6
        with:
          ref: agent/ci-dependency-boundaries
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Merge current main and reconcile provider boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          expected_conflicts=$(cat <<'EOF'
          pyproject.toml
          src/causal4d/cli/abduct_phystwin_intervention.py
          src/causal4d/cli/audit_parameter_support.py
          src/causal4d/cli/audit_real_oracle_gap.py
          src/causal4d/cli/evaluate_graph_temporal_discrepancy.py
          src/causal4d/cli/evaluate_physical_counterfactual.py
          src/causal4d/cli/fit_semantic_trust.py
          src/causal4d/cli/real_calibration.py
          EOF
          )
          conflicts=$(git diff --name-only --diff-filter=U || true)
          if [[ $merge_status -ne 0 ]]; then
            unexpected=$(comm -23 \
              <(printf '%s\n' "$conflicts" | sed '/^$/d' | sort) \
              <(printf '%s\n' "$expected_conflicts" | sed '/^$/d' | sort))
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          fi

          if grep -qx 'pyproject.toml' <<<"$conflicts"; then
            git checkout --theirs pyproject.toml
          fi
          for path in \
            src/causal4d/cli/abduct_phystwin_intervention.py \
            src/causal4d/cli/audit_parameter_support.py \
            src/causal4d/cli/audit_real_oracle_gap.py \
            src/causal4d/cli/evaluate_graph_temporal_discrepancy.py \
            src/causal4d/cli/evaluate_physical_counterfactual.py \
            src/causal4d/cli/fit_semantic_trust.py \
            src/causal4d/cli/real_calibration.py
          do
            if grep -qx "$path" <<<"$conflicts"; then
              git checkout --ours "$path"
            fi
          done

          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          old_dev = '''dev = [
            "pytest>=8",
            "ruff>=0.6",
          ]'''
          new_dev = '''dev = [
            "build>=1.2",
            "mypy>=1.11",
            "pytest>=8",
            "ruff>=0.15.22,<0.17",
            "twine>=5",
          ]'''
          if old_dev not in text:
              raise SystemExit("current main dev dependency block changed unexpectedly")
          text = text.replace(old_dev, new_dev, 1)
          if "[tool.mypy]" not in text:
              text += '''

          [tool.mypy]
          python_version = "3.10"
          check_untyped_defs = true
          follow_imports = "skip"
          ignore_missing_imports = true
          no_implicit_optional = true
          show_error_codes = true
          warn_unused_ignores = true
          '''
          pyproject.write_text(text, encoding="utf-8")

          cli_paths = (
              "src/causal4d/cli/abduct_phystwin_intervention.py",
              "src/causal4d/cli/audit_parameter_support.py",
              "src/causal4d/cli/audit_real_oracle_gap.py",
              "src/causal4d/cli/evaluate_graph_temporal_discrepancy.py",
              "src/causal4d/cli/evaluate_physical_counterfactual.py",
              "src/causal4d/cli/fit_semantic_trust.py",
              "src/causal4d/cli/real_calibration.py",
          )
          for value in cli_paths:
              path = Path(value)
              source = path.read_text(encoding="utf-8")
              source = source.replace(
                  "from bayesian_phystwin.phystwin_residual_dynamics import _target_validity",
                  "from bayesian_phystwin.causal4d_provider_v1 import target_validity",
              )
              source = source.replace("_target_validity", "target_validity")
              path.write_text(source, encoding="utf-8")

          pin_path = Path("requirements/ci/bayesian-phystwin-provider-v1.sha")
          pin_path.parent.mkdir(parents=True, exist_ok=True)
          pin_path.write_text(
              "b0a47e411a919ae367fc9ca3c1e57ffc47e69695\n",
              encoding="utf-8",
          )

          reader = Path("scripts/ci/read_bpt_pin.py")
          reader.write_text(
              '''#!/usr/bin/env python3
          """Print the exact Bayesian-PhysTwin revision used by pinned CI."""

          from __future__ import annotations

          import argparse
          from pathlib import Path
          import re
          import sys

          DEFAULT_PIN = Path("requirements/ci/bayesian-phystwin-provider-v1.sha")
          _SHA40 = re.compile(r"^[0-9a-f]{40}$")


          def read_bpt_pin(path: Path = DEFAULT_PIN) -> str:
              value = path.read_text(encoding="utf-8").strip()
              if _SHA40.fullmatch(value) is None:
                  raise ValueError(f"{path} must contain one lowercase 40-hex commit")
              return value


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("pin_file", nargs="?", type=Path, default=DEFAULT_PIN)
              arguments = parser.parse_args(argv)
              print(read_bpt_pin(arguments.pin_file))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          ''',
              encoding="utf-8",
          )

          for workflow_name in ("ci.yml", "optional-integrations.yml"):
              path = Path(".github/workflows") / workflow_name
              source = path.read_text(encoding="utf-8")
              source = source.replace("BPT_REPOSITORY_TOKEN", "BPT_READ_TOKEN")
              path.write_text(source, encoding="utf-8")

          docs = Path("docs/ci.md")
          docs.write_text(
              '''# Continuous integration

          Causal4D separates its lightweight contracts from private-provider and
          hardware integrations. This keeps a base installation testable while still
          detecting drift at the Bayesian-PhysTwin boundary.

          ## Required pull-request checks

          `CI and release` runs the following independent jobs:

          - **Core-only** installs `.[dev]` without Bayesian-PhysTwin, OpenCV, PyTorch,
            or Warp and executes the default test suite on Python 3.10, 3.12, and 3.14.
          - **Pinned Bayesian-PhysTwin integration** checks out the exact provider-API
            revision recorded in `requirements/ci/bayesian-phystwin-provider-v1.sha`
            and runs the BPT-facing Causal4D tests. The normal `phystwin` extra remains
            the supported `>=0.4,<0.5` development range.
          - **Distributions and CLI help** build both wheel and source distribution,
            install each into a clean virtual environment, and require every declared
            console command to render `--help` without optional providers.
          - **Quality** runs Ruff on the repository, Ruff formatting on changed Python
            files, and mypy on stable provider contracts and CI utilities.
          - **Result bundles** produce small deterministic benchmark bundles, verify
            their embedded checksums, archive them, extract them into a clean directory,
            and verify the consumed copies again.
          - **Frozen manifest** cross-checks the milestone path and checksum inventories,
            validates all recorded Git/SHA-256 identities, and hashes every frozen
            artifact that is stored in the checkout.

          Formatting is an incremental ratchet: modified Python files must be
          Ruff-formatted without forcing unrelated historical files into the same change.

          ## Private Bayesian-PhysTwin access

          Bayesian-PhysTwin is private. Add a least-privilege repository secret named
          `BPT_READ_TOKEN` with read access to `FlorianPfaff/Bayesian-PhysTwin`. Pinned,
          scheduled-main, BPT-vision, and Warp jobs report an explicit skipped-coverage
          warning when the secret is absent; they do not pretend that provider
          compatibility was tested.

          ## Scheduled and optional checks

          `Bayesian-PhysTwin provider compatibility` is the scheduled and manually
          dispatchable cross-repository check against BPT `main`. The ordinary CI job
          remains locked to the exact provider-API revision in the dedicated CI pin.

          `Optional integrations` keeps large or platform-specific dependencies out of
          the core job:

          - hosted CPU vision/OpenCV tests run weekly;
          - BPT OpenCV collection and Warp CPU tests run separately when the private
            token is configured;
          - the CUDA/Warp job is manual and targets a self-hosted runner carrying the
            labels `self-hosted`, `linux`, `x64`, and `gpu`.

          The manual GPU job additionally requires the same `BPT_READ_TOKEN` secret.
          ''',
              encoding="utf-8",
          )
          PY

          rm -f .github/workflows/bpt-main-compatibility.yml
          rm -f .github/workflows/rebase-ci-current-main.yml
          git add -A
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
      - name: Format and validate reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py'
            git diff --name-only --cached --diff-filter=ACMR -- '*.py'
          )
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sed '/^$/d' | sort -u)
          if (( ${#files[@]} )); then
            python -m ruff format "${files[@]}"
            git add -- "${files[@]}"
          fi
          python -m ruff check .
          python -m mypy scripts/ci src/causal4d/provider_contract.py
          python -m compileall -q src tests scripts
          python -m pytest --tb=short
          git diff --check
      - name: Commit and publish reconciled branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebase dependency-boundary CI onto provider-enabled main"
          git push origin HEAD:agent/ci-dependency-boundaries
