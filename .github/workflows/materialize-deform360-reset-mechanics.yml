name: Materialize Deform360 reset mechanics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-deform360-reset-mechanics.yml"
      - ".github/materialize/deform360-reset-mechanics.part-*"

permissions:
  contents: write

concurrency:
  group: materialize-deform360-reset-mechanics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Materialize the reviewed product patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materialize/deform360-reset-mechanics.part-* \
            | base64 --decode > /tmp/deform360-reset-mechanics.tar.gz
          tar -xzf /tmp/deform360-reset-mechanics.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f \
            .github/materialize/deform360-reset-mechanics.part-* \
            .github/workflows/materialize-deform360-reset-mechanics.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and validate the product patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/remote/run_deform360_reset_mechanics.py
            src/causal4d_public/deform360_reset_mechanics.py
            tests/test_deform360_reset_mechanics.py
            tests/test_deform360_reset_mechanics_workflow_policy.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/deform360_reset_mechanics.py \
            scripts/remote/run_deform360_reset_mechanics.py
          bash -n scripts/remote/run_deform360_reset_mechanics_workflow.sh
          python -m pytest -q \
            tests/test_deform360_reset_mechanics.py \
            tests/test_deform360_reset_mechanics_workflow_policy.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_replication_warp.py \
            tests/test_deform360_source_failure_attribution.py
          PYTHONPATH=src python - <<'PY'
          from causal4d_public.deform360_reset_mechanics import (
              load_reset_mechanics_lock,
          )

          lock = load_reset_mechanics_lock(
              "configs/causal4d_public/deform360_reset_mechanics_v1.json"
          )
          assert len(lock["selected_object_ids"]) == 5
          PY
          git diff --check

      - name: Commit the validated product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/materialize \
            .github/workflows/materialize-deform360-reset-mechanics.yml \
            .github/workflows/deform360-reset-mechanics.yml \
            configs/causal4d_public/deform360_reset_mechanics_v1.json \
            docs/causal4d_deform360_reset_mechanics.md \
            scripts/remote/run_deform360_reset_mechanics.py \
            scripts/remote/run_deform360_reset_mechanics_workflow.sh \
            src/causal4d_public/deform360_reset_mechanics.py \
            tests/test_deform360_reset_mechanics.py \
            tests/test_deform360_reset_mechanics_workflow_policy.py
          git diff --cached --check
          git commit -m "Add Deform360 observed-reset mechanics diagnostic"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
