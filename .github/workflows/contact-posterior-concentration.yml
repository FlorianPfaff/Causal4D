name: Contact-posterior concentration diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/contact-posterior-concentration.yml"
      - "docs/contact_posterior_concentration.md"
      - "scripts/ci/run_contact_concentration_diagnostic.py"
      - "src/causal4d/contact_concentration_diagnostic.py"
      - "tests/test_contact_concentration_diagnostic.py"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner type
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      seeds:
        description: Fresh diagnostic seed range
        required: false
        default: "200:220"
        type: string
      softening_logit_scales:
        description: Additional source-only log-weight scales
        required: false
        default: "0.25,0.50,0.75"
        type: string

permissions:
  contents: read

concurrency:
  group: contact-concentration-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  DIAGNOSTIC_SEEDS: ${{ inputs.seeds || '200:220' }}
  SOFTENING_LOGIT_SCALES: ${{ inputs.softening_logit_scales || '0.25,0.50,0.75' }}

jobs:
  evaluate:
    name: Fresh-seed source-only concentration evaluation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: >-
      ${{
        inputs.runner == 'self-hosted' &&
        fromJSON('["self-hosted","Linux","X64","nvidia-smi"]') ||
        'ubuntu-latest'
      }}
    timeout-minutes: 240
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12 with pip cache
        if: inputs.runner != 'self-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Python 3.12 without Actions cache
        if: inputs.runner == 'self-hosted'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install isolated diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .contact-concentration-venv
          .contact-concentration-venv/bin/python -m pip install --upgrade pip
          .contact-concentration-venv/bin/python -m pip install -e ".[dev]"
          .contact-concentration-venv/bin/python -m pip check
          mkdir -p outputs/contact-concentration
          .contact-concentration-venv/bin/python -m pip freeze --all \
            > outputs/contact-concentration/pip-freeze.txt
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "seeds=${DIAGNOSTIC_SEEDS}"
            echo "softening_logit_scales=${SOFTENING_LOGIT_SCALES}"
            uname -a
          } > outputs/contact-concentration/environment.txt

      - name: Validate concentration contracts
        shell: bash
        run: |
          set -euo pipefail
          .contact-concentration-venv/bin/python -m ruff check \
            src/causal4d/contact_concentration_diagnostic.py \
            scripts/ci/run_contact_concentration_diagnostic.py \
            tests/test_contact_concentration_diagnostic.py
          .contact-concentration-venv/bin/python -m ruff format --check \
            src/causal4d/contact_concentration_diagnostic.py \
            scripts/ci/run_contact_concentration_diagnostic.py \
            tests/test_contact_concentration_diagnostic.py
          .contact-concentration-venv/bin/python -m pytest -q \
            tests/test_contact_concentration_diagnostic.py \
            tests/test_causal4d_contact_evaluation.py \
            tests/test_probability_support_invariants.py

      - name: Run fresh-seed source-only comparison
        shell: bash
        run: |
          set -euo pipefail
          .contact-concentration-venv/bin/python \
            scripts/ci/run_contact_concentration_diagnostic.py \
            --output-dir outputs/contact-concentration/results \
            --seeds "${DIAGNOSTIC_SEEDS}" \
            --softening-logit-scales "${SOFTENING_LOGIT_SCALES}" \
            | tee outputs/contact-concentration/console.json

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Contact-posterior concentration diagnostic"
            echo
            echo "- Runner: \`${RUNNER_NAME}\`"
            echo "- Fresh seeds: \`${DIAGNOSTIC_SEEDS}\`"
            echo "- Additional scales: \`${SOFTENING_LOGIT_SCALES}\`"
            if [[ -f outputs/contact-concentration/results/contact-concentration-diagnostic.json ]]; then
              .contact-concentration-venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "outputs/contact-concentration/results/"
              "contact-concentration-diagnostic.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          for row in result["comparison"]:
              world = row["world_condition"]
              brier = row["expanded_minus_registered_mean_brier"]
              calibration = row[
                  "expanded_minus_registered_calibration_error"
              ]
              trajectory = row[
                  "expanded_minus_registered_trajectory_rmse_m"
              ]
              print(
                  f"- {world}: ΔBrier={brier:.6g}, "
                  f"Δcalibration={calibration:.6g}, "
                  f"Δtrajectory RMSE={trajectory:.6g} m"
              )
          PY
            else
              echo "- Diagnostic stopped before producing its summary."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contact-posterior-concentration-${{ github.run_id }}
          path: outputs/contact-concentration/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated environment
        if: always()
        run: rm -rf .contact-concentration-venv
