name: Repair contact diagnostic bootstrap

on:
  push:
    branches:
      - agent/reproducibility-contact-diagnostics

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reproducibility-contact-diagnostics
          fetch-depth: 0

      - name: Replace brittle analyzer-preamble anchor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path(
              ".github/workflows/"
              "apply-contact-diagnostic-contract-hardening.yml"
          )
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          start = None
          for index in range(len(lines) - 2):
              if (
                  lines[index] == "          replace_once(\n"
                  and lines[index + 1] == "              diagnostic,\n"
                  and "bundle = Path(bundle_directory).resolve" in lines[index + 2]
              ):
                  start = index
                  break
          if start is None:
              raise RuntimeError("analyzer preamble patch block was not found")

          end = None
          for index in range(start, len(lines) - 1):
              if '"embedded bundle verification",' in lines[index]:
                  if lines[index + 1] != "          )\n":
                      raise RuntimeError("analyzer preamble patch terminator changed")
                  end = index + 2
                  break
          if end is None:
              raise RuntimeError("analyzer preamble patch end was not found")

          replacement = dedent(
              '''\
                        replace_region(
                            diagnostic,
                            "    bundle = Path(bundle_directory).resolve()\\n",
                            '    if summary.get("benchmark") != '
                            '"causal4d-latent-contact-v1":\\n',
                            "    bundle = Path(bundle_directory).resolve()\\n"
                            "    verification = verify_embedded_result_bundle(bundle)\\n"
                            '    summary_path = bundle / "summary.json"\\n'
                            "    summary = read_strict_json_object(summary_path)\\n",
                            "embedded bundle verification",
                        )
              '''
          )
          path.write_text(
              "".join(lines[:start]) + replacement + "".join(lines[end:]),
              encoding="utf-8",
          )
          PY

      - name: Commit repair and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-contact-diagnostic-bootstrap.yml
          git add .github/workflows/apply-contact-diagnostic-contract-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair diagnostic hardening bootstrap"
          git push origin HEAD:agent/reproducibility-contact-diagnostics
