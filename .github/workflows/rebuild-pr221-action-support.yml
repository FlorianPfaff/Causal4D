name: Rebuild PR 221 action-support admission

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-pr221-action-support.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-pr221-action-support
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 7d82dc6e43c4eda4437f4de2b51c10531458489e
  PRODUCT_BRANCH: agent/action-support-certificate-v1

jobs:
  rebuild:
    name: Rebuild five-file product diff on current main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and verify immutable source head
        run: |
          set -euo pipefail
          git fetch origin \
            "${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PRODUCT_BRANCH}")" \
            = "${EXPECTED_HEAD}"

      - name: Rebuild product files on current main
        shell: bash
        run: |
          set -euo pipefail
          base_head="$(git rev-parse origin/main)"
          git checkout -B pr221-rebuilt "${base_head}"
          git checkout "${EXPECTED_HEAD}" -- \
            docs/action_support_certificate.md \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py \
            tests/test_action_support.py
          test "$(git rev-parse ":docs/action_support_certificate.md")" \
            = "3e94321be5edb1f90c5ca4de25aa302643f07522"
          test "$(git rev-parse ":src/causal4d/action_support.py")" \
            = "c363dabd3e11ba92df4b44a27b97cec5252840c9"
          test "$(git rev-parse ":src/causal4d/action_support_counterfactual.py")" \
            = "caa44ec870d5cc3104397d13bbd61d934e7e7d5c"
          test "$(git rev-parse ":tests/test_action_support.py")" \
            = "63b471faeb7443256f69df7bdef8172b3330a702"

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("src/causal4d/__init__.py")
          text = path.read_text(encoding="utf-8")
          anchor = """from causal4d.action_conditioned_discrepancy import (
              ActionConditionedDiscrepancyFeatures,
              ActionConditionedDiscrepancyForecast,
              ActionConditionedDiscrepancyModel,
              build_action_conditioned_features,
              forecast_action_conditioned_persistence,
          )
          """.replace("          ", "")
          imports = """from causal4d.action_support import (
              ACTION_SUPPORT_SCHEMA_VERSION,
              ActionSupportCalibration,
              ActionSupportDecision,
              ActionSupportSelection,
              ActionSupportSourceCase,
              evaluate_action_support,
              fit_action_support_calibration,
              load_action_support_calibration,
              load_claim_bearing_action_support_calibration,
              select_action_supported_candidate,
              write_action_support_calibration,
          )
          from causal4d.action_support_counterfactual import (
              apply_guarded_action_conditioned_counterfactual_operator,
          )
          """.replace("          ", "")
          if imports in text:
              raise SystemExit("action-support imports already exist")
          if text.count(anchor) != 1:
              raise SystemExit("action-conditioned import anchor changed")
          text = text.replace(anchor, anchor + imports)

          marker = "__all__ = ["
          start = text.index(marker)
          end_marker = "]\n\n__version__"
          end = text.index(end_marker, start)
          current = ast.literal_eval(text[start + len("__all__ = ") : end + 1])
          additions = (
              "ACTION_SUPPORT_SCHEMA_VERSION",
              "ActionSupportCalibration",
              "ActionSupportDecision",
              "ActionSupportSelection",
              "ActionSupportSourceCase",
              "apply_guarded_action_conditioned_counterfactual_operator",
              "evaluate_action_support",
              "fit_action_support_calibration",
              "load_action_support_calibration",
              "load_claim_bearing_action_support_calibration",
              "select_action_supported_candidate",
              "write_action_support_calibration",
          )
          for name in additions:
              if name in current:
                  raise SystemExit(f"duplicate action-support export: {name}")
              current.append(name)
          rendered = "__all__ = [\n" + "".join(
              f'    "{name}",\n' for name in sorted(current)
          ) + "]"
          text = text[:start] + rendered + text[end + 1 :]
          path.write_text(text, encoding="utf-8")
          PY

          git add \
            docs/action_support_certificate.md \
            src/causal4d/__init__.py \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py \
            tests/test_action_support.py
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/action_support_certificate.md
          src/causal4d/__init__.py
          src/causal4d/action_support.py
          src/causal4d/action_support_counterfactual.py
          tests/test_action_support.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Validate focused and repository quality boundaries
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/causal4d/__init__.py \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py \
            tests/test_action_support.py
          python -m ruff check .
          python -m ruff format --check \
            src/causal4d/__init__.py \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py \
            tests/test_action_support.py
          python -m mypy --python-version 3.12 \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f \
              src/causal4d/__init__.py \
              src/causal4d/action_support.py \
              src/causal4d/action_support_counterfactual.py \
              tests/test_action_support.py
          python -m pytest -q tests/test_action_support.py
          git diff --check origin/main...HEAD

      - name: Commit and publish rebuilt branch with lease
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/action_support_certificate.md \
            src/causal4d/__init__.py \
            src/causal4d/action_support.py \
            src/causal4d/action_support_counterfactual.py \
            tests/test_action_support.py
          git commit -m "Add source-frozen action-support admission"
          git push --force-with-lease=refs/heads/${PRODUCT_BRANCH}:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/${PRODUCT_BRANCH}

      - name: Remove this temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f \
            cleanup/.github/workflows/rebuild-pr221-action-support.yml; then
            git -C cleanup rm \
              .github/workflows/rebuild-pr221-action-support.yml
            git -C cleanup commit -m \
              "Remove temporary PR 221 rebuild workflow"
            git -C cleanup push origin HEAD:main
          fi
