name: Merge current main into PR 114 once

on:
  push:
    branches:
      - agent/single-cli-surface
    paths:
      - .github/workflows/merge-main-pr114-once.yml

permissions:
  contents: write

jobs:
  merge-current-main:
    name: Clean merge current main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/single-cli-surface
          fetch-depth: 0
          persist-credentials: true
      - name: Merge without automatic conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff origin/main -m 'Merge current main into CLI consolidation branch'
          git push origin "HEAD:${GITHUB_REF_NAME}"
