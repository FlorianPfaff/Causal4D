name: Trigger agent improvement patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/harden-contact-and-public-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute and retire the bootstrap workflow
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import subprocess

          import yaml


          bootstrap = Path(".github/workflows/agent-apply-improvements.yml")
          trigger = Path(".github/workflows/agent-pull-request-trigger.yml")
          payload = yaml.safe_load(bootstrap.read_text(encoding="utf-8"))
          steps = payload["jobs"]["apply"]["steps"]
          commands = {
              step.get("name"): step["run"]
              for step in steps
              if isinstance(step, dict) and "run" in step
          }
          required = (
              "Apply focused repository patches",
              "Validate focused changes",
              "Commit generated patch",
          )
          missing = [name for name in required if name not in commands]
          if missing:
              raise RuntimeError(f"bootstrap workflow is missing steps: {missing}")

          environment = dict(os.environ)
          environment["GITHUB_REF_NAME"] = environment["TARGET_BRANCH"]
          for name in required[:2]:
              subprocess.run(
                  ["bash", "-euxo", "pipefail", "-c", commands[name]],
                  check=True,
                  env=environment,
              )

          trigger.unlink()
          subprocess.run(["git", "add", str(trigger)], check=True)
          subprocess.run(
              ["bash", "-euxo", "pipefail", "-c", commands[required[2]]],
              check=True,
              env=environment,
          )
          PY
