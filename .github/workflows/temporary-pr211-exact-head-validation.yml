name: Temporary PR 211 exact-head validation

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: temporary-pr211-exact-head-validation
  cancel-in-progress: false

env:
  TARGET_SHA: bd346f0ada0e7504fcc2740afc9f1e7cd210c7a7
  BASE_SHA: b6f3c3b4b826dae39dfa4ef3c6dfd84ac84e000e
  TRIGGER_TITLE: "[automation] validate pr211 preacquisition next action"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  announce:
    name: Publish immutable validation identity
    if: >-
      github.event.issue.title ==
      '[automation] validate pr211 preacquisition next action' &&
      github.event.issue.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment validation identity
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          cat > /tmp/start.md <<EOF
          ## PR 211 exact-head validation started

          - Workflow run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`
          - Target SHA: \`${TARGET_SHA}\`
          - Comparison base SHA: \`${BASE_SHA}\`
          - Runner: \`ubuntu-latest\`, Python 3.12
          - Validation: scope audit, Ruff, formatting, syntax warnings, complete pytest suite, distributions, and installed-wheel CLI checks

          The validation job has read-only repository permissions. It does not access physical data or target outcomes and cannot modify the registered estimator or protocol.
          EOF
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/start.md

  validate:
    name: Validate immutable PR 211 head
    needs: announce
    if: needs.announce.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Verify revision and four-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"
          git -C target cat-file -e "${BASE_SHA}^{commit}"
          git -C target diff --name-only "${BASE_SHA}" "${TARGET_SHA}" \
            | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/causal4d_preacquisition_next_action.md
          src/causal4d/cli/preacquisition_readiness.py
          src/causal4d/preacquisition_next_action.py
          tests/test_preacquisition_next_action.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          mkdir -p evidence
          cp /tmp/actual-files.txt evidence/changed-files.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "target_sha=${TARGET_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            uname -a
          } | tee evidence/environment.txt

      - name: Install exact development environment
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install ".[dev]"
          python -m pip check
          python -m pip freeze --all > ../evidence/pip-freeze.txt

      - name: Run Ruff and exact formatting checks
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . 2>&1 | tee ../evidence/ruff-check.log
          python -m ruff format --check \
            src/causal4d/preacquisition_next_action.py \
            src/causal4d/cli/preacquisition_readiness.py \
            tests/test_preacquisition_next_action.py \
            2>&1 | tee ../evidence/ruff-format.log

      - name: Reject syntax warnings
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -W error -m compileall -q src tests scripts

      - name: Run complete test suite
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee ../evidence/pytest.log

      - name: Build and validate distributions
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -m build --outdir ../evidence/dist \
            2>&1 | tee ../evidence/build.log
          python -m twine check ../evidence/dist/* \
            2>&1 | tee ../evidence/twine-check.log
          sha256sum ../evidence/dist/* > ../evidence/distribution-sha256.txt

      - name: Validate installed wheel and CLI route
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr211-installed-${GITHUB_RUN_ID}"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          wheel_path="$(find evidence/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          "${venv}/bin/python" -m pip install "${wheel_path}"
          "${venv}/bin/python" -m pip check
          (
            cd "${RUNNER_TEMP}"
            unset PYTHONPATH
            "${venv}/bin/causal4d" --help
            "${venv}/bin/causal4d" protocol readiness next-action --help
            "${venv}/bin/causal4d" commands validate --require-installed
            "${venv}/bin/python" - <<'PY'
          import os
          import pathlib
          import causal4d

          package = pathlib.Path(causal4d.__file__).resolve()
          checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve() / "target"
          assert checkout not in package.parents, package
          print(package)
          PY
          ) 2>&1 | tee evidence/installed-wheel.log
          rm -rf "${venv}"

      - name: Verify source checkout remained immutable
        shell: bash
        run: |
          set -euo pipefail
          git -C target reset --hard "${TARGET_SHA}"
          git -C target clean -ffdx
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"
          cat > evidence/summary.json <<EOF
          {
            "schema_version": 1,
            "artifact_kind": "Causal4DPR211ExactHeadValidation",
            "target_sha": "${TARGET_SHA}",
            "base_sha": "${BASE_SHA}",
            "scope_file_count": 4,
            "ruff_passed": true,
            "format_passed": true,
            "syntax_warning_gate_passed": true,
            "complete_pytest_passed": true,
            "distributions_passed": true,
            "installed_cli_passed": true,
            "target_outcomes_used": false,
            "physical_data_accessed": false
          }
          EOF
          sha256sum evidence/summary.json > evidence/summary.sha256

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr211-exact-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  report:
    name: Report validation result
    needs: [announce, validate]
    if: always() && needs.announce.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment final result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          cat > /tmp/result.md <<EOF
          ## PR 211 exact-head validation result

          - Workflow run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`
          - Exact target SHA: \`${TARGET_SHA}\`
          - Validation result: **${VALIDATION_RESULT}**
          - Evidence artifact: \`pr211-exact-head-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`

          The artifact contains the scope inventory, runtime identity, dependency freeze, Ruff and formatting logs, complete pytest log, distribution hashes, installed-wheel checks, and compact summary when all gates passed.
          EOF
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/result.md
          test "${VALIDATION_RESULT}" = "success"

  cleanup:
    name: Remove temporary PR 211 validation workflow
    needs: [announce, validate, report]
    if: always() && needs.announce.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Remove temporary workflow from main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f \
            cleanup/.github/workflows/temporary-pr211-exact-head-validation.yml; then
            git -C cleanup rm \
              .github/workflows/temporary-pr211-exact-head-validation.yml
            git -C cleanup commit -m \
              "Remove temporary PR 211 validation workflow"
            git -C cleanup push origin HEAD:main
          fi
