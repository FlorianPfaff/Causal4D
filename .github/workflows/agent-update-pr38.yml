name: Update PR 38 to current main

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/rebased-ci-dependency-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/rebased-ci-dependency-boundaries
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/agent-update-pr38.yml
          git add .github/workflows
          git commit --amend --no-edit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate current-main consolidation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m pytest -q
          python scripts/ci/check_console_help.py --pyproject pyproject.toml
          python scripts/ci/verify_frozen_manifest.py \
            milestones/v0.3.0-causal4d-aip
          test -z "$(git status --porcelain)"
      - name: Publish updated branch
        run: git push origin HEAD:agent/rebased-ci-dependency-boundaries
