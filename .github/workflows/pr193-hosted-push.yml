name: PR 193 trusted hosted push study

on:
  push:
    branches:
      - agent/lock-real-analysis-reporting
    paths:
      - "scientific-trigger/pr193-hosted.txt"

permissions:
  contents: read

concurrency:
  group: pr193-hosted-push-study
  cancel-in-progress: false

env:
  TARGET_SHA: fa6a64b2442474321e453e9e8fdccd591e0a282d
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  hosted-study:
    name: Registered-design audit and controlled standard replication
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out trusted execution helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/lock-real-analysis-reporting
          path: executor
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out immutable PR 193 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact evaluation stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --short)"
          python -m venv .pr193-hosted-venv
          echo "VIRTUAL_ENV=${PWD}/.pr193-hosted-venv" >> "${GITHUB_ENV}"
          echo "${PWD}/.pr193-hosted-venv/bin" >> "${GITHUB_PATH}"
          .pr193-hosted-venv/bin/python -m pip install --upgrade pip
          .pr193-hosted-venv/bin/python -m pip install -e "./target[dev]"
          .pr193-hosted-venv/bin/python -m pip check
          mkdir -p work/pr193-hosted-push
          .pr193-hosted-venv/bin/python -m pip freeze --all \
            > work/pr193-hosted-push/pip-freeze.txt
          git -C target reset --hard "${TARGET_SHA}"
          git -C target clean -ffdx
          test -z "$(git -C target status --short)"

      - name: Run scientific study
        shell: bash
        run: |
          set -euo pipefail
          python executor/scripts/ci/run_pr193_hosted_push_study.py \
            --target-root target \
            --output-dir work/pr193-hosted-push \
            --profile standard \
            | tee work/pr193-hosted-push/console.log

      - name: Upload scientific result bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: causal4d-pr193-hosted-push-${{ github.run_id }}
          path: work/pr193-hosted-push/
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated environment
        if: always()
        run: rm -rf .pr193-hosted-venv
