name: Format PR 41

on:
  push:
    branches:
      - agent/validate-prob4d-joint-gauge-contract

permissions:
  contents: write

concurrency:
  group: format-pr41
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/validate-prob4d-joint-gauge-contract
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the repository formatter
        run: python -m pip install -e ".[dev]"
      - name: Format changed Python files
        run: |
          python -m ruff format \
            src/causal4d/prob4d_observation_contract.py \
            src/causal4d/prob4d_observation_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py
          rm .github/workflows/agent-format-pr41.yml
      - name: Publish formatted branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/prob4d_observation_contract.py \
            src/causal4d/prob4d_observation_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py \
            .github/workflows/agent-format-pr41.yml
          git commit -m "Format joint observation contract"
          git push origin HEAD:agent/validate-prob4d-joint-gauge-contract
