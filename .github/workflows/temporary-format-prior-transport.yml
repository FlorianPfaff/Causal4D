name: Temporary format prior transport

on:
  push:
    branches:
      - "agent/prior-consistent-counterfactual-transport"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Format changed Python files
        run: |
          python -m ruff format \
            src/causal4d/counterfactual.py \
            tests/test_counterfactual_prior_transport.py
          python -m ruff check \
            src/causal4d/counterfactual.py \
            tests/test_counterfactual_prior_transport.py
      - name: Stage formatted files
        run: |
          mkdir -p formatted/src/causal4d formatted/tests
          cp src/causal4d/counterfactual.py formatted/src/causal4d/
          cp tests/test_counterfactual_prior_transport.py formatted/tests/
      - name: Upload formatted files
        uses: actions/upload-artifact@v7
        with:
          name: prior-transport-formatted
          path: formatted/
          if-no-files-found: error
