name: Temporary format prior transport

on:
  push:
    branches:
      - "agent/prior-consistent-counterfactual-transport"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: "agent/prior-consistent-counterfactual-transport"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.22"
      - name: Format and lint changed Python files
        run: |
          python -m ruff format \
            src/causal4d/counterfactual.py \
            tests/test_counterfactual_prior_transport.py
          python -m ruff check \
            src/causal4d/counterfactual.py \
            tests/test_counterfactual_prior_transport.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal4d/counterfactual.py tests/test_counterfactual_prior_transport.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply Ruff formatting"
            git push origin HEAD:agent/prior-consistent-counterfactual-transport
          fi
