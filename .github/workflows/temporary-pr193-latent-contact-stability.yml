name: Temporary PR 193 latent-contact stability study

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-pr193-latent-contact-stability
  cancel-in-progress: false

env:
  EXECUTOR_SHA: fc7fc879974880ad8e3ff82be8c6dc9da5686087
  TARGET_SHA: fa6a64b2442474321e453e9e8fdccd591e0a282d
  TRIGGER_TITLE: "[automation] run pr193 latent-contact stability 3000-3500"
  DIAGNOSTIC_SEEDS: "3000:3500"
  REGISTERED_NODE_ACCURACY_THRESHOLD: "0.80"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  announce:
    name: Publish immutable execution identity
    if: >-
      github.event.issue.title ==
      '[automation] run pr193 latent-contact stability 3000-3500' &&
      github.event.issue.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment start identity
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          cat > /tmp/start.md <<EOF
          ## Stability study started

          - Workflow run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`
          - Executor SHA: \`${EXECUTOR_SHA}\`
          - Registered-analysis target SHA: \`${TARGET_SHA}\`
          - Fresh seed panel: \`${DIAGNOSTIC_SEEDS}\`
          - Frozen exact-node threshold: \`${REGISTERED_NODE_ACCURACY_THRESHOLD}\`
          - Runner request: \`self-hosted, Linux, X64, nvidia-smi\`

          No estimator setting, threshold, registered physical protocol, or target-access boundary is changed by this diagnostic.
          EOF
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/start.md

  stability:
    name: Frozen 500-seed latent-contact stability study
    needs: announce
    if: needs.announce.result == 'success'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out immutable execution code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.EXECUTOR_SHA }}
          path: executor
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out immutable registered-analysis target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify revisions and isolated runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C executor rev-parse HEAD)" = "${EXECUTOR_SHA}"
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C executor status --porcelain=v1)"
          test -z "$(git -C target status --porcelain=v1)"
          mkdir -p evidence/contact-posterior
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "executor_sha=${EXECUTOR_SHA}"
            echo "target_sha=${TARGET_SHA}"
            echo "seeds=${DIAGNOSTIC_SEEDS}"
            echo "registered_node_accuracy_threshold=${REGISTERED_NODE_ACCURACY_THRESHOLD}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
            lscpu
          } | tee evidence/contact-posterior/environment.txt
          nvidia-smi | tee evidence/contact-posterior/nvidia-smi.txt

      - name: Install isolated frozen evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr193-latent-stability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${venv}"
          echo "STABILITY_VENV=${venv}" >> "${GITHUB_ENV}"
          echo "${venv}/bin" >> "${GITHUB_PATH}"
          "${venv}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${venv}/bin/python" -m pip install -e "./target[dev]"
          "${venv}/bin/python" -m pip check
          "${venv}/bin/python" -m pip freeze --all \
            > evidence/contact-posterior/pip-freeze.txt
          "${venv}/bin/python" -m py_compile \
            executor/scripts/ci/run_pr193_latent_contact_stability.py
          git -C target reset --hard "${TARGET_SHA}"
          git -C target clean -ffdx
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"

      - name: Run fixed-design fresh-seed study
        id: study
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python executor/scripts/ci/run_pr193_latent_contact_stability.py \
            --target-root target \
            --output-root evidence/contact-posterior \
            --target-sha "${TARGET_SHA}" \
            --seeds "${DIAGNOSTIC_SEEDS}" \
            --threshold "${REGISTERED_NODE_ACCURACY_THRESHOLD}" \
            2>&1 | tee evidence/contact-posterior/study-console.log
          test "$(git -C executor rev-parse HEAD)" = "${EXECUTOR_SHA}"
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C executor status --porcelain=v1)"
          test -z "$(git -C target status --porcelain=v1)"

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr193-latent-contact-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/contact-posterior/
          if-no-files-found: error
          retention-days: 30

      - name: Publish result to trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          STUDY_OUTCOME: ${{ steps.study.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f evidence/contact-posterior/stability/summary.json; then
            python - <<'PY' > evidence/contact-posterior/result-comment.md
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("evidence/contact-posterior/stability/summary.json")
              .read_text(encoding="utf-8")
          )
          overall = result["overall_shifted_online"]
          interval = overall["seed_cluster_bootstrap_95_interval"]
          print("## Stability study result")
          print()
          print(f"- Workflow run: `{os.environ['GITHUB_RUN_ID']}` attempt `{os.environ['GITHUB_RUN_ATTEMPT']}`")
          print(f"- Study step outcome: **{os.environ['STUDY_OUTCOME']}**")
          print(f"- Target SHA: `{result['target_sha']}`")
          print(f"- Fresh seeds: `{result['seed_range']}` ({result['seed_count']})")
          print(f"- Exact-node accuracy: **{overall['accuracy']:.4%}** ({overall['correct_count']}/{overall['case_count']})")
          print(f"- Seed-cluster bootstrap 95% interval: `[{interval[0]:.4%}, {interval[1]:.4%}]`")
          print(f"- Frozen threshold: `{result['frozen_node_accuracy_threshold']:.2%}`")
          print(f"- Threshold margin: `{result['threshold_margin']:.4%}`")
          print(f"- 50-seed blocks passing: `{result['block_pass_count']}/{result['block_count']}`")
          print(f"- All source bundles passed semantic integrity: `{result['all_source_integrity_passed']}`")
          print()
          print(result["claim_boundary"])
          PY
          else
            cat > evidence/contact-posterior/result-comment.md <<EOF
          ## Stability study result

          - Workflow run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`
          - Study step outcome: **${STUDY_OUTCOME}**
          - No validated summary was produced. Inspect the uploaded evidence artifact and job log.
          EOF
          fi
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file evidence/contact-posterior/result-comment.md

      - name: Enforce study success
        if: always()
        env:
          STUDY_OUTCOME: ${{ steps.study.outcome }}
        shell: bash
        run: test "${STUDY_OUTCOME}" = "success"

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "${STABILITY_VENV:-}" || true

  cleanup:
    name: Remove temporary stability workflow
    needs: [announce, stability]
    if: always() && needs.announce.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove temporary workflow from main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C cleanup rm \
            .github/workflows/temporary-pr193-latent-contact-stability.yml
          git -C cleanup commit -m \
            "Remove temporary PR 193 stability workflow"
          git -C cleanup push origin HEAD:main
