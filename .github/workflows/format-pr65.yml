name: Format PR 65 once

on:
  push:
    branches:
      - agent/freeze-confirmatory-calibration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/freeze-confirmatory-calibration
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository Ruff range
        run: python -m pip install "ruff>=0.15.22,<0.17"
      - name: Apply Ruff formatting
        run: |
          python -m ruff format \
            src/causal4d/real_experiment_freeze.py \
            tests/test_real_experiment_freeze.py
      - name: Commit formatter output and remove this workflow
        run: |
          git rm .github/workflows/format-pr65.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal4d/real_experiment_freeze.py tests/test_real_experiment_freeze.py
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:agent/freeze-confirmatory-calibration
