name: Finalize evidence publication hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-harden-evidence-publication-v3
  cancel-in-progress: true

jobs:
  materialize-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-evidence-publication
          fetch-depth: 0
          persist-credentials: true

      - name: Overlay validated public-provider integration
        shell: bash
        run: |
          set -euo pipefail
          provider_commit=9c29988c5c4ce9cef8a0211f8069cca2607daae1
          git fetch --no-tags origin "$provider_commit"
          git checkout "$provider_commit" -- \
            .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            .github/workflows/ci.yml \
            docs/ci.md \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py

      - name: Materialize integrity hardening patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          from pathlib import Path
          import subprocess

          source_commit = "c0f3325f0c02c9d188fbd27c0e94b36d7454c840"
          source_path = ".github/workflows/agent-harden-evidence-publication.yml"
          text = subprocess.check_output(
              ["git", "show", f"{source_commit}:{source_path}"],
              text=True,
          )
          marker = "base64 --decode <<'PATCH' | gzip --decompress > /tmp/apply_agent_hardening.py"
          start = text.index(marker)
          payload_start = text.index("\n", start) + 1
          payload_end = text.index("\n          PATCH", payload_start)
          payload = "".join(
              line.strip() for line in text[payload_start:payload_end].splitlines()
          )
          script = gzip.decompress(base64.b64decode(payload)).decode("utf-8")
          script = script.replace(
              "ROOT = Path(__file__).resolve().parents[2]",
              "ROOT = Path.cwd()",
          )
          Path("/tmp/apply_agent_hardening.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply_agent_hardening.py

      - name: Complete static-analysis and metadata contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/ci.yml")
          workflow_lines = workflow_path.read_text(encoding="utf-8").splitlines()
          matches = [
              index
              for index, line in enumerate(workflow_lines)
              if line.strip().startswith("python -m mypy ")
              and "--python-version" not in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one CI mypy invocation, found {len(matches)}"
              )
          index = matches[0]
          workflow_lines[index] = workflow_lines[index].replace(
              "python -m mypy ",
              "python -m mypy --python-version 3.12 ",
              1,
          )
          workflow_path.write_text(
              "\n".join(workflow_lines) + "\n",
              encoding="utf-8",
          )

          script_path = Path("scripts/ci/run_self_hosted_evaluation.py")
          script_text = script_path.read_text(encoding="utf-8")
          old_annotation = "    array = np.asarray(values, dtype=float)\n"
          new_annotation = "    array: np.ndarray = np.asarray(values, dtype=float)\n"
          if script_text.count(old_annotation) != 1:
              raise SystemExit("bootstrap array assignment was not found exactly once")
          script_path.write_text(
              script_text.replace(old_annotation, new_annotation, 1),
              encoding="utf-8",
          )

          citation_path = Path("tests/test_citation_metadata.py")
          citation_text = citation_path.read_text(encoding="utf-8")
          replacements = (
              (
                  "import re\nfrom pathlib import Path\n",
                  "import re\nfrom pathlib import Path\n\n"
                  "from causal4d import __version__\n",
              ),
              (
                  "    version_match = re.search(r'(?m)^version = \"([^\"]+)\"$', pyproject)\n"
                  "    assert version_match is not None\n\n",
                  "",
              ),
              (
                  '    assert _required_scalar(citation, "version") == version_match.group(1)\n',
                  '    assert _required_scalar(citation, "version") == __version__\n',
              ),
              (
                  '    assert \'license = { file = "LICENSE" }\' in pyproject\n'
                  '    assert \'"License :: OSI Approved :: MIT License"\' in pyproject\n',
                  '    assert \'license = "MIT"\' in pyproject\n'
                  '    assert \'license-files = ["LICENSE"]\' in pyproject\n'
                  '    assert \'"License :: OSI Approved :: MIT License"\' not in pyproject\n',
              ),
          )
          for old, new in replacements:
              if citation_text.count(old) != 1:
                  raise SystemExit(
                      f"citation metadata contract fragment missing: {old!r}"
                  )
              citation_text = citation_text.replace(old, new, 1)
          citation_path.write_text(citation_text, encoding="utf-8")
          PY

      - name: Remove one-shot executors before validation
        run: |
          rm -f \
            .github/workflows/agent-harden-evidence-publication-v2.yml \
            .github/workflows/agent-harden-evidence-publication-v3.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: python -m pip install -e ".[dev]"

      - name: Format every changed or newly created Python file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            {
              git diff --name-only --diff-filter=ACMR HEAD -- '*.py'
              git ls-files --others --exclude-standard -- '*.py'
            } | sort -u
          )
          printf '%s\n' "${files[@]}"
          if (( ${#files[@]} )); then
            python -m ruff format "${files[@]}"
          fi

      - name: Run quality checks
        run: |
          python -m ruff check .
          python -m mypy --python-version 3.12 \
            scripts/ci \
            src/causal4d/atomic_io.py \
            src/causal4d/result_bundle_publication.py \
            src/causal4d/trusted_pickle.py \
            src/causal4d/immutable_array.py \
            src/causal4d/immutable_json.py \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_trusted_pickle.py \
            tests/test_trusted_pickle_cli_contract.py \
            tests/test_result_bundle_publication.py \
            tests/test_package_contract.py \
            tests/test_citation_metadata.py \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py

      - name: Run core test suite
        run: python -m pytest -q

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          rm -rf build dist src/*.egg-info

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden evidence publication and provider inputs"
          git push origin HEAD:agent/harden-evidence-publication
