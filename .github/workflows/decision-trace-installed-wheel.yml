name: Decision-trace installed-wheel compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/decision-trace-installed-wheel.yml"
      - "docs/decision_trace.md"
      - "pyproject.toml"
      - "requirements/ci/bayesian-phystwin-three-repository.sha"
      - "requirements/ci/prob4d-three-repository.sha"
      - "src/causal4d/__init__.py"
      - "src/causal4d/atomic_io.py"
      - "src/causal4d/cli/root.py"
      - "src/causal4d/cli/stack.py"
      - "src/causal4d/decision_trace.py"
      - "src/causal4d/immutable_json.py"
      - "src/causal4d/stack_lock.py"
      - "tests/test_decision_trace.py"
      - "tests/test_decision_trace_workflow_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/decision-trace-installed-wheel.yml"
      - "docs/decision_trace.md"
      - "pyproject.toml"
      - "requirements/ci/bayesian-phystwin-three-repository.sha"
      - "requirements/ci/prob4d-three-repository.sha"
      - "src/causal4d/__init__.py"
      - "src/causal4d/atomic_io.py"
      - "src/causal4d/cli/root.py"
      - "src/causal4d/cli/stack.py"
      - "src/causal4d/decision_trace.py"
      - "src/causal4d/immutable_json.py"
      - "src/causal4d/stack_lock.py"
      - "tests/test_decision_trace.py"
      - "tests/test_decision_trace_workflow_policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-trace-installed-wheel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    name: Decision trace against exact installed stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Causal4D merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: causal4d
          persist-credentials: false

      - name: Check out pinned BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: 68eaf4f4daaf7066f56f3ef8a4add65a5ae70059
          path: bayesian-phystwin
          persist-credentials: false

      - name: Check out pinned Prob4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Prob4D
          ref: 47e0568781d96f09b8df4bb650097b129e23c178
          path: prob4d
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            causal4d/pyproject.toml
            bayesian-phystwin/pyproject.toml
            prob4d/pyproject.toml

      - name: Verify exact clean source identities
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          for repository in causal4d bayesian-phystwin prob4d; do
            test -z "$(git -C "$repository" status --porcelain=v1 --untracked-files=all)"
          done
          test "$(cat causal4d/requirements/ci/bayesian-phystwin-three-repository.sha)" = \
            "$(git -C bayesian-phystwin rev-parse HEAD)"
          test "$(cat causal4d/requirements/ci/prob4d-three-repository.sha)" = \
            "$(git -C prob4d rev-parse HEAD)"
          echo "causal4d=$(git -C causal4d rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "bpt=$(git -C bayesian-phystwin rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prob4d=$(git -C prob4d rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build all three wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build pip
          wheelhouse="$RUNNER_TEMP/decision-trace-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m build --wheel --outdir "$wheelhouse" prob4d
          python -m build --wheel --outdir "$wheelhouse" bayesian-phystwin
          python -m build --wheel --outdir "$wheelhouse" causal4d
          test "$(find "$wheelhouse" -maxdepth 1 -name '*.whl' | wc -l)" -eq 3
          (
            cd "$wheelhouse"
            sha256sum ./*.whl | sort
          ) | tee "$RUNNER_TEMP/decision-trace-wheel-sha256.txt"

      - name: Install the exact wheels in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/decision-trace-venv"
          wheelhouse="$RUNNER_TEMP/decision-trace-wheelhouse"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          mapfile -t wheels < <(find "$wheelhouse" -maxdepth 1 -name '*.whl' -print | sort)
          "$venv/bin/python" -m pip install \
            "${wheels[@]}" \
            pytest \
            opencv-python-headless
          "$venv/bin/python" -m pip check

      - name: Create and verify the exact content-addressed stack lock
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/decision-trace-venv"
          wheelhouse="$RUNNER_TEMP/decision-trace-wheelhouse"
          lock="$RUNNER_TEMP/decision-trace-stack-lock.json"
          create_output="$RUNNER_TEMP/decision-trace-stack-lock-create.json"
          report="$RUNNER_TEMP/decision-trace-stack-verification.json"
          mapfile -t wheels < <(find "$wheelhouse" -maxdepth 1 -name '*.whl' -print | sort)

          create=("$venv/bin/causal4d" stack create)
          for wheel in "${wheels[@]}"; do
            create+=(--wheel "$wheel")
          done
          create+=(
            --revision "prob4d=${{ steps.revisions.outputs.prob4d }}"
            --revision "bayesian-phystwin=${{ steps.revisions.outputs.bpt }}"
            --revision "causal4d=${{ steps.revisions.outputs.causal4d }}"
            --output "$lock"
            --json
          )
          "${create[@]}" > "$create_output"
          cmp "$lock" "$create_output"

          verify=("$venv/bin/causal4d" stack verify --lock "$lock")
          for wheel in "${wheels[@]}"; do
            verify+=(--wheel "$wheel")
          done
          verify+=(--json)
          "${verify[@]}" | tee "$report"

          STACK_REPORT="$report" "$venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["STACK_REPORT"]).read_text())
          if report.get("valid") is not True:
              raise SystemExit("stack-lock verification did not pass")
          if report.get("wheel_set", {}).get("complete") is not True:
              raise SystemExit("stack-lock wheel set is incomplete")
          if report.get("wheel_set", {}).get("verified") is not True:
              raise SystemExit("stack-lock wheel identities were not verified")
          PY

      - name: Verify imports originate only from installed wheels
        shell: bash
        env:
          CAUSAL4D_SOURCE: ${{ github.workspace }}/causal4d
          BPT_SOURCE: ${{ github.workspace }}/bayesian-phystwin
          PROB4D_SOURCE: ${{ github.workspace }}/prob4d
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/decision-trace-venv/bin/python" - <<'PY'
          import os
          from pathlib import Path

          import bayesian_phystwin
          import causal4d
          import prob4d
          from causal4d import decision_trace

          roots = tuple(
              Path(os.environ[name]).resolve()
              for name in ("CAUSAL4D_SOURCE", "BPT_SOURCE", "PROB4D_SOURCE")
          )
          for module in (causal4d, decision_trace, bayesian_phystwin, prob4d):
              origin = Path(module.__file__).resolve()
              if any(origin.is_relative_to(root) for root in roots):
                  raise SystemExit(f"source-tree import detected: {origin}")
          PY

      - name: Run the decision-trace contract suite against installed wheels
        shell: bash
        run: |
          set -euo pipefail
          run_dir="$RUNNER_TEMP/decision-trace-installed-wheel-tests"
          mkdir -p "$run_dir"
          cp causal4d/tests/test_decision_trace.py "$run_dir/"
          cd "$run_dir"
          env -u PYTHONPATH \
            "$RUNNER_TEMP/decision-trace-venv/bin/python" -m pytest -q \
              --import-mode=importlib \
              test_decision_trace.py
