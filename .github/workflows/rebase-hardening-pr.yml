name: Rebase hardening PR

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: rebase-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Merge current main and resolve the redundant backend overlap
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ ${merge_status} -ne 0 ]]; then
            echo "Resolving expected overlap with the independently merged PR #86."
          fi

          git checkout origin/main -- src/causal4d/phystwin_backend.py
          git checkout origin/main -- tests/test_causal4d_phystwin_backend.py

          python - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d/phystwin_backend.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = (
              "from causal4d.graph_provider_contract import "
              "require_bayesian_phystwin_graph_provider\n"
          )
          shared_import = (
              import_anchor
              + "from causal4d.immutable_array import readonly_array as _readonly_array\n"
          )
          helper = '''def _readonly_array(
              values: np.ndarray,
              *,
              dtype: Any = float,
          ) -> np.ndarray:
              """Return an independent immutable NumPy array."""

              array = np.asarray(values, dtype=dtype).copy()
              array.setflags(write=False)
              return array


          '''
          if import_anchor not in text:
              raise SystemExit("provider import anchor was not found")
          if helper not in text:
              raise SystemExit("merged backend helper block was not found")
          text = text.replace(import_anchor, shared_import, 1).replace(helper, "", 1)
          path.write_text(text, encoding="utf-8")
          PY

          unresolved=$(git diff --name-only --diff-filter=U)
          if [[ -n "${unresolved}" ]]; then
            echo "Unexpected unresolved paths:"
            echo "${unresolved}"
            exit 1
          fi

      - name: Install development environment
        run: python -m pip install -e ".[dev]"

      - name: Format and validate the rebased tree
        run: |
          python -m ruff format src/causal4d/phystwin_backend.py
          python -m ruff check .
          python -m compileall -q src tests
          python -m pytest -q
          git diff --check

      - name: Remove temporary workflow and commit the merge
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/workflows/rebase-hardening-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebase hardening patch onto current main"
          git push origin "HEAD:${HEAD_BRANCH}"
