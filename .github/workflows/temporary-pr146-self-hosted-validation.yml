name: Temporary PR 146 self-hosted validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-pr146-self-hosted-validation.yml
      - src/causal4d/belief_provider_contract.py
      - src/causal4d/graph_provider_contract.py
      - src/causal4d/provider_contract.py
      - src/causal4d/replay_provider_contract.py
      - tests/test_child_provider_contract_strict_inputs.py
      - tests/test_provider_contract_strict_inputs.py
      - tests/test_replay_provider_contract_strict_inputs.py

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 60
    steps:
      - name: Check out mutable pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-replay-provider-manifest
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and statically validate the changed Python surface
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/causal4d/belief_provider_contract.py
            src/causal4d/graph_provider_contract.py
            src/causal4d/provider_contract.py
            src/causal4d/replay_provider_contract.py
            tests/test_child_provider_contract_strict_inputs.py
            tests/test_provider_contract_strict_inputs.py
            tests/test_replay_provider_contract_strict_inputs.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy \
            src/causal4d/belief_provider_contract.py \
            src/causal4d/graph_provider_contract.py \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py
          git diff --check

      - name: Run strict-provider regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_child_provider_contract_strict_inputs.py \
            tests/test_provider_contract_strict_inputs.py \
            tests/test_replay_provider_contract_strict_inputs.py

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          python -m twine check dist/*

      - name: Publish formatter-only changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/causal4d/belief_provider_contract.py \
            src/causal4d/graph_provider_contract.py \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py \
            tests/test_child_provider_contract_strict_inputs.py \
            tests/test_provider_contract_strict_inputs.py \
            tests/test_replay_provider_contract_strict_inputs.py
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format strict provider input hardening'
          git push origin HEAD:agent/harden-replay-provider-manifest
