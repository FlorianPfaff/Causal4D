name: Temporary PR 146 self-hosted validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-pr146-self-hosted-validation.yml
      - src/causal4d/belief_provider_contract.py
      - src/causal4d/graph_provider_contract.py
      - src/causal4d/provider_contract.py
      - src/causal4d/replay_provider_contract.py
      - tests/test_belief_provider_strict_inputs.py
      - tests/test_graph_provider_strict_inputs.py
      - tests/test_replay_provider_strict_inputs.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 30
    steps:
      - name: Check out pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint, format, and type-check
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy src/causal4d
          git diff --check

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Build and verify distributions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          python -m twine check dist/*
