name: Diagnose CI-boundary rebase

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/run-ci-boundary-rebase'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Merge reviewed CI branch and report conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/ci-dependency-boundaries
          git switch -c agent/rebased-ci-dependency-boundaries
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          status=$?
          set -e
          {
            echo "merge_status=$status"
            echo
            echo "conflicts"
            git diff --name-only --diff-filter=U
            echo
            echo "status"
            git status --short
            echo
            echo "unmerged_index"
            git ls-files -u
          } > ci-boundary-rebase-report.txt
          cat ci-boundary-rebase-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ci-boundary-rebase-report
          path: ci-boundary-rebase-report.txt
          retention-days: 2
