name: Patch transferred workflow references

on:
  push:
    branches:
      - agent/self-hosted-evaluation
    paths:
      - ".github/workflows/patch-transferred-workflows.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/self-hosted-evaluation
          persist-credentials: true
      - name: Update active workflow references and remove this helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_paths = (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/optional-integrations.yml"),
              Path(".github/workflows/self-hosted-evaluation.yml"),
          )
          old_repository = "FlorianPfaff/Bayesian-PhysTwin"
          new_repository = "IPS-Stuttgart/Bayesian-PhysTwin"
          replacements = 0
          for path in workflow_paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_repository)
              text = text.replace(old_repository, new_repository)
              replacements += count
              if path.name == "optional-integrations.yml":
                  old_labels = "[self-hosted, linux, x64, gpu]"
                  if text.count(old_labels) != 1:
                      raise SystemExit(
                          "expected the legacy optional GPU label set exactly once"
                      )
                  text = text.replace(
                      old_labels,
                      "[self-hosted, Linux, X64, nvidia-smi]",
                  )
              path.write_text(text, encoding="utf-8")
          if replacements != 5:
              raise SystemExit(
                  f"expected five active provider references, found {replacements}"
              )
          PY
          git rm .github/workflows/patch-transferred-workflows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/optional-integrations.yml \
            .github/workflows/self-hosted-evaluation.yml
          git commit -m "Update workflows after repository transfer"
          git push origin HEAD:agent/self-hosted-evaluation
