name: PR 193 latent-contact stability

on:
  push:
    branches: [ci/pr193-latent-contact-stability-500-v1]
    paths:
      - ".github/workflows/pr193-latent-contact-stability.yml"
      - "scripts/ci/run_pr193_latent_contact_stability.py"

permissions:
  contents: write

concurrency:
  group: pr193-latent-contact-stability-500-v1
  cancel-in-progress: true

env:
  TARGET_SHA: fa6a64b2442474321e453e9e8fdccd591e0a282d
  DIAGNOSTIC_SEEDS: "3000:3500"
  REGISTERED_NODE_ACCURACY_THRESHOLD: "0.80"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  stability:
    name: Frozen 500-seed latent-contact stability study
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Check out exact execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: executor
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Check out immutable registered-analysis target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact revisions and runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C executor rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C executor status --porcelain=v1)"
          test -z "$(git -C target status --porcelain=v1)"
          mkdir -p outputs/contact-posterior
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "executor_sha=${GITHUB_SHA}"
            echo "target_sha=${TARGET_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "seeds=${DIAGNOSTIC_SEEDS}"
            uname -a
            lscpu
          } | tee outputs/contact-posterior/environment.txt
          nvidia-smi | tee outputs/contact-posterior/nvidia-smi.txt

      - name: Publish active-run identity
        shell: bash
        run: |
          set -euo pipefail
          result_root="executor/scientific-results/pr193/latent-contact-stability/latest"
          mkdir -p "${result_root}"
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(
              "executor/scientific-results/pr193/"
              "latent-contact-stability/latest/RUNNING.json"
          )
          value = {
              "schema_version": 1,
              "status": "running",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "executor_sha": os.environ["GITHUB_SHA"],
              "target_sha": os.environ["TARGET_SHA"],
              "seed_range": os.environ["DIAGNOSTIC_SEEDS"],
              "started_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git -C executor config user.name "github-actions[bot]"
          git -C executor config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C executor add scientific-results/pr193/latent-contact-stability
          git -C executor commit -m \
            "Start latent-contact stability run ${GITHUB_RUN_ID}"
          git -C executor push origin \
            HEAD:ci/pr193-latent-contact-stability-500-v1

      - name: Install isolated frozen evaluation environment
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/causal4d-latent-stability-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${venv}"
          echo "STABILITY_VENV=${venv}" >> "${GITHUB_ENV}"
          echo "${venv}/bin" >> "${GITHUB_PATH}"
          "${venv}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${venv}/bin/python" -m pip install -e "./target[dev]"
          "${venv}/bin/python" -m pip check
          "${venv}/bin/python" -m pip freeze --all \
            > outputs/contact-posterior/pip-freeze.txt
          "${venv}/bin/python" -m py_compile \
            executor/scripts/ci/run_pr193_latent_contact_stability.py
          git -C target reset --hard "${TARGET_SHA}"
          git -C target clean -ffdx
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"

      - name: Run fixed-design fresh-seed stability study
        shell: bash
        run: |
          set -euo pipefail
          python executor/scripts/ci/run_pr193_latent_contact_stability.py \
            --target-root target \
            --output-root outputs/contact-posterior \
            --target-sha "${TARGET_SHA}" \
            --seeds "${DIAGNOSTIC_SEEDS}" \
            --threshold "${REGISTERED_NODE_ACCURACY_THRESHOLD}"

      - name: Publish compact validated result
        shell: bash
        run: |
          set -euo pipefail
          result_root="executor/scientific-results/pr193/latent-contact-stability/latest"
          rm -f "${result_root}/RUNNING.json"
          cp outputs/contact-posterior/stability/summary.json \
            "${result_root}/summary.json"
          cp outputs/contact-posterior/stability/summary.md \
            "${result_root}/summary.md"
          cp outputs/contact-posterior/environment.txt \
            "${result_root}/environment.txt"
          sha256sum outputs/contact-posterior/stability/summary.json \
            | awk '{print $1}' > "${result_root}/SUMMARY_SHA256.txt"
          printf '%s\n' "${GITHUB_RUN_ID}" \
            > "executor/scientific-results/pr193/latent-contact-stability/LATEST_RUN.txt"
          git -C executor add scientific-results/pr193/latent-contact-stability
          git -C executor diff --cached --check
          git -C executor commit -m \
            "Record latent-contact stability run ${GITHUB_RUN_ID}"
          git -C executor push origin \
            HEAD:ci/pr193-latent-contact-stability-500-v1

      - name: Publish concise job summary
        shell: bash
        run: |
          cat outputs/contact-posterior/stability/summary.md \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify immutable target remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr193-latent-contact-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/contact-posterior/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "${STABILITY_VENV:-}" || true
