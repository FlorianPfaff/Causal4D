name: Extended compatibility

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  agent-public-provider-patch:
    name: Export validated public provider CI
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/public-provider-integration'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 20
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select existing runner Python
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            /home/florianpfaff/.venvs/bpt-gpu/bin/python
            /home/github-runner/.venvs/bpt-gpu/bin/python
            /home/github-runner/.cache/venvs/bpt-gpu/bin/python
            /home/github-runner/miniconda3/envs/bpt-gpu/bin/python
            /opt/hostedtoolcache/Python/3.12.3/x64/bin/python
            /usr/bin/python3
          )
          for candidate in "${candidates[@]}"; do
            if [[ -x "$candidate" ]] && "$candidate" -m pip --version >/dev/null 2>&1; then
              echo "AGENT_PYTHON=$candidate" >> "$GITHUB_ENV"
              "$candidate" --version
              exit 0
            fi
          done
          echo "No runner Python with pip is available" >&2
          exit 1
      - name: Install isolated test tools
        shell: bash
        run: |
          set -euo pipefail
          toolsite="$RUNNER_TEMP/causal4d-agent-site"
          rm -rf "$toolsite"
          mkdir -p "$toolsite"
          "$AGENT_PYTHON" -m pip install \
            --target "$toolsite" \
            "pytest>=8" \
            "ruff>=0.15.22,<0.17" \
            pyyaml
          echo "PYTHONPATH=$PWD/src:$toolsite" >> "$GITHUB_ENV"
      - name: Apply and format focused patch
        run: |
          "$AGENT_PYTHON" scripts/ci/agent_apply_public_provider_ci.py
          "$AGENT_PYTHON" -m ruff format \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py
      - name: Validate focused patch
        run: |
          "$AGENT_PYTHON" -m ruff check \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py
          "$AGENT_PYTHON" -m ruff format --check \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py
          "$AGENT_PYTHON" -m pytest -ra \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py \
            tests/test_github_action_pins.py
          "$AGENT_PYTHON" - <<'PY'
          from pathlib import Path

          import yaml

          for path in (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/compatibility.yml"),
              Path(
                  ".github/workflows/"
                  "bayesian-phystwin-provider-compatibility.yml"
              ),
          ):
              yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          PY
          "$AGENT_PYTHON" scripts/ci/read_bpt_pin.py
          git diff --check
      - name: Stage validated patch export
        run: |
          mkdir -p "$RUNNER_TEMP/public-provider-patch/.github/workflows"
          mkdir -p "$RUNNER_TEMP/public-provider-patch/docs"
          mkdir -p "$RUNNER_TEMP/public-provider-patch/tests"
          cp .github/workflows/ci.yml \
            "$RUNNER_TEMP/public-provider-patch/.github/workflows/ci.yml"
          cp .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            "$RUNNER_TEMP/public-provider-patch/.github/workflows/"
          cp docs/ci.md "$RUNNER_TEMP/public-provider-patch/docs/ci.md"
          cp tests/test_release_workflow_policy.py \
            "$RUNNER_TEMP/public-provider-patch/tests/"
          cp tests/test_three_repository_workflow_policy.py \
            "$RUNNER_TEMP/public-provider-patch/tests/"
      - name: Upload validated patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-provider-ci-patch
          path: ${{ runner.temp }}/public-provider-patch
          if-no-files-found: error
          include-hidden-files: true

  remaining-python-minors:
    name: Core-only / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development dependencies only
        run: python -m pip install -e ".[dev]"
      - name: Assert optional runtimes are absent
        run: |
          python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into core job: {present}")
          PY
      - name: Run core-compatible default suite
        run: |
          python -m pytest \
            --junitxml="pytest-extended-${{ matrix.python-version }}.xml"
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-extended-${{ matrix.python-version }}
          path: pytest-extended-${{ matrix.python-version }}.xml

  minimum-dependencies:
    name: Declared dependency floors / Python 3.10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Build the package in an isolated build environment
        run: |
          python -m venv build-venv
          build-venv/bin/python -m pip install build
          build-venv/bin/python -m build --wheel --outdir dist-floor
      - name: Install exact declared runtime floors
        run: |
          python -m venv floor-venv
          floor-venv/bin/python -m pip install \
            "numpy==1.24.0" \
            "packaging==23.0" \
            "scipy==1.10.0" \
            "pytest==8.0.0"
          artifact=$(find dist-floor -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$artifact"
          floor-venv/bin/python -m pip install --no-deps "$artifact"
          floor-venv/bin/python -m pip check
      - name: Verify exact floor versions
        run: |
          floor-venv/bin/python - <<'PY'
          from importlib.metadata import version

          expected = {
              "numpy": "1.24.0",
              "packaging": "23.0",
              "scipy": "1.10.0",
              "pytest": "8.0.0",
          }
          actual = {name: version(name) for name in expected}
          if actual != expected:
              raise SystemExit(
                  f"minimum-dependency environment drifted: {actual!r} != {expected!r}"
              )
          PY
      - name: Assert optional runtimes are absent
        run: |
          floor-venv/bin/python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into floor job: {present}")
          PY
      - name: Run core-compatible suite at dependency floors
        run: |
          floor-venv/bin/python -m pytest \
            --junitxml="pytest-minimum-dependencies.xml"
      - name: Record resolved minimum environment
        if: always()
        run: |
          floor-venv/bin/python -m pip freeze --all > minimum-environment.txt
          floor-venv/bin/python - <<'PY' > minimum-platform.json
          import json
          import platform
          import sys

          print(
              json.dumps(
                  {
                      "implementation": platform.python_implementation(),
                      "machine": platform.machine(),
                      "platform": platform.platform(),
                      "python": platform.python_version(),
                      "python_executable": sys.executable,
                  },
                  indent=2,
                  sort_keys=True,
              )
          )
          PY
      - name: Upload floor-environment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: minimum-dependency-evidence
          path: |
            minimum-environment.txt
            minimum-platform.json
            pytest-minimum-dependencies.xml
