name: Temporary PR 211 staged-preflight validation

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: temporary-pr211-staged-preflight-validation
  cancel-in-progress: false

env:
  TARGET_SHA: fcea4770718a729ed464fce4336cc38905c0cc51
  BASE_SHA: 17e04a16b2a999ccd28b3196841f84951e0d48e2
  TRIGGER_TITLE: "[automation] validate pr211 staged preflight fcea4770"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate immutable PR 211 staged-preflight head
    if: >-
      github.event.issue.title ==
      '[automation] validate pr211 staged preflight fcea4770' &&
      github.event.issue.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/pyproject.toml

      - name: Verify exact revision and seven-file scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"
          git -C target cat-file -e "${BASE_SHA}^{commit}"
          git -C target diff --name-only "${BASE_SHA}" "${TARGET_SHA}" \
            | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          docs/causal4d_preacquisition_next_action.md
          docs/causal4d_source_panel_staging_preflight.md
          src/causal4d/cli/preacquisition_readiness.py
          src/causal4d/preacquisition_next_action.py
          src/causal4d/preacquisition_source_panel_staging.py
          tests/test_preacquisition_next_action.py
          tests/test_preacquisition_source_panel_staging.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          mkdir -p evidence
          cp /tmp/actual-files.txt evidence/changed-files.txt
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "target_sha=${TARGET_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            uname -a
          } | tee evidence/environment.txt

      - name: Install exact development environment
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install ".[dev]"
          python -m pip check
          python -m pip freeze --all > ../evidence/pip-freeze.txt

      - name: Run exact-head validation
        id: validation
        continue-on-error: true
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/causal4d/cli/preacquisition_readiness.py
            src/causal4d/preacquisition_next_action.py
            src/causal4d/preacquisition_source_panel_staging.py
            tests/test_preacquisition_next_action.py
            tests/test_preacquisition_source_panel_staging.py
          )
          {
            python -m ruff check .
            python -m ruff format --check "${files[@]}"
            python -W error -m compileall -q src tests scripts
            python -m pytest -q -p no:cacheprovider \
              tests/test_preacquisition_next_action.py \
              tests/test_preacquisition_source_panel_staging.py
            python -m pytest -q -p no:cacheprovider
            python -m build --outdir ../evidence/dist
            python -m twine check ../evidence/dist/*
          } 2>&1 | tee ../evidence/validation.log
          sha256sum ../evidence/dist/* > ../evidence/distribution-sha256.txt
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Validate installed wheel and CLI routes
        id: installed
        continue-on-error: true
        if: always() && steps.validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr211-installed-${GITHUB_RUN_ID}"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --upgrade pip
          wheel_path="$(find evidence/dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_path}"
          "${venv}/bin/python" -m pip install "${wheel_path}"
          "${venv}/bin/python" -m pip check
          (
            cd "${RUNNER_TEMP}"
            unset PYTHONPATH
            "${venv}/bin/causal4d" --help
            "${venv}/bin/causal4d" protocol readiness next-action --help
            "${venv}/bin/causal4d" protocol readiness \
              source-panel-verify-staged --help
            "${venv}/bin/causal4d" commands validate --require-installed
            "${venv}/bin/python" - <<PY
          import pathlib
          import causal4d

          package = pathlib.Path(causal4d.__file__).resolve()
          checkout = pathlib.Path("${GITHUB_WORKSPACE}/target").resolve()
          assert checkout not in package.parents, package
          print(package)
          PY
          ) 2>&1 | tee evidence/installed-wheel.log
          rm -rf "${venv}"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr211-staged-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        shell: bash
        run: |
          cat > /tmp/result.md <<EOF
          ## PR 211 staged-preflight exact-head validation

          - Target SHA: \`${TARGET_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`
          - Core validation outcome: **${VALIDATION_OUTCOME:-not-run}**
            (Ruff, formatting, compile, focused/full tests, and build)
          - Installed-wheel and CLI routes: **${INSTALLED_OUTCOME:-not-run}**
          - Evidence artifact: \`pr211-staged-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`

          Software validation only. No physical data or target outcomes were accessed.
          EOF
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/result.md

      - name: Remove temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          workflow=cleanup/.github/workflows/temporary-pr211-staging-preflight-validation.yml
          if test -f "${workflow}"; then
            git -C cleanup rm \
              .github/workflows/temporary-pr211-staging-preflight-validation.yml
            git -C cleanup commit -m \
              "Remove temporary PR 211 staged-preflight validation workflow"
            git -C cleanup push origin HEAD:main
          fi

      - name: Enforce exact-head success
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          INSTALLED_OUTCOME: ${{ steps.installed.outcome }}
        shell: bash
        run: |
          test "${VALIDATION_OUTCOME}" = "success"
          test "${INSTALLED_OUTCOME}" = "success"
