name: Publish report-shell and invariant hardening v2

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/agent-harden-report-shell-invariants.patch.b64"
      - ".github/agent-harden-report-shell-invariants.patch.part-*"
      - ".github/workflows/agent-harden-report-shell-invariants.yml"
      - ".github/workflows/agent-harden-report-shell-invariants-v2.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-harden-report-shell-invariants-v2
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, test, and publish the bounded source diff
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-report-shell-invariants'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TREE_SHA: 79876b6dc9bb7a489c6e414d552d955d690df783
      PATCH_SHA256: 579c5809dc74b9a79a958b40e761b45f9e960f71242c8429474d8c5e8a3b100d
    steps:
      - name: Check out the exact draft-PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize immutable reviewed blobs and verify the patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = \
            "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"

          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          tree_sha = os.environ["SOURCE_TREE_SHA"]
          required = (
              "CHANGELOG.md",
              "docs/causal4d_registered_real_report_shell.md",
              "src/causal4d/registered_real_report_shell.py",
              "tests/test_joint_observation_metamorphic.py",
              "tests/test_registered_real_report_shell.py",
          )
          known_blobs = {
              "CHANGELOG.md": "511b62eda996ccee91246dcce6d915ac24e4cc36",
              "docs/causal4d_registered_real_report_shell.md": (
                  "c6f6db5233149fe7162bdb4c2bab404e95324085"
              ),
          }
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "causal4d-bounded-publisher-v2",
          }

          def load_json(url: str) -> dict[str, object]:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          api = f"https://api.github.com/repos/{repository}"
          tree = load_json(f"{api}/git/trees/{tree_sha}?recursive=1")
          if tree.get("truncated") is not False:
              raise SystemExit("reviewed source tree is truncated")
          inventory = tree.get("tree")
          if not isinstance(inventory, list):
              raise SystemExit("reviewed source tree has no entry inventory")
          entries = {
              entry.get("path"): entry
              for entry in inventory
              if isinstance(entry, dict) and entry.get("type") == "blob"
          }
          missing = [path for path in required if path not in entries]
          if missing:
              raise SystemExit(f"reviewed source tree misses required paths: {missing}")

          for path in required:
              entry = entries[path]
              blob_sha = entry.get("sha")
              if not isinstance(blob_sha, str) or len(blob_sha) != 40:
                  raise SystemExit(f"invalid blob identity for {path}")
              expected = known_blobs.get(path)
              if expected is not None and blob_sha != expected:
                  raise SystemExit(f"reviewed blob identity changed for {path}")
              blob = load_json(f"{api}/git/blobs/{blob_sha}")
              if blob.get("encoding") != "base64":
                  raise SystemExit(f"unsupported blob encoding for {path}")
              encoded = blob.get("content")
              if not isinstance(encoded, str):
                  raise SystemExit(f"reviewed blob content missing for {path}")
              compact = "".join(encoded.split())
              payload = base64.b64decode(compact, validate=True)
              declared_size = blob.get("size")
              if type(declared_size) is not int or declared_size != len(payload):
                  raise SystemExit(f"reviewed blob byte count changed for {path}")
              destination = Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)
              print(f"{path}\t{blob_sha}\t{len(payload)}")
          PY

          patch="$RUNNER_TEMP/report-shell-invariants.patch"
          git diff --binary -- \
            CHANGELOG.md \
            docs/causal4d_registered_real_report_shell.md \
            src/causal4d/registered_real_report_shell.py \
            tests/test_joint_observation_metamorphic.py \
            tests/test_registered_real_report_shell.py \
            > "$patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" \
            | sha256sum --check --strict -

          rm -f \
            .github/agent-harden-report-shell-invariants.patch.b64 \
            .github/agent-harden-report-shell-invariants.patch.part-* \
            .github/workflows/agent-harden-report-shell-invariants.yml \
            .github/workflows/agent-harden-report-shell-invariants-v2.yml
          git diff --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate formatting and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/causal4d/registered_real_report_shell.py \
            tests/test_registered_real_report_shell.py \
            tests/test_joint_observation_metamorphic.py
          python -m ruff format --check \
            src/causal4d/registered_real_report_shell.py \
            tests/test_registered_real_report_shell.py \
            tests/test_joint_observation_metamorphic.py
          python -W error::SyntaxWarning -m compileall -q -f \
            src/causal4d/registered_real_report_shell.py \
            tests/test_registered_real_report_shell.py \
            tests/test_joint_observation_metamorphic.py
          python -m pytest -q \
            tests/test_registered_real_report_shell.py \
            tests/test_joint_observation.py \
            tests/test_joint_observation_metamorphic.py \
            tests/test_linear_contact_observation_invariance.py

      - name: Run the complete default suite
        run: python -m pytest -q

      - name: Commit only the reviewable result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(cat <<'EOF'
          .github/agent-harden-report-shell-invariants.patch.b64
          .github/agent-harden-report-shell-invariants.patch.part-00
          .github/workflows/agent-harden-report-shell-invariants-v2.yml
          .github/workflows/agent-harden-report-shell-invariants.yml
          CHANGELOG.md
          docs/causal4d_registered_real_report_shell.md
          src/causal4d/registered_real_report_shell.py
          tests/test_joint_observation_metamorphic.py
          tests/test_registered_real_report_shell.py
          EOF
          )"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Harden report shell and scientific invariants'
          git push origin HEAD:agent/harden-report-shell-invariants
