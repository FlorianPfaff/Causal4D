name: Materialize Deform360 filament support

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/materialize-deform360-filament-support.yml"
      - ".github/materialize/deform360-filament-support.part-*"

permissions:
  contents: write

concurrency:
  group: materialize-deform360-filament-support-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Materialize reviewed product files
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/materialize/deform360-filament-support.part-*)
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          cat "${parts[@]}" | base64 --decode > /tmp/deform360-filament-support.tar.gz
          printf '%s  %s\n' \
            '3b73623088baa0596e934d573568ec31386c314d507500404980dda22915c14b' \
            /tmp/deform360-filament-support.tar.gz \
            | sha256sum --check --strict
          tar -xzf /tmp/deform360-filament-support.tar.gz -C "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path

          graph_path = Path("src/causal4d_public/deform360_replication_graph.py")
          graph = graph_path.read_text(encoding="utf-8")
          replacements = {
              (
                  "    edges = {\n"
                  "        tuple(sorted((row, int(column))))\n"
                  "        for row in range(count)\n"
                  "        for column in indices[row, 1:]\n"
                  "        if row != int(column)\n"
                  "    }\n"
              ): (
                  "    edges: set[tuple[int, int]] = {\n"
                  "        (min(row, int(column)), max(row, int(column)))\n"
                  "        for row in range(count)\n"
                  "        for column in indices[row, 1:]\n"
                  "        if row != int(column)\n"
                  "    }\n"
              ),
              (
                  "    edges.update(\n"
                  "        tuple(sorted((int(row), int(column))))\n"
                  "        for row, column in zip(span_rows, span_columns, strict=True)\n"
                  "    )\n"
              ): (
                  "    edges.update(\n"
                  "        (min(int(row), int(column)), max(int(row), int(column)))\n"
                  "        for row, column in zip(span_rows, span_columns, strict=True)\n"
                  "    )\n"
              ),
              "    adjacency = [set() for _ in range(node_count)]\n": (
                  "    adjacency: list[set[int]] = "
                  "[set() for _ in range(node_count)]\n"
              ),
              "                    bend.add(tuple(sorted((node, second))))\n": (
                  "                    bend.add((min(node, second), max(node, second)))\n"
              ),
          }
          for old, new in replacements.items():
              if graph.count(old) != 1:
                  raise SystemExit(f"unexpected graph source for replacement: {old!r}")
              graph = graph.replace(old, new)
          graph_path.write_text(graph, encoding="utf-8")

          support_path = Path("src/causal4d_public/deform360_filament_support.py")
          support = support_path.read_text(encoding="utf-8")
          old_builder = (
              "    builder = {\n"
              "        REGISTERED_POLICY: build_filament_sparse_graph,\n"
              "        PRIMARY_POLICY: build_filament_sparse_graph_component_bridge,\n"
              "    }.get(policy)\n"
              '    _require(builder is not None, "unknown filament graph policy")\n'
          )
          new_builder = (
              "    if policy == REGISTERED_POLICY:\n"
              "        builder = build_filament_sparse_graph\n"
              "    elif policy == PRIMARY_POLICY:\n"
              "        builder = build_filament_sparse_graph_component_bridge\n"
              "    else:\n"
              '        raise ValueError("unknown filament graph policy")\n'
          )
          if support.count(old_builder) != 1:
              raise SystemExit("unexpected policy-dispatch source")
          support = support.replace(old_builder, new_builder)
          old_reference = (
              '        _require(values["p95"] and values["length"], '
              '"object reference is empty")\n'
          )
          new_reference = (
              "        _require(\n"
              '            bool(values["p95"]) and bool(values["length"]),\n'
              '            "object reference is empty",\n'
              "        )\n"
          )
          if support.count(old_reference) != 1:
              raise SystemExit("unexpected object-reference guard source")
          support = support.replace(old_reference, new_reference)
          support_path.write_text(support, encoding="utf-8")
          PY
          rm -f "${parts[@]}"

      - name: Set up Python 3.12
        if: steps.payload.outputs.needed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        if: steps.payload.outputs.needed == 'true'
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and validate the product patch
        if: steps.payload.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/remote/run_deform360_filament_support.py
            src/causal4d_public/deform360_filament_support.py
            src/causal4d_public/deform360_replication_graph.py
            src/causal4d_public/deform360_rope_graph.py
            tests/test_deform360_filament_support.py
            tests/test_deform360_filament_support_workflow_policy.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/deform360_filament_support.py \
            src/causal4d_public/deform360_replication_graph.py \
            src/causal4d_public/deform360_rope_graph.py \
            scripts/remote/run_deform360_filament_support.py
          bash -n scripts/remote/run_deform360_filament_support_workflow.sh
          python -m pytest -q \
            tests/test_deform360_filament_support.py \
            tests/test_deform360_filament_support_workflow_policy.py \
            tests/test_deform360_rope_graph.py \
            tests/test_deform360_replication_graph.py \
            tests/test_deform360_reset_mechanics.py
          PYTHONPATH=src python - <<'PY'
          from causal4d_public.deform360_filament_support import (
              load_filament_support_lock,
          )

          lock = load_filament_support_lock(
              "configs/causal4d_public/deform360_filament_support_v1.json"
          )
          assert lock["selected_object_ids"] == (
              "002-rope-silk",
              "081-stripe-rope",
          )
          PY
          git diff --check

      - name: Commit the validated product patch
        if: steps.payload.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/materialize \
            CHANGELOG.md \
            configs/causal4d_public/deform360_filament_support_v1.json \
            docs/causal4d_deform360_filament_support.md \
            milestones/deform360-reset-mechanics-v1/README.md \
            milestones/deform360-reset-mechanics-v1/summary.json \
            scripts/remote/run_deform360_filament_support.py \
            scripts/remote/run_deform360_filament_support_workflow.sh \
            src/causal4d_public/deform360_filament_support.py \
            src/causal4d_public/deform360_replication_graph.py \
            src/causal4d_public/deform360_rope_graph.py \
            tests/test_deform360_filament_support.py \
            tests/test_deform360_filament_support_workflow_policy.py
          git diff --cached --check
          git commit -m "Add Deform360 filament support boundary"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
