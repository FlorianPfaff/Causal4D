name: Rebuild PR 210 project-status v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-pr210-project-status-v2.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-pr210-project-status-v2
  cancel-in-progress: false

env:
  EXPECTED_HEAD: ba91b6dec00a5949460eccbd91c20ad58971dfbf
  PRODUCT_BRANCH: agent/project-status-v2-20260807

jobs:
  rebuild:
    name: Rebuild nine-file status contract on current main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and verify immutable source head
        run: |
          set -euo pipefail
          git fetch origin \
            "${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PRODUCT_BRANCH}")" \
            = "${EXPECTED_HEAD}"

      - name: Rebuild the exact product scope
        run: |
          set -euo pipefail
          base_head="$(git rev-parse origin/main)"
          git checkout -B pr210-rebuilt "${base_head}"
          git checkout "${EXPECTED_HEAD}" -- \
            ci/project_status_v2.json \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            docs/current_project_status.md \
            docs/project_status_contract.md \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          test "$(git rev-parse ":ci/project_status_v2.json")" \
            = "f8f813b0f694d1767d0e8e45b80a4ee33f24cbf1"
          test "$(git rev-parse ":ci/render_project_status.py")" \
            = "7f61867687338af386317986bb932bc170cf820b"
          test "$(git rev-parse ":ci/three_repository_golden_path.py")" \
            = "68289a1d02b1eb6b7576c25110ad7aac5bd952b1"
          test "$(git rev-parse ":ci/three_repository_status.py")" \
            = "3220734c244c47230c3c9e3c7cd20cf05bd741c7"
          test "$(git rev-parse ":docs/current_project_status.md")" \
            = "b971ae2003b99b14d6fac0dbd1a7a4cde6f73185"
          test "$(git rev-parse ":docs/project_status_contract.md")" \
            = "e4d350f49608541086afc2763749990ef9287ce3"
          test "$(git rev-parse ":tests/test_project_status_rendering.py")" \
            = "c8e9a873984e35e35827c01983c946a512e50a50"
          test "$(git rev-parse ":tests/test_sdist_reproducibility.py")" \
            = "c7f84cd678da12fb88e5c8bbc7bc5064beba52ba"
          test "$(git rev-parse ":tests/test_three_repository_project_status.py")" \
            = "64581963a54edca7320aa25e07104e4158b59d48"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format and validate the status contract
        run: |
          python -m ruff format \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          python -m ruff check .
          python -m ruff format --check \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          python -m mypy --python-version 3.12 \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f \
              ci/render_project_status.py \
              ci/three_repository_golden_path.py \
              ci/three_repository_status.py \
              tests/test_project_status_rendering.py \
              tests/test_sdist_reproducibility.py \
              tests/test_three_repository_project_status.py
          PYTHONPATH="$PWD/ci" python ci/render_project_status.py --check
          PYTHONPATH="$PWD/src:$PWD/ci" python -m pytest -q \
            tests/test_three_repository_project_status.py \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py
          git diff --check origin/main...HEAD

      - name: Commit and publish rebuilt branch with lease
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ci/project_status_v2.json \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            docs/current_project_status.md \
            docs/project_status_contract.md \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          git commit -m "Add versioned project-status v2 evidence boundary"
          git push --force-with-lease=refs/heads/${PRODUCT_BRANCH}:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/${PRODUCT_BRANCH}

      - name: Remove this temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f \
            cleanup/.github/workflows/rebuild-pr210-project-status-v2.yml; then
            git -C cleanup rm \
              .github/workflows/rebuild-pr210-project-status-v2.yml
            git -C cleanup commit -m \
              "Remove temporary PR 210 rebuild workflow"
            git -C cleanup push origin HEAD:main
          fi
