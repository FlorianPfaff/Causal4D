name: Temporary Deform360 prefix-kinematics evidence

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-deform360-prefix-kinematics-evidence.yml"
      - "configs/causal4d_public/deform360_prefix_kinematics_v1.json"
      - "scripts/remote/find_deform360_replication_root.py"
      - "scripts/remote/run_deform360_prefix_kinematics.py"
      - "scripts/remote/run_deform360_prefix_kinematics_workflow.sh"
      - "src/causal4d_public/deform360_prefix_kinematics.py"
      - "src/causal4d_public/deform360_prefix_kinematics_diagnostic.py"

permissions:
  contents: read

concurrency:
  group: temporary-deform360-prefix-kinematics-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 360
    steps:
      - name: Require BayesianPhysTwin read access
        env:
          BPT_READ_SSH_KEY: ${{ secrets.BPT_READ_SSH_KEY }}
        run: test -n "${BPT_READ_SSH_KEY}"

      - name: Check out exact Causal4D pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read locked repository pins
        id: repository-pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "configs/causal4d_public/deform360_replication_v1.json"
              ).read_text(encoding="utf-8")
          )["config"]
          pins = {
              "bpt_sha": subprocess.check_output(
                  [sys.executable, "scripts/ci/read_bpt_pin.py"],
                  text=True,
              ).strip(),
              "deform360_sha": protocol["deform360_code_commit"],
              "official_phystwin_sha": protocol["official_phystwin_commit"],
          }
          for name, value in pins.items():
              if type(value) is not str or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{name} is not a lowercase 40-hex commit")
              print(f"{name}={value}")
          PY

      - name: Check out pinned BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.repository-pins.outputs.bpt_sha }}
          ssh-key: ${{ secrets.BPT_READ_SSH_KEY }}
          path: _bpt
          persist-credentials: false
          clean: true

      - name: Check out pinned Deform360 code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ steps.repository-pins.outputs.deform360_sha }}
          path: _deform360
          persist-credentials: false
          clean: true

      - name: Check out pinned official PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jianghanxiao/PhysTwin
          ref: ${{ steps.repository-pins.outputs.official_phystwin_sha }}
          path: _official_phystwin
          persist-credentials: false
          clean: true

      - name: Run locked source-only diagnostic
        shell: bash
        run: |
          set -o pipefail
          mkdir -p deform360-prefix-kinematics
          bash scripts/remote/run_deform360_prefix_kinematics_workflow.sh \
            "$PWD" \
            "$PWD/_bpt" \
            "$PWD/_deform360" \
            "$PWD/_official_phystwin" \
            "$PWD/deform360-prefix-kinematics" \
            2>&1 | tee deform360-prefix-kinematics/run.log

      - name: Upload exact source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-prefix-kinematics-evidence-${{ github.event.pull_request.head.sha }}
          path: deform360-prefix-kinematics/
          if-no-files-found: error
          retention-days: 30
