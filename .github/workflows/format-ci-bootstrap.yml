name: Format CI changes

on:
  push:
    branches: [agent/ci-dependency-boundaries]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/ci-dependency-boundaries
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.15.22,<0.17"
      - name: Format changed Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.py'
          )
          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files require formatting."
            exit 0
          fi
          python -m ruff format "${files[@]}"
          git diff --check
          if git diff --quiet -- "${files[@]}"; then
            echo "Changed Python files were already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "Format CI changes"
          git push origin HEAD:agent/ci-dependency-boundaries
