name: Temporary format three-repository scripts

on:
  push:
    branches:
      - agent/three-repository-installed-wheel-golden-path

permissions:
  contents: write

concurrency:
  group: temporary-format-three-repository
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.15.22,<0.17"
      - name: Apply canonical formatting
        run: python -m ruff format ci/three_repository_*.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- ci/three_repository_*.py; then
            echo "No formatter changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/three_repository_*.py
          git commit -m "Format three-repository compatibility scripts"
          git push origin HEAD:${GITHUB_REF_NAME}
