# Retrigger after current-main CI restoration.
name: Branch advance BPT three-repository pin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/_branch_advance_bpt_three_repository_pin.yml"
      - "scripts/ci/apply_bpt_three_repository_pin_advance.py"
      - "requirements/ci/bayesian-phystwin-three-repository.sha"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-advance-bpt-three-repository-pin-pr-236
  cancel-in-progress: false

jobs:
  synchronize-and-validate:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 236 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'chore/advance-bpt-three-repository-pin' &&
      github.event.pull_request.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply exact reviewed pin synchronization
        run: python scripts/ci/apply_bpt_three_repository_pin_advance.py

      - name: Install policy-test environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate synchronized workflow policy
        run: |
          python -m pytest -q \
            tests/test_three_repository_workflow_policy.py \
            tests/test_stack_lock.py
          python - <<'PY'
          from pathlib import Path

          revision = "4832d92699129b70ffa902ee5ced07bc7200de78"
          pin = Path(
              "requirements/ci/bayesian-phystwin-three-repository.sha"
          ).read_text(encoding="utf-8").strip()
          workflow = Path(
              ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
          ).read_text(encoding="utf-8")
          if pin != revision or workflow.count(f"ref: {revision}") != 1:
              raise SystemExit("pin and workflow literal are not synchronized")
          PY

      - name: Remove branch transport and verify final scope
        run: |
          rm -- \
            .github/workflows/_branch_advance_bpt_three_repository_pin.yml \
            scripts/ci/apply_bpt_three_repository_pin_advance.py
          git diff --check
          allowed='^(.github/workflows/bayesian-phystwin-provider-compatibility.yml|requirements/ci/bayesian-phystwin-three-repository.sha)$'
          unexpected="$(git diff --name-only 2c2ef42620adb5c77b14104b390beddf69118efa -- | grep -Ev "${allowed}" || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected final paths:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Stage validated ordinary source artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="${RUNNER_TEMP}/bpt-pin-final"
          mkdir -p \
            "${artifact}/.github/workflows" \
            "${artifact}/requirements/ci"
          cp .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            "${artifact}/.github/workflows/bayesian-phystwin-provider-compatibility.yml"
          cp requirements/ci/bayesian-phystwin-three-repository.sha \
            "${artifact}/requirements/ci/bayesian-phystwin-three-repository.sha"
          (
            cd "${artifact}"
            sha256sum \
              .github/workflows/bayesian-phystwin-provider-compatibility.yml \
              requirements/ci/bayesian-phystwin-three-repository.sha \
              > SHA256SUMS
          )
          printf 'source_head=%s\n' "${GITHUB_SHA}" > "${artifact}/SOURCE"

      - name: Upload validated ordinary source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: bpt-pin-final-source
          path: ${{ runner.temp }}/bpt-pin-final
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
