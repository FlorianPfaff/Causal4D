name: Publish code-scanning remediations

on:
  push:
    branches: [agent/fix-code-scanning-alerts]

permissions:
  contents: write

concurrency:
  group: publish-code-scanning-remediations
  cancel-in-progress: false

jobs:
  publish:
    name: Apply validated security patch
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.actor == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact publisher revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/code-scanning-patch/part-*.b64 \
            | base64 --decode \
            > "$RUNNER_TEMP/code-scanning-fixes.patch"
          printf '%s  %s\n' \
            '96ef01b65c3bc4d09b975f72e2f54150f63150fee9b023a91d4b1c4c434b143a' \
            "$RUNNER_TEMP/code-scanning-fixes.patch" \
            | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/code-scanning-fixes.patch"
          git apply "$RUNNER_TEMP/code-scanning-fixes.patch"
          rm -rf \
            .github/code-scanning-patch \
            .github/workflows/export-code-scanning-alerts.yml
          git diff --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate focused remediations
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -W error::SyntaxWarning -m compileall -q -f \
            src tests scripts
          PYTHONPATH=src python -m pytest -q \
            tests/test_acquisition_journal_locking.py \
            tests/test_merge_gate_workflow_policy.py \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py \
            tests/test_quality_failure_diagnostics_workflow_policy.py \
            tests/test_security_scanning_workflow_policy.py \
            tests/test_github_action_pins.py

      - name: Commit and publish the remediations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'The security patch produced no changes.' >&2
            exit 1
          }
          git commit -m 'Fix code-scanning trust boundaries'
          git push origin HEAD:agent/fix-code-scanning-alerts
