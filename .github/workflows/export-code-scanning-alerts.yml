name: Publish code-scanning remediations

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: publish-code-scanning-remediations
  cancel-in-progress: false

jobs:
  publish:
    name: Apply validated security patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-code-scanning-alerts' &&
      github.actor == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact publisher revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/code-scanning-patch/part-*.b64 \
            | base64 --decode \
            > "$RUNNER_TEMP/code-scanning-fixes.patch"
          printf '%s  %s\n' \
            '96ef01b65c3bc4d09b975f72e2f54150f63150fee9b023a91d4b1c4c434b143a' \
            "$RUNNER_TEMP/code-scanning-fixes.patch" \
            | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/code-scanning-fixes.patch"
          git apply "$RUNNER_TEMP/code-scanning-fixes.patch"
          rm -rf \
            .github/code-scanning-patch \
            .github/workflows/export-code-scanning-alerts.yml
          git diff --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate focused remediations
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -W error::SyntaxWarning -m compileall -q -f \
            src tests scripts
          python - <<'PY'
          from pathlib import Path

          journal = Path("src/causal4d/acquisition_journal_io.py").read_text()
          assert "os.open(path, flags, 0o600)" in journal
          assert "os.fchmod(descriptor, 0o600)" in journal

          ci = Path(".github/workflows/ci.yml").read_text()
          merge_gate = Path(".github/workflows/merge-gate.yml").read_text()
          compatibility = Path(
              ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
          ).read_text()
          pin = Path(
              "requirements/ci/bayesian-phystwin-provider-v1.sha"
          ).read_text().strip()
          assert f"ref: {pin}" in ci
          assert f"ref: {pin}" in merge_gate
          assert "steps.pin.outputs.sha" not in ci + merge_gate
          assert compatibility.count("ref: main") == 2
          assert "inputs.bpt_ref" not in compatibility
          assert "inputs.prob4d_ref" not in compatibility
          assert not Path(
              ".github/workflows/quality-failure-diagnostics.yml"
          ).exists()
          assert Path(
              "tests/test_quality_failure_diagnostics_workflow_policy.py"
          ).is_file()
          PY

      - name: Commit and publish the remediations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo 'The security patch produced no changes.' >&2
            exit 1
          }
          git commit -m 'Fix code-scanning trust boundaries'
          git push origin HEAD:agent/fix-code-scanning-alerts
