name: Export code-scanning alerts

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: read

concurrency:
  group: export-code-scanning-alerts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    name: Export open alerts and repository snapshot
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and sanitize open CodeQL alerts
        shell: bash
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          api_url = os.environ["GH_API_URL"].rstrip("/")
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          query = urllib.parse.urlencode(
              {"state": "open", "per_page": 100, "page": 1}
          )
          url = f"{api_url}/repos/{repository}/code-scanning/alerts?{query}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "causal4d-code-scanning-export",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              alerts = json.load(response)

          sanitized = []
          for alert in alerts:
              rule = alert.get("rule") or {}
              tool = alert.get("tool") or {}
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              sanitized.append(
                  {
                      "number": alert.get("number"),
                      "created_at": alert.get("created_at"),
                      "updated_at": alert.get("updated_at"),
                      "state": alert.get("state"),
                      "rule": {
                          "id": rule.get("id"),
                          "name": rule.get("name"),
                          "severity": rule.get("severity"),
                          "security_severity_level": rule.get(
                              "security_severity_level"
                          ),
                          "description": rule.get("description"),
                      },
                      "tool": {"name": tool.get("name")},
                      "instance": {
                          "ref": instance.get("ref"),
                          "commit_sha": instance.get("commit_sha"),
                          "path": location.get("path"),
                          "start_line": location.get("start_line"),
                          "end_line": location.get("end_line"),
                          "message": (instance.get("message") or {}).get("text"),
                      },
                  }
              )

          with open("code-scanning-alerts.json", "w", encoding="utf-8") as stream:
              json.dump(sanitized, stream, indent=2, sort_keys=True)
              stream.write("\n")

          print(json.dumps(sanitized, indent=2, sort_keys=True))
          print(f"OPEN_ALERT_COUNT={len(sanitized)}")
          PY

      - name: Check out the pull-request merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: repository
          persist-credentials: false

      - name: Package repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -C repository -czf repository-snapshot.tar.gz .

      - name: Upload temporary diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-scanning-diagnostics-${{ github.sha }}
          path: |
            code-scanning-alerts.json
            repository-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
