name: Stage validated code-scanning remediations

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: stage-code-scanning-remediations
  cancel-in-progress: false

jobs:
  stage:
    name: Stage validated repair and workflow blobs
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-code-scanning-alerts' &&
      github.actor == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/code-scanning-patch/part-*.b64 \
            | base64 --decode \
            > "$RUNNER_TEMP/code-scanning-fixes.patch"
          printf '%s  %s\n' \
            '96ef01b65c3bc4d09b975f72e2f54150f63150fee9b023a91d4b1c4c434b143a' \
            "$RUNNER_TEMP/code-scanning-fixes.patch" \
            | sha256sum --check --strict -
          git apply --check "$RUNNER_TEMP/code-scanning-fixes.patch"
          git apply "$RUNNER_TEMP/code-scanning-fixes.patch"
          rm -rf \
            .github/code-scanning-patch \
            .github/workflows/export-code-scanning-alerts.yml
          git diff --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate focused remediations
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -W error::SyntaxWarning -m compileall -q -f \
            src tests scripts
          PYTHONPATH=src python -m pytest -q \
            tests/test_acquisition_journal_locking.py \
            tests/test_merge_gate_workflow_policy.py \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py

      - name: Stage exact workflow blobs outside the workflow namespace
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/code-scanning-final
          mkdir -p "$payload"
          cp .github/workflows/ci.yml "$payload/ci.yml"
          cp .github/workflows/merge-gate.yml "$payload/merge-gate.yml"
          cp \
            .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            "$payload/bayesian-phystwin-provider-compatibility.yml"
          git restore --source=HEAD -- .github/workflows
          test -z "$(git diff --name-only -- .github/workflows)"
          git diff --check
          sha256sum "$payload"/*.yml | sort

      - name: Publish non-workflow repair and exact workflow payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --name-only \
            | grep -q '^.github/workflows/'; then
            echo 'Staging commit unexpectedly modifies workflow paths.' >&2
            exit 1
          fi
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Stage validated code-scanning repair'
          git push origin HEAD:agent/fix-code-scanning-alerts
