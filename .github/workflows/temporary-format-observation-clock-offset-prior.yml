name: Temporary format observation clock-offset prior

on:
  push:
    branches: [agent/source-clock-offset-prior-v1]
    paths:
      - ".github/workflows/temporary-format-observation-clock-offset-prior.yml"

permissions:
  contents: write

concurrency:
  group: temporary-format-observation-clock-offset-prior
  cancel-in-progress: false

jobs:
  format-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/source-clock-offset-prior-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Format and validate exact implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m ruff check \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m ruff format --check \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m mypy src/causal4d/observation_clock_offset_prior.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_observation_clock_offset_prior.py
          python -m py_compile \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py

      - name: Publish only permanent formatted files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-format-observation-clock-offset-prior.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format observation clock-offset prior"
          git push origin HEAD:agent/source-clock-offset-prior-v1
