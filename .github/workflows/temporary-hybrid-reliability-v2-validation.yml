name: Temporary hybrid reliability v2 validation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-hybrid-reliability-v2-validation
  cancel-in-progress: false

env:
  TARGET_SHA: f5bb020afd59a3e335311b091be881c1f7f7ebbf
  TRIGGER_TITLE: "[automation] validate hybrid reliability v2 f5bb020a"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  validate:
    name: Exact-head quality and full tests
    if: >-
      github.event.issue.title ==
      '[automation] validate hybrid reliability v2 f5bb020a' &&
      github.event.issue.user.login == 'FlorianPfaff'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out immutable corrective head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.TARGET_SHA }}
          path: target
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install isolated exact-head environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git -C target status --porcelain=v1)"
          venv="${RUNNER_TEMP}/hybrid-reliability-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m venv "${venv}"
          echo "VALIDATION_VENV=${venv}" >> "${GITHUB_ENV}"
          echo "${venv}/bin" >> "${GITHUB_PATH}"
          "${venv}/bin/python" -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          "${venv}/bin/python" -m pip install -e "./target[dev]"
          "${venv}/bin/python" -m pip check
          mkdir -p evidence
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "target_sha=$(git -C target rev-parse HEAD)"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            "${venv}/bin/python" --version
            "${venv}/bin/python" -m pip freeze --all
          } > evidence/environment.txt

      - name: Run focused quality and complete test suite
        id: validation
        continue-on-error: true
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          files=(
            src/causal4d/hybrid_reliability.py
            src/causal4d/hybrid_reliability_admission.py
            tests/test_hybrid_reliability.py
            tests/test_hybrid_reliability_admission.py
            tests/test_hybrid_reliability_integrity.py
            tests/test_hybrid_reliability_schema_v2.py
          )
          {
            python -m ruff check "${files[@]}"
            python -m ruff format --check "${files[@]}"
            python -m mypy \
              src/causal4d/hybrid_reliability.py \
              src/causal4d/hybrid_reliability_admission.py
            python -m pytest -q -p no:cacheprovider \
              tests/test_hybrid_reliability.py \
              tests/test_hybrid_reliability_admission.py \
              tests/test_hybrid_reliability_integrity.py \
              tests/test_hybrid_reliability_schema_v2.py
            python -m pytest -q -p no:cacheprovider
            python -m py_compile "${files[@]}"
          } 2>&1 | tee ../evidence/validation.log
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Write machine-readable result
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("evidence")
          log_path = root / "validation.log"
          environment_path = root / "environment.txt"
          value = {
              "schema_version": 1,
              "artifact_kind": "Causal4DHybridReliabilityV2Validation",
              "status": (
                  "passed"
                  if os.environ["VALIDATION_OUTCOME"] == "success"
                  else "failed"
              ),
              "validation_outcome": os.environ["VALIDATION_OUTCOME"],
              "target_sha": os.environ["TARGET_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "completed_at_utc": datetime.now(timezone.utc).isoformat(),
              "validation_log_sha256": (
                  hashlib.sha256(log_path.read_bytes()).hexdigest()
                  if log_path.is_file()
                  else None
              ),
              "environment_sha256": (
                  hashlib.sha256(environment_path.read_bytes()).hexdigest()
                  if environment_path.is_file()
                  else None
              ),
              "claim_boundary": (
                  "Software validation only; no controlled or physical result is "
                  "changed by this harness."
              ),
          }
          (root / "result.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hybrid-reliability-v2-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish result to trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > evidence/comment.md
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("evidence/result.json").read_text(encoding="utf-8"))
          print("## Exact-head validation result")
          print()
          print(f"- Status: **{result['status']}**")
          print(f"- Target SHA: `{result['target_sha']}`")
          print(f"- Workflow run: `{result['workflow_run_id']}` attempt `{result['workflow_run_attempt']}`")
          print(f"- Validation log SHA-256: `{result['validation_log_sha256']}`")
          print(f"- Environment SHA-256: `{result['environment_sha256']}`")
          print()
          print(result["claim_boundary"])
          PY
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file evidence/comment.md

      - name: Remove temporary workflow from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C cleanup rm \
            .github/workflows/temporary-hybrid-reliability-v2-validation.yml
          git -C cleanup commit -m \
            "Remove temporary hybrid reliability validation workflow"
          git -C cleanup push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Enforce validation success
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        shell: bash
        run: test "${VALIDATION_OUTCOME}" = "success"

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf "${VALIDATION_VENV:-}" || true
