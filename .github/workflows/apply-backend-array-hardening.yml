name: Apply backend array hardening

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/apply-backend-array-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply contract hardening and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend_path = Path("src/causal4d/phystwin_backend.py")
          text = backend_path.read_text(encoding="utf-8")

          helper_anchor = '''def _load_pickle(path: str | Path) -> Any:
              with Path(path).open("rb") as handle:
                  return pickle.load(handle)


          def _graph_replay_descriptor'''.replace("          ", "")
          helper_replacement = '''def _load_pickle(path: str | Path) -> Any:
              with Path(path).open("rb") as handle:
                  return pickle.load(handle)


          def _readonly_array(
              values: np.ndarray,
              *,
              dtype: Any = float,
          ) -> np.ndarray:
              """Return an independent immutable NumPy array."""

              array = np.asarray(values, dtype=dtype).copy()
              array.setflags(write=False)
              return array


          def _graph_replay_descriptor'''.replace("          ", "")
          if text.count(helper_anchor) != 1:
              raise RuntimeError("unexpected backend helper anchor")
          text = text.replace(helper_anchor, helper_replacement, 1)

          replacements = {
              "particles = np.asarray(self.log_scales, dtype=float)": (
                  "particles = _readonly_array(self.log_scales, dtype=float)"
              ),
              "weights = np.asarray(self.weights, dtype=float)": (
                  "weights = _readonly_array(self.weights, dtype=float)"
              ),
              "indices = np.asarray(self.grid_indices, dtype=int)": (
                  "indices = _readonly_array(self.grid_indices, dtype=int)"
              ),
              "controls = np.asarray(self.controller_points_m, dtype=float)": (
                  "controls = _readonly_array(self.controller_points_m, dtype=float)"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise RuntimeError(f"unexpected replacement count for {old!r}")
              text = text.replace(old, new, 1)
          backend_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_causal4d_phystwin_backend_immutability.py")
          if test_path.exists():
              raise RuntimeError(f"refusing to overwrite {test_path}")
          test_path.write_text(
              '''from __future__ import annotations

          import numpy as np
          import pytest

          pytest.importorskip(
              "bayesian_phystwin",
              reason="provider-backed backend tests require Bayesian-PhysTwin",
          )

          from causal4d.phystwin_backend import (
              BayesianPhysTwinParticles,
              PhysTwinActionProposal,
          )


          def _assert_read_only(array: np.ndarray) -> None:
              assert not array.flags.writeable
              with pytest.raises(ValueError):
                  array.flat[0] = 0


          def test_bayesian_phystwin_particles_own_read_only_arrays() -> None:
              log_scales = np.asarray([[0.0, 0.1], [0.2, -0.1]], dtype=float)
              weights = np.asarray([0.6, 0.4], dtype=float)
              grid_indices = np.asarray([[0, 0], [1, 0]], dtype=int)
              expected_log_scales = log_scales.copy()
              expected_weights = weights.copy()
              expected_grid_indices = grid_indices.copy()

              particles = BayesianPhysTwinParticles(
                  log_scales=log_scales,
                  weights=weights,
                  grid_indices=grid_indices,
                  source_weight_key="posterior_weights",
                  retained_probability_mass=1.0,
              )

              log_scales[:] = 99.0
              weights[:] = 0.5
              grid_indices[:] = 99

              np.testing.assert_array_equal(particles.log_scales, expected_log_scales)
              np.testing.assert_array_equal(particles.weights, expected_weights)
              np.testing.assert_array_equal(particles.grid_indices, expected_grid_indices)
              _assert_read_only(particles.log_scales)
              _assert_read_only(particles.weights)
              _assert_read_only(particles.grid_indices)


          def test_phystwin_action_proposal_owns_read_only_controller_points() -> None:
              controller_points = np.arange(24, dtype=float).reshape(4, 2, 3)
              expected = controller_points.copy()
              proposal = PhysTwinActionProposal(
                  proposal_id="unit",
                  controller_points_m=controller_points,
                  prior_weight=1.0,
                  future_action_observed=False,
                  provenance="unit test",
              )

              controller_points[:] = -1.0

              np.testing.assert_array_equal(proposal.controller_points_m, expected)
              _assert_read_only(proposal.controller_points_m)
          '''.replace("          ", ""),
              encoding="utf-8",
          )
          PY

      - name: Validate generated source
        shell: bash
        run: |
          python -m compileall -q \
            src/causal4d/phystwin_backend.py \
            tests/test_causal4d_phystwin_backend_immutability.py
          git diff --check

      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/phystwin_backend.py \
            tests/test_causal4d_phystwin_backend_immutability.py
          git rm .github/workflows/apply-backend-array-hardening.yml
          git commit -m "Harden frozen PhysTwin backend arrays"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
