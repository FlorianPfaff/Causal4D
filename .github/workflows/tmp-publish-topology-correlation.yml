name: Publish clean topology-correlation implementation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-publish-topology-correlation.yml"

permissions:
  contents: write

concurrency:
  group: publish-clean-topology-correlation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 180
    steps:
      - name: Check out the writable PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "${GITHUB_ENV}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Install development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Materialize the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/topology-correlation-publication
          sha256sum .github/payloads/topology-correlation-final/part-* \
            | tee outputs/topology-correlation-publication/chunk-sha256.txt
          cat .github/payloads/topology-correlation-final/part-* \
            > /tmp/topology-final.b64
          base64 --decode /tmp/topology-final.b64 \
            > /tmp/topology-final.tar.gz
          cp /tmp/topology-final.b64 \
            outputs/topology-correlation-publication/assembled.b64
          cp /tmp/topology-final.tar.gz \
            outputs/topology-correlation-publication/assembled.tar.gz
          sha256sum /tmp/topology-final.b64 /tmp/topology-final.tar.gz \
            | tee outputs/topology-correlation-publication/assembled-sha256.txt
          tar -tzf /tmp/topology-final.tar.gz \
            | tee outputs/topology-correlation-publication/archive-listing.txt
          echo "b910458cd3537efca0de07767a70464bbb2d31f9861ff57ba545d059505c905b  /tmp/topology-final.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/topology-final.tar.gz

      - name: Format and validate the exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/causal4d/topology_conditioned_correlation_diagnostic.py \
            scripts/ci/run_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_workflow_policy.py
          python -m ruff check \
            src/causal4d/topology_conditioned_correlation_diagnostic.py \
            scripts/ci/run_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_workflow_policy.py
          python -m pytest -q \
            tests/test_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_workflow_policy.py \
            tests/test_contact_correlation_diagnostic.py \
            tests/test_causal4d_contact_evaluation.py \
            tests/test_probability_support_invariants.py \
            | tee outputs/topology-correlation-publication/tests.txt
          git diff --check
          tar -czf /tmp/topology-formatted-source.tar.gz \
            docs/topology_conditioned_contact_likelihood.md \
            scripts/ci/run_topology_conditioned_correlation_diagnostic.py \
            src/causal4d/topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_workflow_policy.py
          sha256sum /tmp/topology-formatted-source.tar.gz \
            > outputs/topology-correlation-publication/formatted-source.sha256

      - name: Publish one clean source-only commit
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          tar -xzf /tmp/topology-formatted-source.tar.gz
          git add \
            docs/topology_conditioned_contact_likelihood.md \
            scripts/ci/run_topology_conditioned_correlation_diagnostic.py \
            src/causal4d/topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_diagnostic.py \
            tests/test_topology_conditioned_correlation_workflow_policy.py
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Refusing to publish a workflow file through the Actions token." >&2
            exit 1
          fi
          git commit -m \
            "Add topology-conditioned prefix correlation diagnostic"
          git push --force origin "HEAD:${HEAD_BRANCH}"
          git rev-parse HEAD \
            | tee outputs/topology-correlation-publication/commit.txt

      - name: Upload publication validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: topology-correlation-publication-${{ github.run_id }}
          path: outputs/topology-correlation-publication/
          if-no-files-found: warn
          retention-days: 7
