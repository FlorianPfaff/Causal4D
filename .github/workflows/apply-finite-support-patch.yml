name: Apply finite-support source patch

on:
  push:
    branches:
      - agent/preserve-finite-support-invariants
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
      - name: Decode, verify, and apply reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path
          import zlib

          encoded = Path('.github/agent-support.patch.z.b64').read_text().strip()
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          expected = '8878f4570b67ebefc6c063797987b86766ad5ba473d88e4bf153738a2a4d6533'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch digest mismatch: {actual} != {expected}')
          Path('/tmp/causal4d-support.patch').write_bytes(patch)
          PY
          git apply --check /tmp/causal4d-support.patch
          git apply --index /tmp/causal4d-support.patch
          git rm .github/agent-support.patch.z.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve exact support across inference paths'
          git push origin "HEAD:${HEAD_BRANCH}"
