name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Ruff, formatting, and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check .
      - name: Select changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/ci/changed_python_files.py \
            --base "${BASE_SHA:-}" --head "${GITHUB_SHA}" > changed-python.txt
          cat changed-python.txt
      - name: Check formatting incrementally
        run: |
          mapfile -t files < changed-python.txt
          if (( ${#files[@]} )); then
            python -m ruff format --check "${files[@]}"
          else
            echo "No changed Python files require a formatting check."
          fi
      - name: Type-check stable contracts and CI utilities
        run: |
          python -m mypy \
            scripts/ci \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py

  core:
    name: Core-only / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development dependencies only
        run: python -m pip install -e ".[dev]"
      - name: Assert optional runtimes are absent
        run: |
          python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into core job: {present}")
          PY
      - name: Run core-compatible default suite
        run: |
          python -m pytest \
            --junitxml="pytest-core-${{ matrix.python-version }}.xml"
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-core-${{ matrix.python-version }}
          path: pytest-core-${{ matrix.python-version }}.xml

  pinned-bpt:
    name: Pinned Bayesian-PhysTwin integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Detect private-repository credential
        id: access
        env:
          BPT_READ_TOKEN: ${{ secrets.BPT_READ_TOKEN }}
        run: |
          if [[ -n "${BPT_READ_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BPT_READ_TOKEN is not configured; pinned private-repository integration was not exercised."
            echo "### Pinned Bayesian-PhysTwin integration" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped because the repository secret \`BPT_READ_TOKEN\` is absent." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read exact Bayesian-PhysTwin pin
        if: steps.access.outputs.enabled == 'true'
        id: pin
        run: echo "sha=$(python scripts/ci/read_bpt_pin.py)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Bayesian-PhysTwin
        if: steps.access.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          repository: FlorianPfaff/Bayesian-PhysTwin
          ref: ${{ steps.pin.outputs.sha }}
          token: ${{ secrets.BPT_READ_TOKEN }}
          path: _bpt
      - name: Install Causal4D and pinned provider
        if: steps.access.outputs.enabled == 'true'
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e ./_bpt
          python -m pip check
      - name: Run pinned-provider integration tests
        if: steps.access.outputs.enabled == 'true'
        run: python scripts/ci/run_bpt_integration_tests.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/

  installed-artifact:
    name: Installed ${{ matrix.kind }} and all CLI help
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Install isolated ${{ matrix.kind }}
        shell: bash
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          artifact-venv/bin/python -m pip install "$artifact"
          artifact-venv/bin/python -m pip check
      - name: Assert base installation has no optional providers
        run: |
          artifact-venv/bin/python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into base artifact: {present}")
          PY
      - name: Verify every installed command renders help
        run: |
          PATH="$PWD/artifact-venv/bin:$PATH" \
            artifact-venv/bin/python scripts/ci/check_console_help.py \
              --pyproject pyproject.toml

  bundles:
    name: Produce, archive, and consume result bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base package
        run: python -m pip install -e .
      - name: Produce deterministic smoke bundles
        run: |
          causal4d-counterfactual-benchmark \
            --output-dir build/bundles/counterfactual \
            --seeds 0 \
            --frames 18 \
            --training-repeats 1 \
            --parameter-grid-count 3
          causal4d-latent-contact-benchmark \
            --output-dir build/bundles/latent-contact \
            --seeds 0 \
            --frames 18 \
            --training-repeats 1 \
            --parameter-grid-count 3 \
            --contact-parameter-particles 4
      - name: Verify produced bundles
        run: |
          python scripts/ci/verify_result_bundle.py \
            build/bundles/counterfactual/manifest.json
          python scripts/ci/verify_result_bundle.py \
            build/bundles/latent-contact/manifest.json
      - name: Archive and consume bundles in a clean location
        run: |
          mkdir -p build/archives build/consumed
          tar -C build/bundles -czf build/archives/counterfactual.tar.gz counterfactual
          tar -C build/bundles -czf build/archives/latent-contact.tar.gz latent-contact
          tar -C build/consumed -xzf build/archives/counterfactual.tar.gz
          tar -C build/consumed -xzf build/archives/latent-contact.tar.gz
          python scripts/ci/verify_result_bundle.py \
            build/consumed/counterfactual/manifest.json
          python scripts/ci/verify_result_bundle.py \
            build/consumed/latent-contact/manifest.json
      - name: Upload smoke bundles
        uses: actions/upload-artifact@v7
        with:
          name: result-bundle-smoke
          path: build/archives/*.tar.gz

  frozen-manifest:
    name: Frozen milestone manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate frozen inventory and checked-in checksums
        run: |
          python scripts/ci/verify_frozen_manifest.py \
            milestones/v0.3.0-causal4d-aip

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, core, pinned-bpt, build, installed-artifact, bundles, frozen-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
