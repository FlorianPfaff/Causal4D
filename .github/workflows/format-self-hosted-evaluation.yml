name: Format self-hosted evaluation harness

on:
  push:
    branches:
      - agent/self-hosted-evaluation
    paths:
      - ".github/workflows/format-self-hosted-evaluation.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/self-hosted-evaluation
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format and commit
        shell: bash
        run: |
          python -m pip install "ruff==0.16.1"
          python -m ruff format scripts/ci/run_self_hosted_evaluation.py
          if git diff --quiet; then
            echo "Evaluation harness is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/run_self_hosted_evaluation.py
          git commit -m "Format self-hosted evaluation harness"
          git push origin HEAD:agent/self-hosted-evaluation
