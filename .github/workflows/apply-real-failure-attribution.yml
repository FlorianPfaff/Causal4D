name: Apply staged real failure-attribution patch

on:
  push:
    branches: [agent/aggregate-real-failure-attribution]
    paths:
      - ".patches/real_failure_attribution.tar.gz.b64"
      - ".github/workflows/apply-real-failure-attribution.yml"
  pull_request:
    branches: [main]
    paths:
      - ".patches/real_failure_attribution.tar.gz.b64"
      - ".github/workflows/apply-real-failure-attribution.yml"

permissions:
  contents: write

concurrency:
  group: apply-real-failure-attribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize reviewed patch
        run: |
          base64 --decode \
            .patches/real_failure_attribution.tar.gz.b64 \
            > "$RUNNER_TEMP/real_failure_attribution.tar.gz"
          echo "14b1dab240c93d56c2b82dabca44034d1feacb02062f093b9c9f38f44369d59f  $RUNNER_TEMP/real_failure_attribution.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/real_failure_attribution.tar.gz" -C .
          rm -f .patches/real_failure_attribution.tar.gz.b64
          rmdir .patches
          rm -f .github/workflows/apply-real-failure-attribution.yml

      - name: Validate focused implementation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          python -m ruff check \
            src/causal4d/real_failure_attribution.py \
            src/causal4d/cli/real_failure_attribution.py \
            src/causal4d/cli/command_registry.py \
            tests/test_real_failure_attribution.py
          python -m ruff format --check \
            src/causal4d/real_failure_attribution.py \
            src/causal4d/cli/real_failure_attribution.py \
            src/causal4d/cli/command_registry.py \
            tests/test_real_failure_attribution.py
          python -m mypy src/causal4d/real_failure_attribution.py
          python -m pytest -q tests/test_real_failure_attribution.py
          causal4d diagnostic real-failure-attribution --help
          causal4d-aggregate-real-failure-attribution --help

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add execution-accounted failure attribution"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
