name: Materialize and validate real failure attribution

on:
  pull_request:
    branches: [main]
    paths:
      - ".patches/parts/**"
      - ".github/workflows/apply-real-failure-attribution.yml"

permissions:
  contents: write

concurrency:
  group: materialize-real-failure-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct reviewed source archive
        run: |
          cat .patches/parts/* > "$RUNNER_TEMP/real_failure_attribution.tar.gz.b64"
          base64 --decode \
            "$RUNNER_TEMP/real_failure_attribution.tar.gz.b64" \
            > "$RUNNER_TEMP/real_failure_attribution.tar.gz"
          echo "dc984f393a0524505d1c7ff100409bbb32e08aefbb188ff01b57319ea311e3ac  $RUNNER_TEMP/real_failure_attribution.tar.gz" \
            | sha256sum --check
          tar -tzf "$RUNNER_TEMP/real_failure_attribution.tar.gz"
          tar -xzf "$RUNNER_TEMP/real_failure_attribution.tar.gz" -C .
          rm -rf .patches
          rm -f .github/workflows/apply-real-failure-attribution.yml

      - name: Validate focused implementation
        run: |
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests
          python -m ruff format \
            src/causal4d/real_failure_attribution.py \
            src/causal4d/cli/real_failure_attribution.py \
            src/causal4d/cli/command_registry.py \
            tests/test_real_failure_attribution.py
          python -m ruff check \
            src/causal4d/real_failure_attribution.py \
            src/causal4d/cli/real_failure_attribution.py \
            src/causal4d/cli/command_registry.py \
            tests/test_real_failure_attribution.py
          python -m ruff format --check \
            src/causal4d/real_failure_attribution.py \
            src/causal4d/cli/real_failure_attribution.py \
            src/causal4d/cli/command_registry.py \
            tests/test_real_failure_attribution.py
          python -m mypy src/causal4d/real_failure_attribution.py
          python -m pytest -q tests/test_real_failure_attribution.py
          causal4d diagnostic real-failure-attribution --help
          causal4d-aggregate-real-failure-attribution --help
          git diff --check

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add execution-accounted failure attribution"
          git push origin HEAD:${{ github.head_ref }}
