      - name: Check changed code
        run: |
          python -m ruff check \
            src/causal4d/hierarchical_abduction.py \
            src/causal4d/sensor_factorized_abduction.py \
            tests/test_causal4d_hierarchical_abduction.py \
            tests/test_causal4d_sensor_factorized_abduction.py
          python -m ruff format --check \
            src/causal4d/hierarchical_abduction.py \
            src/causal4d/sensor_factorized_abduction.py \
            tests/test_causal4d_hierarchical_abduction.py \
            tests/test_causal4d_sensor_factorized_abduction.py
          python -m pytest -q \
            tests/test_exact_zero_support.py \
            tests/test_causal4d_hierarchical_abduction.py \
            tests/test_causal4d_sensor_factorized_abduction.py

      - name: Publish patch and remove staging workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-apply-abduction-support.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve exact support in abduction updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
