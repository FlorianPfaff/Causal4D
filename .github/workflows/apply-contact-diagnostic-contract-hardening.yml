name: Apply contact diagnostic contract hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/reproducibility-contact-diagnostics

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reproducibility-contact-diagnostics
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply fail-closed bundle and row-identity contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"{label} patch anchor count is {text.count(old)}, expected 1"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")


          def replace_region(
              path: Path,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f"{label} start marker is missing")
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f"{label} end marker is missing")
              path.write_text(
                  text[:start] + replacement + text[end:],
                  encoding="utf-8",
              )


          verifier = Path("src/causal4d/result_bundle_verification.py")
          verifier_text = verifier.read_text(encoding="utf-8")
          if verifier_text.count("_read_json_object") != 2:
              raise RuntimeError("strict JSON reader reference count changed")
          verifier.write_text(
              verifier_text.replace(
                  "_read_json_object",
                  "read_strict_json_object",
              ),
              encoding="utf-8",
          )

          diagnostic = Path("src/causal4d/contact_posterior_diagnostics.py")
          replace_once(
              diagnostic,
              "from causal4d.contact_metrics import contact_recovery_metrics\n"
              "from causal4d.simulator import GraphObject\n",
              "from causal4d.contact_metrics import contact_recovery_metrics\n"
              "from causal4d.result_bundle_verification import (\n"
              "    read_strict_json_object,\n"
              "    verify_embedded_result_bundle,\n"
              ")\n"
              "from causal4d.simulator import GraphObject\n",
              "verification import",
          )
          replace_once(
              diagnostic,
              '                        "object": target.protocol.graph_object.name,\n'
              '                        "source_objects": ";".join(source_names),\n',
              '                        "object": target.protocol.graph_object.name,\n'
              '                        "held_out_topology": True,\n'
              '                        "source_objects": ";".join(source_names),\n',
              "recomputed held-out identity",
          )
          replace_region(
              diagnostic,
              "def _row_key(",
              "def _validate_recomputed_parity(",
              dedent(
                  '''\
                  def _row_key(
                      row: Mapping[str, Any],
                  ) -> tuple[int, str, bool, str, str, str, float]:
                      return (
                          int(row["seed"]),
                          str(row["object"]),
                          _as_bool(row["held_out_topology"]),
                          str(row["source_objects"]),
                          str(row["world_condition"]),
                          str(row["setting"]),
                          float(row["observation_fraction"]),
                      )


                  def _unique_row_index(
                      rows: Sequence[Mapping[str, Any]],
                      *,
                      label: str,
                      online_only: bool = False,
                  ) -> dict[
                      tuple[int, str, bool, str, str, str, float],
                      Mapping[str, Any],
                  ]:
                      indexed: dict[
                          tuple[int, str, bool, str, str, str, float],
                          Mapping[str, Any],
                      ] = {}
                      for row in rows:
                          if online_only and str(row["setting"]) != "online_adaptation":
                              continue
                          key = _row_key(row)
                          if key in indexed:
                              raise ValueError(
                                  f"duplicate {label} row identity: {key!r}"
                              )
                          indexed[key] = row
                      return indexed


                  '''
              ),
              "row identity functions",
          )
          replace_once(
              diagnostic,
              "    retained = {\n"
              "        _row_key(row): row\n"
              "        for row in retained_rows\n"
              '        if str(row["setting"]) == "online_adaptation"\n'
              "    }\n"
              "    recomputed = {_row_key(row): row for row in recomputed_rows}\n",
              "    retained = _unique_row_index(\n"
              "        retained_rows,\n"
              '        label="retained posterior",\n'
              "        online_only=True,\n"
              "    )\n"
              "    recomputed = _unique_row_index(\n"
              "        recomputed_rows,\n"
              '        label="recomputed posterior",\n'
              "    )\n",
              "unique parity index",
          )
          replace_region(
              diagnostic,
              "def _trajectory_lookup(",
              "def _action_direction(",
              dedent(
                  '''\
                  def _trajectory_lookup(
                      intervention_rows: Sequence[Mapping[str, Any]],
                  ) -> dict[
                      tuple[int, str, bool, str, str, str, float],
                      dict[str, float],
                  ]:
                      grouped: dict[
                          tuple[int, str, bool, str, str, str, float],
                          dict[str, float],
                      ] = {}
                      for row in intervention_rows:
                          if str(row["setting"]) != "online_adaptation":
                              continue
                          key = _row_key(row)
                          method = str(row["method"])
                          methods = grouped.setdefault(key, {})
                          if method in methods:
                              raise ValueError(
                                  "duplicate intervention method row for "
                                  f"{key!r}/{method!r}"
                              )
                          methods[method] = float(row["trajectory_rmse_m"])
                      return grouped


                  '''
              ),
              "trajectory lookup",
          )
          replace_once(
              diagnostic,
              "    bundle = Path(bundle_directory).resolve()\n"
              '    summary_path = bundle / "summary.json"\n'
              '    manifest_path = bundle / "manifest.json"\n'
              "    if not summary_path.is_file() or not manifest_path.is_file():\n"
              "        raise FileNotFoundError(\n"
              '            "bundle must contain summary.json and manifest.json"\n'
              "        )\n"
              "    summary = json.loads(summary_path.read_text(encoding=\"utf-8\"))\n",
              "    bundle = Path(bundle_directory).resolve()\n"
              "    verification = verify_embedded_result_bundle(bundle)\n"
              '    summary_path = bundle / "summary.json"\n'
              "    summary = read_strict_json_object(summary_path)\n",
              "embedded bundle verification",
          )
          replace_once(
              diagnostic,
              '        "source_bundle": {\n'
              '            "directory": str(bundle),\n'
              '            "manifest_sha256": _sha256(manifest_path),\n'
              '            "benchmark": summary["benchmark"],\n'
              '            "seeds": summary["seeds"],\n'
              "        },\n",
              '        "source_bundle": {\n'
              '            "bundle_name": verification["bundle_name"],\n'
              '            "manifest_sha256": verification["manifest_sha256"],\n'
              '            "artifact_count": verification["artifact_count"],\n'
              '            "artifacts": verification["artifacts"],\n'
              '            "benchmark": summary["benchmark"],\n'
              '            "seeds": summary["seeds"],\n'
              "        },\n",
              "portable source provenance",
          )

          docs = Path("docs/contact_posterior_diagnostics.md")
          docs_text = docs.read_text(encoding="utf-8")
          heading = "## Bundle admission and portable provenance"
          if heading not in docs_text:
              docs_text += dedent(
                  '''\


                  ## Bundle admission and portable provenance

                  The analyzer verifies the embedded result manifest itself before
                  reading scientific payloads. The exact flat file inventory, byte
                  counts, lowercase SHA-256 identities, ordinary-file requirement,
                  and absence of symlinks or undeclared entries are mandatory even
                  when the analyzer is called directly rather than through CI.

                  Retained posterior rows and intervention-method rows must have
                  unique complete identities across seed, held-out topology,
                  source topology set, condition, setting, and observation fraction.
                  Duplicate rows are rejected rather than collapsed by dictionary
                  construction.

                  Diagnostic provenance records the portable bundle name, manifest
                  digest, and complete declared artifact identities. It does not
                  serialize a runner-local absolute directory as scientific evidence.
                  '''
              )
              docs.write_text(docs_text, encoding="utf-8")
          PY

      - name: Install and validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/causal4d/contact_posterior_diagnostics.py \
            src/causal4d/result_bundle_verification.py \
            tests/test_contact_posterior_diagnostics.py \
            tests/test_contact_posterior_bundle_verification.py
          python -m ruff check \
            src/causal4d/contact_posterior_diagnostics.py \
            src/causal4d/result_bundle_verification.py \
            tests/test_contact_posterior_diagnostics.py \
            tests/test_contact_posterior_bundle_verification.py
          python -m pytest -q \
            tests/test_contact_posterior_diagnostics.py \
            tests/test_contact_posterior_bundle_verification.py
          python -m py_compile \
            src/causal4d/contact_posterior_diagnostics.py \
            src/causal4d/result_bundle_verification.py

      - name: Commit validated changes and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-contact-diagnostic-contract-hardening.yml
          git add \
            docs/contact_posterior_diagnostics.md \
            src/causal4d/contact_posterior_diagnostics.py \
            src/causal4d/result_bundle_verification.py \
            tests/test_contact_posterior_diagnostics.py \
            tests/test_contact_posterior_bundle_verification.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden contact diagnostic evidence contracts"
          git push origin HEAD:agent/reproducibility-contact-diagnostics
