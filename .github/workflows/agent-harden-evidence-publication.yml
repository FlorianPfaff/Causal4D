name: Apply evidence publication hardening

on:
  push:
    branches: [agent/harden-evidence-publication]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-harden-evidence-publication
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Overlay validated public-provider integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/agent/public-provider-integration:refs/remotes/origin/agent/public-provider-integration
          git checkout refs/remotes/origin/agent/public-provider-integration -- \
            .github/workflows/bayesian-phystwin-provider-compatibility.yml \
            .github/workflows/ci.yml \
            docs/ci.md \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py

      - name: Apply hardening patch
