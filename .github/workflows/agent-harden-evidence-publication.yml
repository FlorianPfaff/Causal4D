      - name: Remove one-shot executor before validation
        run: rm -f .github/workflows/agent-harden-evidence-publication.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: python -m pip install -e ".[dev]"

      - name: Format changed Python files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD -- '*.py')
          printf '%s\n' "${files[@]}"
          if (( ${#files[@]} )); then
            python -m ruff format "${files[@]}"
          fi

      - name: Run quality checks
        run: |
          python -m ruff check .
          python -m mypy \
            scripts/ci \
            src/causal4d/atomic_io.py \
            src/causal4d/result_bundle_publication.py \
            src/causal4d/trusted_pickle.py \
            src/causal4d/immutable_array.py \
            src/causal4d/immutable_json.py \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_trusted_pickle.py \
            tests/test_trusted_pickle_cli_contract.py \
            tests/test_result_bundle_publication.py \
            tests/test_package_contract.py \
            tests/test_release_workflow_policy.py \
            tests/test_three_repository_workflow_policy.py

      - name: Run core test suite
        run: python -m pytest -q

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden evidence publication and provider inputs"
          git push origin HEAD:agent/harden-evidence-publication
