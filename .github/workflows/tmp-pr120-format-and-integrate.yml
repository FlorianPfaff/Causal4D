name: Temporary PR 120 formatter and integrator

on:
  push:
    branches:
      - agent/reproducibility-contact-diagnostics

permissions:
  contents: write

concurrency:
  group: tmp-pr120-format-and-integrate
  cancel-in-progress: true

jobs:
  format-and-integrate:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref_name == 'agent/reproducibility-contact-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/reproducibility-contact-diagnostics
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install the repository development tools
        run: python -m pip install -e '.[dev]'

      - name: Apply the additive-diagnostic projection and workstation integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"expected patch anchor missing in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          comparator = Path("scripts/ci/compare_result_bundles.py")
          replace_once(
              comparator,
              '_TOLERANCE_POLICY_ID = "causal4d-field-aware-cross-platform-v1"\n\n\n',
              '''_TOLERANCE_POLICY_ID = "causal4d-field-aware-cross-platform-v1"\n_ALLOWED_CONTACT_ROW_DIAGNOSTICS = frozenset(\n    {\n        "joint_positive_support_size",\n        "node_credible_set_size",\n        "node_entropy",\n        "node_map_set",\n        "node_map_set_size",\n        "node_normalized_entropy",\n        "node_support_size",\n        "node_tie_closed_credible_covered",\n        "node_tie_closed_credible_set_size",\n        "node_truth_in_map_set",\n    }\n)\n_ALLOWED_CONTACT_AGGREGATE_DIAGNOSTICS = frozenset(\n    {\n        "mean_joint_positive_support_size",\n        "mean_node_credible_set_size",\n        "mean_node_map_set_size",\n        "mean_node_normalized_entropy",\n        "mean_node_tie_closed_credible_set_size",\n        "node_map_set_coverage",\n        "node_tie_closed_credible_coverage",\n    }\n)\n\n\n''',
          )
          replace_once(
              comparator,
              '''    gate_checks: int = 0\n    numeric_policy_counts: dict[str, int] = field(default_factory=dict)\n\n    def compare_number(\n''',
              '''    gate_checks: int = 0\n    numeric_policy_counts: dict[str, int] = field(default_factory=dict)\n    additive_diagnostic_fields: dict[str, list[str]] = field(\n        default_factory=dict\n    )\n\n    def record_additive_fields(self, path: str, fields: set[str]) -> None:\n        if fields:\n            self.additive_diagnostic_fields[path] = sorted(fields)\n\n    def compare_number(\n''',
          )
          replace_once(
              comparator,
              '''    if isinstance(expected, dict):\n        expected_keys = set(expected)\n        actual_keys = set(actual)\n        if expected_keys != actual_keys:\n            missing = sorted(expected_keys - actual_keys)\n            extra = sorted(actual_keys - expected_keys)\n            comparison.mismatches.append(\n                f"{path}: object keys differ; missing={missing!r}, extra={extra!r}"\n            )\n        for key in sorted(expected_keys & actual_keys):\n''',
              '''    if isinstance(expected, dict):\n        expected_keys = set(expected)\n        actual_keys = set(actual)\n        missing = expected_keys - actual_keys\n        extra = actual_keys - expected_keys\n        allowed_extra: set[str] = set()\n        if path.startswith("summary.json.aggregate.contact_recovery["):\n            allowed_extra = extra & _ALLOWED_CONTACT_AGGREGATE_DIAGNOSTICS\n            comparison.record_additive_fields(path, allowed_extra)\n        unexpected_extra = extra - allowed_extra\n        if missing or unexpected_extra:\n            comparison.mismatches.append(\n                f"{path}: object keys differ; missing={sorted(missing)!r}, "\n                f"extra={sorted(unexpected_extra)!r}"\n            )\n        for key in sorted(expected_keys & actual_keys):\n''',
          )
          replace_once(
              comparator,
              '''    if expected_fields != actual_fields:\n        comparison.mismatches.append(\n            f"{label}: header differs ({expected_fields!r} versus "\n            f"{actual_fields!r})"\n        )\n        return\n''',
              '''    if expected_fields != actual_fields:\n        expected_set = set(expected_fields)\n        actual_set = set(actual_fields)\n        missing = expected_set - actual_set\n        extra = actual_set - expected_set\n        allowed_extra: set[str] = set()\n        if label == "contact_recovery.csv":\n            allowed_extra = extra & _ALLOWED_CONTACT_ROW_DIAGNOSTICS\n            comparison.record_additive_fields(label, allowed_extra)\n        unexpected_extra = extra - allowed_extra\n        retained_order = [\n            field_name\n            for field_name in actual_fields\n            if field_name in expected_set\n        ]\n        if missing or unexpected_extra or retained_order != expected_fields:\n            comparison.mismatches.append(\n                f"{label}: header differs; missing={sorted(missing)!r}, "\n                f"extra={sorted(unexpected_extra)!r}, "\n                f"retained_order_matches={retained_order == expected_fields}"\n            )\n            return\n''',
          )
          replace_once(
              comparator,
              '''        "gate_checks": comparison.gate_checks,\n        "maximum_absolute_difference": comparison.maximum_absolute_difference,\n''',
              '''        "gate_checks": comparison.gate_checks,\n        "additive_diagnostic_fields": dict(\n            sorted(comparison.additive_diagnostic_fields.items())\n        ),\n        "maximum_absolute_difference": comparison.maximum_absolute_difference,\n''',
          )
          replace_once(
              comparator,
              '''            "decisions, plus field-aware numerical agreement. Tolerances can "\n            "never change, revise, or rescue a scientific gate."\n''',
              '''            "decisions, plus field-aware numerical agreement. Explicitly "\n            "whitelisted additive contact diagnostics may be retained without "\n            "changing the frozen claim projection. Tolerances can never change, "\n            "revise, or rescue a scientific gate."\n''',
          )

          comparator_tests = Path("tests/test_compare_result_bundles.py")
          test_text = comparator_tests.read_text(encoding="utf-8")
          if "test_whitelisted_additive_contact_diagnostics_are_projected_out" not in test_text:
              test_text += '''\n\ndef test_whitelisted_additive_contact_diagnostics_are_projected_out(\n    tmp_path: Path,\n) -> None:\n    expected = tmp_path / "expected-additive"\n    actual = tmp_path / "actual-additive"\n    _write_bundle(expected)\n    _write_bundle(actual)\n\n    for root, additive in ((expected, False), (actual, True)):\n        summary_path = root / "summary.json"\n        summary = json.loads(summary_path.read_text(encoding="utf-8"))\n        aggregate = {\n            "setting": "online_adaptation",\n            "world_condition": "shifted_contact",\n            "case_count": 1,\n        }\n        if additive:\n            aggregate["mean_node_map_set_size"] = 1.0\n        summary["aggregate"]["contact_recovery"] = [aggregate]\n        _write_json(summary_path, summary)\n\n    contact_path = actual / "contact_recovery.csv"\n    with contact_path.open(newline="", encoding="utf-8") as handle:\n        reader = csv.DictReader(handle)\n        fields = list(reader.fieldnames or ())\n        rows = list(reader)\n    _write_csv(\n        contact_path,\n        [*fields, "node_map_set"],\n        [{**row, "node_map_set": "5"} for row in rows],\n    )\n\n    completed, report = _compare(tmp_path, expected, actual)\n\n    assert completed.returncode == 0\n    assert report["semantic_match"] is True\n    assert report["all_payload_bytes_match"] is False\n    assert "contact_recovery.csv" in report["additive_diagnostic_fields"]\n    assert any(\n        path.startswith("summary.json.aggregate.contact_recovery[")\n        for path in report["additive_diagnostic_fields"]\n    )\n'''
              comparator_tests.write_text(test_text, encoding="utf-8")

          workflow = Path(".github/workflows/workstation2-evaluation.yml")
          replace_once(
              workflow,
              '''      - "scripts/ci/compare_result_bundles.py"\n      - "scripts/ci/workstation2_gpu_qualification.py"\n''',
              '''      - "scripts/ci/analyze_contact_posterior.py"\n      - "scripts/ci/compare_result_bundles.py"\n      - "scripts/ci/workstation2_gpu_qualification.py"\n      - "src/causal4d/contact_posterior_diagnostics.py"\n      - "tests/test_contact_posterior_diagnostics.py"\n''',
          )
          replace_once(
              workflow,
              '''          .workstation2-venv/bin/python scripts/ci/verify_result_bundle.py \\\n            outputs/workstation2/independent-seeds/manifest.json\n\n      - name: Summarize evaluation evidence\n''',
              '''          .workstation2-venv/bin/python scripts/ci/verify_result_bundle.py \\\n            outputs/workstation2/independent-seeds/manifest.json\n\n      - name: Diagnose independent contact posterior\n        shell: bash\n        run: |\n          set -euo pipefail\n          .workstation2-venv/bin/python \\\n            scripts/ci/analyze_contact_posterior.py \\\n            outputs/workstation2/independent-seeds \\\n            --output-dir \\\n              outputs/workstation2/contact-posterior-diagnostics \\\n            | tee \\\n              outputs/workstation2/contact-posterior-diagnostic-console.json\n\n      - name: Summarize evaluation evidence\n''',
          )
          replace_once(
              workflow,
              '''          independent = json.loads(\n              (root / "independent-seeds/summary.json").read_text(encoding="utf-8")\n          )\n          summary = {\n''',
              '''          independent = json.loads(\n              (root / "independent-seeds/summary.json").read_text(encoding="utf-8")\n          )\n          diagnostic = json.loads(\n              (\n                  root\n                  / "contact-posterior-diagnostics"\n                  / "contact-posterior-diagnostics.json"\n              ).read_text(encoding="utf-8")\n          )\n          summary = {\n''',
          )
          replace_once(
              workflow,
              '''              "independent_success_gates": independent["success_gates"],\n              "independent_aggregate": independent["aggregate"],\n              "claim_boundary": (\n''',
              '''              "independent_success_gates": independent["success_gates"],\n              "independent_aggregate": independent["aggregate"],\n              "contact_posterior_recomputation_parity": diagnostic[\n                  "recomputation_parity"\n              ],\n              "contact_posterior_overall": diagnostic["overall"],\n              "contact_posterior_by_topology": diagnostic["by_topology"],\n              "claim_boundary": (\n''',
          )
          replace_once(
              workflow,
              '''                  "diagnostic replication and do not change the frozen method, "\n                  "registered real experiment, or paper claim."\n''',
              '''                  "diagnostic replication. Its separate topology-aware contact "\n                  "analysis does not change the frozen method, exact-node gate, "\n                  "registered real experiment, or paper claim."\n''',
          )
          replace_once(
              workflow,
              '''          print(\n              "- Independent gates passed: "\n              f"`{summary['independent_success_gates']['overall_passed']}`"\n          )\n''',
              '''          print(\n              "- Independent gates passed: "\n              f"`{summary['independent_success_gates']['overall_passed']}`"\n          )\n          parity = summary["contact_posterior_recomputation_parity"]\n          posterior = summary["contact_posterior_overall"]\n          print(f"- Contact-posterior parity: `{parity['passed']}`")\n          print(\n              "- Exact / one-hop contact recovery: "\n              f"`{posterior['exact_node_accuracy']:.2%}` / "\n              f"`{posterior['one_hop_patch_accuracy']:.2%}`"\n          )\n''',
          )

          Path(".github/workflows/contact-posterior-diagnostics.yml").unlink()
          PY

      - name: Format and validate all changed Python
        shell: bash
        run: |
          python -m ruff format \
            scripts/ci/analyze_contact_posterior.py \
            scripts/ci/compare_result_bundles.py \
            src/causal4d/contact_posterior_diagnostics.py \
            tests/test_compare_result_bundles.py \
            tests/test_contact_posterior_diagnostics.py
          python -m ruff check .
          python -m pytest -q \
            tests/test_compare_result_bundles.py \
            tests/test_contact_posterior_diagnostics.py
          git diff --check

      - name: Remove this one-shot workflow and publish the product commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr120-format-and-integrate.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and integrate reproducibility diagnostics"
          basic_auth="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c \
            http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:agent/reproducibility-contact-diagnostics
