name: Materialize topology covariance diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/materialize-topology-covariance.yml"

permissions:
  contents: write

concurrency:
  group: materialize-topology-covariance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/topology-conditioned-contact-covariance-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out transport branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify and materialize reviewable source
        shell: bash
        run: |
          set -euo pipefail
          cd .github/agent/topology-covariance
          sha256sum -c <<'EOF'
          70a7e168eb3f0245c730e5e81b1b9377dacada53d5222b33febdd6b06c1bb9e3  part-00
          89a19718289171a6b3257ecb94b5b2057e2f358a8d89e21d2f32655d9fac6d9a  part-01
          dad191a92d2347c9f219ec144d3e6c3ea5d3a756f3a632dc3199efccce3caf65  part-02
          52422e1b94acea03b4b227fef76ba088c7816a1d341a069e3abca9541ca07a9f  part-03
          b9993ff50e77de2072424f1003407b22f7d8f13143937fe5d0b561dbaeef2da1  part-04
          62009b11c69743def953b8e5e859bb68f882de25a6a548434334ee1227bc7925  part-05
          EOF
          cat part-* > /tmp/topology-preflight-files.tar.gz.b64
          echo "3da68cce0c1a488bea46ba24505c0100da7603c2a8086c4ff1b24ee57e9f2d25  /tmp/topology-preflight-files.tar.gz.b64" \
            | sha256sum -c -
          base64 --decode /tmp/topology-preflight-files.tar.gz.b64 \
            > /tmp/topology-preflight-files.tar.gz
          echo "c9a3b7cc0a786b78b7cdddae113a99e379387bb5c1191a64df36ab907250d6d9  /tmp/topology-preflight-files.tar.gz" \
            | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import tarfile

          expected = {
              "docs/contact_topology_covariance.md",
              "scripts/ci/run_contact_topology_covariance_diagnostic.py",
              "src/causal4d/contact_topology_covariance_diagnostic.py",
              "tests/test_contact_topology_covariance_diagnostic.py",
              "tests/test_contact_topology_covariance_workflow_policy.py",
          }
          with tarfile.open("/tmp/topology-preflight-files.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(
                      f"transport inventory changed: expected={sorted(expected)!r}, "
                      f"actual={sorted(names)!r}"
                  )
              if any(not member.isfile() for member in members):
                  raise SystemExit("transport contains a non-regular member")
              archive.extractall(".", filter="data")
          PY
          rm -rf .github/agent/topology-covariance
          rm .github/workflows/materialize-topology-covariance.yml

      - name: Install validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/causal4d/contact_topology_covariance_diagnostic.py \
            scripts/ci/run_contact_topology_covariance_diagnostic.py \
            tests/test_contact_topology_covariance_diagnostic.py \
            tests/test_contact_topology_covariance_workflow_policy.py
          python -m ruff format --check \
            src/causal4d/contact_topology_covariance_diagnostic.py \
            scripts/ci/run_contact_topology_covariance_diagnostic.py \
            tests/test_contact_topology_covariance_diagnostic.py \
            tests/test_contact_topology_covariance_workflow_policy.py
          python -m pytest -q \
            --ignore=tests/test_contact_topology_covariance_workflow_policy.py
          python scripts/ci/run_contact_topology_covariance_diagnostic.py \
            --output-dir /tmp/topology-covariance-smoke \
            --development-seeds 10:13 \
            --evaluation-seeds 13:15 \
            --frames 12 \
            --training-repeats 1 \
            --parameter-grid-count 3 \
            --contact-parameter-particles 4 \
            --shared-correlation-weights 0,1 \
            --identity-shrinkages 0.5,1
          test -s /tmp/topology-covariance-smoke/contact-topology-covariance-diagnostic.json
          test -s /tmp/topology-covariance-smoke/contact-topology-covariance-manifest.json

      - name: Publish clean implementation commit
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add topology covariance diagnostic"
          git push origin "HEAD:${HEAD_BRANCH}"
