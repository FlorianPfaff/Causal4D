name: Temporary PR 119 current-main projection

on:
  push:
    branches:
      - agent/harden-result-bundle-reproducibility

permissions:
  contents: write

concurrency:
  group: tmp-pr119-current-main-projection
  cancel-in-progress: true

jobs:
  project-current-main:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref_name == 'agent/harden-result-bundle-reproducibility'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-result-bundle-reproducibility
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply the explicit additive-diagnostic projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(
                      f"expected patch anchor missing in {path}: {old[:100]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          values = Path("scripts/ci/result_bundle_compare_values.py")
          replace_once(
              values,
              '''_DIRECTION_ANGLE_FIELD = "direction_error_deg"\n\n\n@dataclass\n''',
              '''_DIRECTION_ANGLE_FIELD = "direction_error_deg"\n_ALLOWED_CONTACT_AGGREGATE_DIAGNOSTICS = frozenset(\n    {\n        "mean_joint_positive_support_size",\n        "mean_node_credible_set_size",\n        "mean_node_map_set_size",\n        "mean_node_normalized_entropy",\n        "mean_node_tie_closed_credible_set_size",\n        "node_map_set_coverage",\n        "node_tie_closed_credible_coverage",\n    }\n)\n\n\n@dataclass\n''',
          )
          replace_once(
              values,
              '''    maximum_direction_angle_difference_deg: float = 0.0\n\n    def add_mismatch(self, message: str) -> None:\n''',
              '''    maximum_direction_angle_difference_deg: float = 0.0\n    additive_diagnostic_fields: dict[str, list[str]] = field(\n        default_factory=dict\n    )\n\n    def add_mismatch(self, message: str) -> None:\n''',
          )
          replace_once(
              values,
              '''    def add_mismatch(self, message: str) -> None:\n        self.mismatches.append(message)\n\n    def compare_exact_number(\n''',
              '''    def add_mismatch(self, message: str) -> None:\n        self.mismatches.append(message)\n\n    def record_additive_fields(self, path: str, fields: set[str]) -> None:\n        if fields:\n            self.additive_diagnostic_fields[path] = sorted(fields)\n\n    def compare_exact_number(\n''',
          )
          replace_once(
              values,
              '''    if isinstance(expected, dict):\n        expected_keys = set(expected)\n        actual_keys = set(actual)\n        if expected_keys != actual_keys:\n            missing = sorted(expected_keys - actual_keys)\n            extra = sorted(actual_keys - expected_keys)\n            comparison.add_mismatch(\n                f"{path}: object keys differ; missing={missing!r}, extra={extra!r}"\n            )\n        for key in sorted(expected_keys & actual_keys):\n''',
              '''    if isinstance(expected, dict):\n        expected_keys = set(expected)\n        actual_keys = set(actual)\n        missing = expected_keys - actual_keys\n        extra = actual_keys - expected_keys\n        allowed_extra: set[str] = set()\n        if path.startswith("summary.json.aggregate.contact_recovery["):\n            allowed_extra = extra & _ALLOWED_CONTACT_AGGREGATE_DIAGNOSTICS\n            comparison.record_additive_fields(path, allowed_extra)\n        unexpected_extra = extra - allowed_extra\n        if missing or unexpected_extra:\n            comparison.add_mismatch(\n                f"{path}: object keys differ; missing={sorted(missing)!r}, "\n                f"extra={sorted(unexpected_extra)!r}"\n            )\n        for key in sorted(expected_keys & actual_keys):\n''',
          )

          payloads = Path("scripts/ci/result_bundle_compare_payloads.py")
          replace_once(
              payloads,
              '''_NONFINITE_TEXT = {\n''',
              '''_ALLOWED_CONTACT_ROW_DIAGNOSTICS = frozenset(\n    {\n        "joint_positive_support_size",\n        "node_credible_set_size",\n        "node_entropy",\n        "node_map_set",\n        "node_map_set_size",\n        "node_normalized_entropy",\n        "node_support_size",\n        "node_tie_closed_credible_covered",\n        "node_tie_closed_credible_set_size",\n        "node_truth_in_map_set",\n    }\n)\n_NONFINITE_TEXT = {\n''',
          )
          replace_once(
              payloads,
              '''    if expected_fields != actual_fields:\n        comparison.add_mismatch(\n            f"{label}: header differs ({expected_fields!r} versus {actual_fields!r})"\n        )\n        return\n''',
              '''    actual_field_positions = {\n        field_name: index for index, field_name in enumerate(actual_fields)\n    }\n    if expected_fields != actual_fields:\n        expected_set = set(expected_fields)\n        actual_set = set(actual_fields)\n        missing = expected_set - actual_set\n        extra = actual_set - expected_set\n        allowed_extra: set[str] = set()\n        if label == "contact_recovery.csv":\n            allowed_extra = extra & _ALLOWED_CONTACT_ROW_DIAGNOSTICS\n            comparison.record_additive_fields(label, allowed_extra)\n        unexpected_extra = extra - allowed_extra\n        retained_order = [\n            field_name\n            for field_name in actual_fields\n            if field_name in expected_set\n        ]\n        if missing or unexpected_extra or retained_order != expected_fields:\n            comparison.add_mismatch(\n                f"{label}: header differs; missing={sorted(missing)!r}, "\n                f"extra={sorted(unexpected_extra)!r}, "\n                f"retained_order_matches={retained_order == expected_fields}"\n            )\n            return\n''',
          )
          replace_once(
              payloads,
              '''        for field_index, field_name in enumerate(expected_fields):\n            expected = expected_row[field_index]\n            actual = actual_row[field_index]\n''',
              '''        for field_index, field_name in enumerate(expected_fields):\n            expected = expected_row[field_index]\n            actual = actual_row[actual_field_positions[field_name]]\n''',
          )

          runner = Path("scripts/ci/result_bundle_compare_runner.py")
          replace_once(
              runner,
              '''            "JSON value types, object keys, list lengths, and list order",\n''',
              '''            "JSON value types, claim-bearing object keys, list lengths, "\n            "and list order",\n''',
          )
          replace_once(
              runner,
              '''        "floating_semantics": {\n''',
              '''        "additive_diagnostic_projection": {\n            "scope": (\n                "Only the named contact-recovery diagnostics introduced after "\n                "the frozen bundle are projected out of the claim comparison."\n            ),\n            "all_other_extra_fields": "semantic mismatch",\n        },\n        "floating_semantics": {\n''',
          )
          replace_once(
              runner,
              '''        "exact_numeric_comparisons": comparison.exact_numeric_comparisons,\n        "maximum_absolute_difference": comparison.maximum_absolute_difference,\n''',
              '''        "exact_numeric_comparisons": comparison.exact_numeric_comparisons,\n        "additive_diagnostic_fields": dict(\n            sorted(comparison.additive_diagnostic_fields.items())\n        ),\n        "maximum_absolute_difference": comparison.maximum_absolute_difference,\n''',
          )
          replace_once(
              runner,
              '''            "schema, identity, ordering, integer fields, thresholds, or gate "\n            "decisions, and byte mismatches remain explicit diagnostics."\n''',
              '''            "schema, identity, ordering, integer fields, thresholds, or gate "\n            "decisions. Only explicitly named additive, non-claim contact "\n            "diagnostics are projected out, and byte mismatches remain explicit "\n            "diagnostics."\n''',
          )

          tests = Path("tests/test_result_bundle_reproducibility.py")
          text = tests.read_text(encoding="utf-8")
          marker = "test_whitelisted_contact_diagnostics_are_additive_only"
          if marker not in text:
              text += '''\n\ndef test_whitelisted_contact_diagnostics_are_additive_only(\n    tmp_path: Path,\n) -> None:\n    expected = tmp_path / "expected-additive"\n    actual = tmp_path / "actual-additive"\n    _write_bundle(expected)\n    _copy_bundle(expected, actual)\n\n    expected_summary = _read_json(expected / "summary.json")\n    expected_summary["aggregate"] = {\n        "contact_recovery": [\n            {\n                "case_count": 2,\n                "setting": "online_adaptation",\n                "world_condition": "shifted_contact",\n            }\n        ]\n    }\n    _write_json(expected / "summary.json", expected_summary)\n    _refresh_result_manifest(expected)\n\n    actual_summary = _read_json(actual / "summary.json")\n    actual_summary["aggregate"] = {\n        "contact_recovery": [\n            {\n                "case_count": 2,\n                "setting": "online_adaptation",\n                "world_condition": "shifted_contact",\n                "mean_node_map_set_size": 1.25,\n                "node_map_set_coverage": 0.95,\n            }\n        ]\n    }\n    _write_json(actual / "summary.json", actual_summary)\n\n    rows = list(\n        csv.reader((actual / "contact_recovery.csv").open(encoding="utf-8"))\n    )\n    rows[0].extend(["node_map_set", "node_map_set_size"])\n    rows[1].extend(["2", "1"])\n    rows[2].extend(["3;4", "2"])\n    with (actual / "contact_recovery.csv").open(\n        "w", encoding="utf-8", newline=""\n    ) as handle:\n        csv.writer(handle).writerows(rows)\n    _refresh_result_manifest(actual)\n\n    process, report = _run_comparison(expected, actual, tmp_path)\n\n    assert process.returncode == 0\n    assert report["semantic_match"] is True\n    assert report["all_payload_bytes_match"] is False\n    assert report["additive_diagnostic_fields"]["contact_recovery.csv"] == [\n        "node_map_set",\n        "node_map_set_size",\n    ]\n    assert any(\n        path.startswith("summary.json.aggregate.contact_recovery[")\n        for path in report["additive_diagnostic_fields"]\n    )\n\n\ndef test_unregistered_additive_field_remains_a_semantic_mismatch(\n    tmp_path: Path,\n) -> None:\n    expected = tmp_path / "expected-extra"\n    actual = tmp_path / "actual-extra"\n    _write_bundle(expected)\n    _copy_bundle(expected, actual)\n\n    rows = list(\n        csv.reader((actual / "contact_recovery.csv").open(encoding="utf-8"))\n    )\n    rows[0].append("invented_diagnostic")\n    rows[1].append("1")\n    rows[2].append("1")\n    with (actual / "contact_recovery.csv").open(\n        "w", encoding="utf-8", newline=""\n    ) as handle:\n        csv.writer(handle).writerows(rows)\n    _refresh_result_manifest(actual)\n\n    process, report = _run_comparison(expected, actual, tmp_path)\n\n    assert process.returncode == 2\n    assert report["semantic_match"] is False\n    assert any(\n        "invented_diagnostic" in mismatch\n        for mismatch in report["mismatches"]\n    )\n'''
              tests.write_text(text, encoding="utf-8")

          docs = Path("docs/result_bundle_reproducibility.md")
          doc_text = docs.read_text(encoding="utf-8")
          heading = "## Additive diagnostic compatibility"
          if heading not in doc_text:
              doc_text += '''\n\n## Additive diagnostic compatibility\n\nThe frozen controlled bundle predates the tie-aware contact diagnostics added by\nCausal4D PR #118. An independently regenerated current bundle may therefore carry\na strictly enumerated set of additional contact-recovery columns and aggregate\nfields. These fields are non-claim diagnostics and are projected out of the\nfrozen claim comparison while remaining visible in\n`additive_diagnostic_fields` and in the byte mismatch.\n\nThis is not a general schema relaxation. The comparator admits only the named\ncontact diagnostics in `contact_recovery.csv` and\n`summary.json.aggregate.contact_recovery`. Missing frozen fields, changed field\norder, an unknown extra field, or any extra field elsewhere remains a semantic\nmismatch. Registered gates, thresholds, decisions, identities, and all retained\nclaim-bearing values remain exact or tolerance-governed exactly as specified\nabove.\n'''
              docs.write_text(doc_text, encoding="utf-8")
          PY

      - name: Format and validate the current-main product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            scripts/ci/result_bundle_compare_payloads.py \
            scripts/ci/result_bundle_compare_runner.py \
            scripts/ci/result_bundle_compare_values.py \
            tests/test_result_bundle_reproducibility.py
          python -m ruff check .
          python -m pytest -q \
            tests/test_result_bundle_reproducibility.py \
            tests/test_reproduction_manifest.py
          python -m py_compile scripts/ci/*.py \
            tests/result_bundle_test_support.py \
            tests/test_result_bundle_reproducibility.py \
            tests/test_reproduction_manifest.py
          git diff --check

      - name: Remove this workflow and publish
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr119-current-main-projection.yml
          git diff --check
          git add -A
          git commit -m \
            "Project additive contact diagnostics from frozen comparison"
          basic_auth="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c \
            http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:agent/harden-result-bundle-reproducibility
