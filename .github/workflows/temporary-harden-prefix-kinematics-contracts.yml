name: Temporary harden prefix-kinematics contracts

on:
  push:
    branches:
      - agent/deform360-prefix-kinematics-v1
    paths:
      - ".github/workflows/temporary-harden-prefix-kinematics-contracts.yml"

permissions:
  contents: write

concurrency:
  group: temporary-harden-prefix-kinematics-contracts
  cancel-in-progress: true

jobs:
  harden:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref_name == 'agent/deform360-prefix-kinematics-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deform360-prefix-kinematics-v1
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply fail-closed contract hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"expected exactly one patch anchor in {path}: {old[:120]!r}; "
                      f"found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          prefix = Path("src/causal4d_public/deform360_prefix_kinematics.py")
          replace_once(
              prefix,
              '''def _readonly(values: np.ndarray, *, dtype: np.dtype[Any] | type[Any]) -> np.ndarray:
              result = np.asarray(values, dtype=dtype).copy()
              result.setflags(write=False)
              return result


          @dataclass(frozen=True)
          ''',
              '''def _readonly(values: np.ndarray, *, dtype: np.dtype[Any] | type[Any]) -> np.ndarray:
              result = np.asarray(values, dtype=dtype).copy()
              result.setflags(write=False)
              return result


          def _edge_graph_is_connected(node_count: int, edges: np.ndarray) -> bool:
              """Return whether undirected edges reach every node from node zero."""

              adjacency: list[list[int]] = [[] for _ in range(node_count)]
              for raw_left, raw_right in np.asarray(edges, dtype=np.int64):
                  left = int(raw_left)
                  right = int(raw_right)
                  adjacency[left].append(right)
                  adjacency[right].append(left)
              reached = {0}
              pending = [0]
              while pending:
                  current = pending.pop()
                  for neighbor in adjacency[current]:
                      if neighbor in reached:
                          continue
                      reached.add(neighbor)
                      pending.append(neighbor)
              return len(reached) == node_count


          @dataclass(frozen=True)
          ''',
          )
          replace_once(
              prefix,
              '''    offset = np.asarray(association.get("contact_offset_m"), dtype=np.float64)
              _require(
                  offset.shape == (3,) and np.all(np.isfinite(offset)),
                  "contact association offset must be a finite three-vector",
              )
          ''',
              '''    raw_offset = association.get("contact_offset_m")
              if (
                  not isinstance(raw_offset, Sequence)
                  or isinstance(raw_offset, (str, bytes))
                  or len(raw_offset) != 3
              ):
                  raise ValueError(
                      "contact association offset must be a three-element sequence"
                  )
              offset = np.asarray(raw_offset, dtype=np.float64)
              _require(
                  offset.shape == (3,) and np.all(np.isfinite(offset)),
                  "contact association offset must be a finite three-vector",
              )
          ''',
          )
          replace_once(
              prefix,
              '''    stretch = graph.spring_edges[graph.spring_families == 0]
              _require(len(stretch) >= node_count - 1, "stretch/shear graph is disconnected")
          ''',
              '''    stretch = graph.spring_edges[graph.spring_families == 0]
              _require(
                  len(stretch) >= node_count - 1
                  and _edge_graph_is_connected(node_count, stretch),
                  "stretch/shear graph is disconnected",
              )
          ''',
          )

          diagnostic = Path(
              "src/causal4d_public/deform360_prefix_kinematics_diagnostic.py"
          )
          replace_once(
              diagnostic,
              "from typing import Any\n",
              "from typing import Any, cast\n",
          )
          replace_once(
              diagnostic,
              '''def _require(condition: bool, message: str) -> None:
              if not condition:
                  raise ValueError(message)


          def _canonical_bytes(value: Any) -> bytes:
          ''',
              '''def _require(condition: bool, message: str) -> None:
              if not condition:
                  raise ValueError(message)


          def _require_mapping(value: Any, *, message: str) -> Mapping[str, Any]:
              if not isinstance(value, Mapping) or any(
                  type(key) is not str for key in value
              ):
                  raise ValueError(message)
              return cast(Mapping[str, Any], value)


          def _require_nonempty_list(value: Any, *, message: str) -> list[Any]:
              if not isinstance(value, list) or len(value) == 0:
                  raise ValueError(message)
              return value


          def _canonical_bytes(value: Any) -> bytes:
          ''',
          )
          replace_once(
              diagnostic,
              '''    controls = payload.get("config")
              _require(isinstance(controls, Mapping), "prefix-kinematics controls are missing")
              kinematics = controls.get("kinematics")
              _require(isinstance(kinematics, Mapping), "kinematics controls are missing")
              selected = controls.get("selected_object_ids")
              _require(
                  isinstance(selected, list)
                  and selected
                  and all(type(value) is str and value for value in selected)
                  and len(selected) == len(set(selected)),
                  "selected source object set is invalid",
              )
          ''',
              '''    controls = _require_mapping(
                  payload.get("config"),
                  message="prefix-kinematics controls are missing",
              )
              kinematics = _require_mapping(
                  controls.get("kinematics"),
                  message="kinematics controls are missing",
              )
              selected = _require_nonempty_list(
                  controls.get("selected_object_ids"),
                  message="selected source object set is invalid",
              )
              _require(
                  all(type(value) is str and value for value in selected)
                  and len(selected) == len(set(selected)),
                  "selected source object set is invalid",
              )
          ''',
          )
          replace_once(
              diagnostic,
              '''    boundary = payload.get("information_boundary")
              _require(isinstance(boundary, Mapping), "config information boundary is missing")
          ''',
              '''    boundary = _require_mapping(
                  payload.get("information_boundary"),
                  message="config information boundary is missing",
              )
          ''',
          )
          replace_once(
              diagnostic,
              '''    entries = manifest.get("entries")
              _require(isinstance(entries, list) and entries, "source manifest has no entries")
              seen: set[str] = set()
              for index, entry in enumerate(entries):
                  _require(isinstance(entry, Mapping), "source manifest entry is not a mapping")
          ''',
              '''    entries = _require_nonempty_list(
                  manifest.get("entries"),
                  message="source manifest has no entries",
              )
              seen: set[str] = set()
              for index, raw_entry in enumerate(entries):
                  entry = _require_mapping(
                      raw_entry,
                      message="source manifest entry is not a mapping",
                  )
          ''',
          )
          replace_once(
              diagnostic,
              '''    _require(finite_rows, "source grid has no finite candidate")
          ''',
              '''    _require(len(finite_rows) > 0, "source grid has no finite candidate")
          ''',
          )
          replace_once(
              diagnostic,
              '''    parameters = row.get("parameters")
              _require(isinstance(parameters, Mapping), "selected candidate has no parameters")
          ''',
              '''    parameters = _require_mapping(
                  row.get("parameters"),
                  message="selected candidate has no parameters",
              )
          ''',
          )
          replace_once(
              diagnostic,
              '''    for record in episode_records:
                  policies = record.get("policies")
                  _require(isinstance(policies, Mapping), "episode policy record is missing")
                  baseline = policies.get(PREFIX_KINEMATICS_POLICIES[0])
                  candidate = policies.get(policy_name)
                  _require(
                      isinstance(baseline, Mapping) and isinstance(candidate, Mapping),
                      "episode policy result is missing",
                  )
          ''',
              '''    for record in episode_records:
                  policies = _require_mapping(
                      record.get("policies"),
                      message="episode policy record is missing",
                  )
                  baseline = _require_mapping(
                      policies.get(PREFIX_KINEMATICS_POLICIES[0]),
                      message="episode zero-velocity result is missing",
                  )
                  candidate = _require_mapping(
                      policies.get(policy_name),
                      message="episode candidate-policy result is missing",
                  )
          ''',
          )
          replace_once(
              diagnostic,
              '''    _require(selected_objects, "diagnostic object set is empty")
          ''',
              '''    _require(len(selected_objects) > 0, "diagnostic object set is empty")
          ''',
          )
          replace_once(
              diagnostic,
              '''    boundary = payload.get("information_boundary")
              _require(isinstance(boundary, Mapping), "diagnostic boundary is missing")
              _require(
                  boundary.get("calibration_outcomes_read") is False
                  and boundary.get("target_prefix_read") is False
                  and boundary.get("target_future_geometry_read") is False
                  and boundary.get("target_future_tactile_read") is False
                  and boundary.get("registered_replication_result_changed") is False,
                  "diagnostic crossed its information or claim boundary",
              )
              records = payload.get("episode_records")
              _require(isinstance(records, list) and records, "diagnostic has no episodes")
              for record in records:
                  _require(
                      record["information_boundary"]["source_episode_only"] is True
                      and record["information_boundary"]["target_prefix_read"] is False
                      and record["information_boundary"]["target_future_read"] is False,
                      "episode crossed the source-only boundary",
                  )
                  _require(
                      tuple(record["policies"]) == PREFIX_KINEMATICS_POLICIES,
                      "diagnostic policy set or ordering changed",
                  )
          ''',
              '''    boundary = _require_mapping(
                  payload.get("information_boundary"),
                  message="diagnostic boundary is missing",
              )
              _require(
                  boundary.get("calibration_outcomes_read") is False
                  and boundary.get("target_prefix_read") is False
                  and boundary.get("target_future_geometry_read") is False
                  and boundary.get("target_future_tactile_read") is False
                  and boundary.get("registered_replication_result_changed") is False,
                  "diagnostic crossed its information or claim boundary",
              )
              records = _require_nonempty_list(
                  payload.get("episode_records"),
                  message="diagnostic has no episodes",
              )
              for raw_record in records:
                  record = _require_mapping(
                      raw_record,
                      message="diagnostic episode is not a mapping",
                  )
                  episode_boundary = _require_mapping(
                      record.get("information_boundary"),
                      message="episode information boundary is missing",
                  )
                  _require(
                      episode_boundary.get("source_episode_only") is True
                      and episode_boundary.get("target_prefix_read") is False
                      and episode_boundary.get("target_future_read") is False,
                      "episode crossed the source-only boundary",
                  )
                  policies = _require_mapping(
                      record.get("policies"),
                      message="episode policy record is missing",
                  )
                  _require(
                      tuple(policies) == PREFIX_KINEMATICS_POLICIES,
                      "diagnostic policy set or ordering changed",
                  )
          ''',
          )

          tests = Path("tests/test_deform360_prefix_kinematics.py")
          replace_once(
              tests,
              '''def _chain_graph() -> Deform360SparseGraph:
              positions = np.column_stack((np.linspace(0.0, 0.4, 5), np.zeros(5), np.zeros(5)))
              return Deform360SparseGraph(
                  positions_m=positions,
                  spring_edges=np.asarray([[0, 1], [1, 2], [2, 3], [3, 4]]),
                  spring_families=np.zeros(4, dtype=np.int8),
                  masses=np.ones(5),
                  stratum="filament",
                  diagnostics={},
              )


          def _install_fake_deform360(
          ''',
              '''def _chain_graph() -> Deform360SparseGraph:
              positions = np.column_stack((np.linspace(0.0, 0.4, 5), np.zeros(5), np.zeros(5)))
              return Deform360SparseGraph(
                  positions_m=positions,
                  spring_edges=np.asarray([[0, 1], [1, 2], [2, 3], [3, 4]]),
                  spring_families=np.zeros(4, dtype=np.int8),
                  masses=np.ones(5),
                  stratum="filament",
                  diagnostics={},
              )


          def _disconnected_graph() -> Deform360SparseGraph:
              positions = np.column_stack((np.linspace(0.0, 0.4, 5), np.zeros(5), np.zeros(5)))
              return Deform360SparseGraph(
                  positions_m=positions,
                  spring_edges=np.asarray([[0, 1], [1, 2], [0, 2], [3, 4]]),
                  spring_families=np.zeros(4, dtype=np.int8),
                  masses=np.ones(5),
                  stratum="filament",
                  diagnostics={},
              )


          def _install_fake_deform360(
          ''',
          )
          replace_once(
              tests,
              '''def test_graph_policy_diffuses_contact_velocity() -> None:
          ''',
              '''def test_graph_policy_rejects_disconnected_stretch_graph() -> None:
              with pytest.raises(ValueError, match="disconnected"):
                  graph_harmonic_contact_velocity(
                      _disconnected_graph(),
                      np.asarray([[1.0, 0.0, 0.0]]),
                      np.asarray([True]),
                      (0,),
                      contact_weight=100.0,
                      smoothness_weight=1.0,
                      ridge_weight=0.1,
                      maximum_node_speed_m_s=2.0,
                  )


          def test_graph_policy_diffuses_contact_velocity() -> None:
          ''',
          )
          PY

      - name: Format and validate hardened contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          files=(
            scripts/remote/find_deform360_replication_root.py
            scripts/remote/run_deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics.py
            tests/test_deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics_workflow_policy.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/deform360_prefix_kinematics.py \
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py \
            scripts/remote/find_deform360_replication_root.py \
            scripts/remote/run_deform360_prefix_kinematics.py
          python -m pytest -q \
            tests/test_deform360_prefix_kinematics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_prefix_kinematics_workflow_policy.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_source_failure_attribution.py
          bash -n scripts/remote/run_deform360_prefix_kinematics_workflow.sh
          git diff --check

      - name: Remove temporary workflows and publish hardening
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-harden-prefix-kinematics-contracts.yml
          rm -f .github/workflows/temporary-probe-prefix-kinematics-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/temporary-harden-prefix-kinematics-contracts.yml \
            .github/workflows/temporary-probe-prefix-kinematics-runtime.yml \
            src/causal4d_public/deform360_prefix_kinematics.py \
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_prefix_kinematics.py
          git commit -m "Harden prefix-kinematics evidence contracts"
          basic_auth="$(printf 'x-access-token:%s' "${PUSH_TOKEN}" | base64 -w0)"
          git -c \
            http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic_auth}" \
            push origin HEAD:agent/deform360-prefix-kinematics-v1
