name: Apply repository-transfer workflow fix

on:
  push:
    branches:
      - agent/self-hosted-evaluation
    paths:
      - ".github/workflows/apply-transfer-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/self-hosted-evaluation
          persist-credentials: true
      - name: Patch active workflows and remove this helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/optional-integrations.yml"),
          )
          old_repo = "FlorianPfaff/Bayesian-PhysTwin"
          new_repo = "IPS-Stuttgart/Bayesian-PhysTwin"
          replacement_count = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              replacement_count += text.count(old_repo)
              text = text.replace(old_repo, new_repo)
              if path.name == "optional-integrations.yml":
                  old_labels = "[self-hosted, linux, x64, gpu]"
                  if text.count(old_labels) != 1:
                      raise SystemExit(
                          "expected one legacy optional GPU label set"
                      )
                  text = text.replace(
                      old_labels,
                      "[self-hosted, Linux, X64, nvidia-smi]",
                  )
              path.write_text(text, encoding="utf-8")
          if replacement_count != 4:
              raise SystemExit(
                  f"expected four transferred repository references, found {replacement_count}"
              )
          PY
          git rm .github/workflows/apply-transfer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/optional-integrations.yml
          git commit -m "Fix workflow references after repository transfer"
          git push origin HEAD:agent/self-hosted-evaluation
