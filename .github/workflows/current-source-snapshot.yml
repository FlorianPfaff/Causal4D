name: Temporary current source snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/current-source-snapshot.yml"

permissions:
  contents: read

concurrency:
  group: current-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Export exact pull-request source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Archive source and provenance
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > SOURCE_HEAD_SHA
          tar \
            --exclude=.git \
            --exclude=causal4d-current-source.tar.gz \
            -czf causal4d-current-source.tar.gz .
          sha256sum causal4d-current-source.tar.gz > causal4d-current-source.tar.gz.sha256

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: causal4d-current-source
          path: |
            causal4d-current-source.tar.gz
            causal4d-current-source.tar.gz.sha256
            SOURCE_HEAD_SHA
          if-no-files-found: error
          retention-days: 1
