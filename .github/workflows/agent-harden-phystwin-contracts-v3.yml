name: Agent harden PhysTwin contracts v3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agent-harden-phystwin-contracts-v3.yml"

permissions:
  contents: write

concurrency:
  group: agent-harden-phystwin-contracts-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/harden-phystwin-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the corrected backend patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path(
              ".github/workflows/agent-harden-phystwin-contracts.yml"
          )
          workflow = source.read_text(encoding="utf-8")
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = workflow.index(opening) + len(opening)
          stop = workflow.index(closing, start)
          patch_script = textwrap.dedent(workflow[start:stop])
          old_boundary = (
              "    return text[:start] + replacement + text[end:]\n"
          )
          new_boundary = (
              "    return text[:start] + replacement.rstrip() + "
              "'\\n' + text[end:]\n"
          )
          if patch_script.count(old_boundary) != 1:
              raise RuntimeError("unexpected replacement helper source")
          patch_script = patch_script.replace(
              old_boundary,
              new_boundary,
              1,
          )
          exec(compile(patch_script, str(source), "exec"), {})
          for temporary in (
              ".github/workflows/agent-harden-phystwin-contracts-v2.yml",
              ".github/workflows/agent-harden-phystwin-contracts-v3.yml",
              ".github/workflows/agent-diagnose-phystwin-patch.yml",
          ):
              path = Path(temporary)
              if path.exists():
                  path.unlink()
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            "git+https://github.com/IPS-Stuttgart/BayesianPhysTwin.git@main"

      - name: Format and lint the focused change
        run: |
          python -m ruff format \
            src/causal4d/_phystwin_validation.py \
            src/causal4d/phystwin_backend.py \
            tests/test_phystwin_hypothesis_validation.py
          python -m ruff check \
            src/causal4d/_phystwin_validation.py \
            src/causal4d/phystwin_backend.py \
            tests/test_phystwin_hypothesis_validation.py
          python -m ruff format --check --diff \
            src/causal4d/_phystwin_validation.py \
            src/causal4d/phystwin_backend.py \
            tests/test_phystwin_hypothesis_validation.py

      - name: Run focused regression tests
        run: |
          python -m pytest \
            tests/test_phystwin_hypothesis_validation.py \
            tests/test_rollout_bank_io.py \
            tests/test_rollout_bank_io_routing.py

      - name: Commit the validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden PhysTwin hypothesis contracts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
