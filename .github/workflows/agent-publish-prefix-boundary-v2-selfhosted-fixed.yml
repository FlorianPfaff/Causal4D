name: Publish prefix-boundary hardening v2 on workstation2 fixed

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-prefix-boundary-v2-selfhosted-fixed
  cancel-in-progress: true

jobs:
  apply-test-publish:
    if: github.head_ref == 'agent/harden-prefix-boundary-v2'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/harden-prefix-boundary-v2
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebase inputs onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize and apply focused source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source = Path(
              ".github/workflows/agent-publish-prefix-boundary-v2-selfhosted.yml"
          ).read_text(encoding="utf-8")
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', source)
          if match is None:
              raise RuntimeError("prefix-hardening payload is missing")
          Path("/tmp/apply_prefix_hardening.py").write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PY
          python /tmp/apply_prefix_hardening.py

      - name: Install and test in isolated environment
        shell: bash
        run: |
          set -euo pipefail
          VENV="/tmp/causal4d-prefix-boundary-${GITHUB_RUN_ID}"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install -e ".[dev]"
          "$VENV/bin/python" -m ruff format \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py \
            tests/test_probability_support_invariants.py
          "$VENV/bin/python" -m ruff check \
            src/causal4d/contact_inference.py \
            tests/test_contact_inference_edge_cases.py \
            tests/test_probability_support_invariants.py
          "$VENV/bin/python" -m pytest -q \
            tests/test_contact_inference_edge_cases.py \
            tests/test_probability_support_invariants.py \
            tests/test_causal4d_contact_evaluation.py
          git diff --check

      - name: Publish validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-publish-prefix-boundary-v2.yml
          rm .github/workflows/agent-publish-prefix-boundary-v2-pr.yml
          rm .github/workflows/agent-publish-prefix-boundary-v2-selfhosted.yml
          rm .github/workflows/agent-publish-prefix-boundary-v2-selfhosted-fixed.yml
          rm .github/agent-prefix-boundary-trigger.txt
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden prefix-only contact updates"
          git push origin HEAD:agent/harden-prefix-boundary-v2
