name: Apply CI implementation patch

on:
  push:
    branches: [agent/ci-dependency-boundaries]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Materialize the reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/causal4d-ci.patch.gz"
          cp .ci-bootstrap/changes.patch.gz "$patch"
          rm -rf .ci-bootstrap
          rm .github/workflows/apply-ci-patch.yml
          gzip -dc "$patch" | git apply --index
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add dependency-boundary CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
