name: Stage CI implementation

on:
  push:
    branches: [agent/ci-dependency-boundaries]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          show-progress: false
      - name: Prepare patch payload
        shell: bash
        run: |
          set -euo pipefail
          cp .ci-bootstrap/changes.patch.gz "$RUNNER_TEMP/causal4d-ci.patch.gz"
          rm -rf .ci-bootstrap
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ci.yml
          gzip -dc "$RUNNER_TEMP/causal4d-ci.patch.gz" > "$RUNNER_TEMP/causal4d-ci.patch"
          git apply --index --verbose "$RUNNER_TEMP/causal4d-ci.patch"
      - name: Relocate workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-staging/workflows
          git mv .github/workflows/bpt-main-compatibility.yml .ci-staging/workflows/
          git mv .github/workflows/ci.yml .ci-staging/workflows/
          git mv .github/workflows/optional-integrations.yml .ci-staging/workflows/
      - name: Restore active workflow and validate index
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/ci.yml
          git add -A
          git diff --cached --check
      - name: Commit staged implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage dependency-boundary CI implementation"
      - name: Push staged implementation
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: git push origin "HEAD:${TARGET_BRANCH}"
