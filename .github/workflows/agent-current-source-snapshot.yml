name: Agent current source snapshot

on:
  push:
    branches:
      - agent/causal4d-source-audit-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Create source archive
        run: git archive --format=tar.gz --output=causal4d-source.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: causal4d-current-source-${{ github.sha }}
          path: causal4d-source.tar.gz
          if-no-files-found: error
          retention-days: 1
