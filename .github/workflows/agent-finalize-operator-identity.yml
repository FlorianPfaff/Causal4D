name: Finalize operator identity registry

on:
  push:
    branches:
      - agent/operator-identity-registry

permissions:
  contents: write

concurrency:
  group: operator-identity-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/operator-identity-registry
          fetch-depth: 1
          show-progress: false

      - name: Apply final identity bindings
        run: python .github/agent-patches/finalize_operator_identity.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Format and lint the complete PR surface
        run: |
          files=(
            src/causal4d/cli/preacquisition_readiness.py
            src/causal4d/cli/real_experiment_freeze.py
            src/causal4d/cli/real_protocol.py
            src/causal4d/operator_bound_real_evidence.py
            src/causal4d/operator_identity_integration.py
            src/causal4d/operator_registry.py
            src/causal4d/preacquisition_readiness.py
            tests/test_operator_registry.py
            tests/test_preacquisition_readiness.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check .

      - name: Run core-compatible repository suite
        run: python -m pytest -q

      - name: Remove temporary finalization files
        run: |
          rm .github/agent-patches/finalize_operator_identity.py
          rm .github/workflows/agent-finalize-operator-identity.yml

      - name: Commit validated product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes were required.'
            exit 0
          fi
          git commit -m 'Complete operator-bound acquisition approvals'
          git push origin HEAD:agent/operator-identity-registry
