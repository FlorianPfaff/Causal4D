name: PR 43 format diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply Ruff formatting in the runner
        run: |
          python -m ruff format \
            src/causal4d/prob4d_observation_lineage.py \
            tests/test_prob4d_stream_contract_version.py
      - name: Upload exact formatted files
        uses: actions/upload-artifact@v7
        with:
          name: pr43-ruff-formatted
          path: |
            src/causal4d/prob4d_observation_lineage.py
            tests/test_prob4d_stream_contract_version.py
          if-no-files-found: error
          retention-days: 1
