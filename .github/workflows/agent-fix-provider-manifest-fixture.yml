name: Apply provider-manifest fixture fix

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-provider-manifest-fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-provider-manifest-fixture
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Initialize the bypassed constructor invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_causal4d_phystwin_backend.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = "from causal4d.contracts import TwinBelief, array_sha256\n"
          import_replacement = (
              import_anchor
              + "from causal4d.provider_contract import "
              + "require_bayesian_phystwin_provider\n"
          )
          if import_anchor not in text:
              raise SystemExit("provider import anchor changed")
          text = text.replace(import_anchor, import_replacement, 1)
          fixture_anchor = (
              "    backend = object.__new__(OfficialPhysTwinBackend)\n"
              "    backend.case_name = \"unit_case\"\n"
          )
          fixture_replacement = (
              "    backend = object.__new__(OfficialPhysTwinBackend)\n"
              "    backend.provider_manifest = "
              "require_bayesian_phystwin_provider()\n"
              "    backend.case_name = \"unit_case\"\n"
          )
          if fixture_anchor not in text:
              raise SystemExit("backend fixture anchor changed")
          text = text.replace(fixture_anchor, fixture_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m pip install ".[dev]"
          python -m ruff check tests/test_causal4d_phystwin_backend.py
          rm .github/workflows/agent-fix-provider-manifest-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_causal4d_phystwin_backend.py .github/workflows
          git commit -m "Initialize provider manifest in backend test fixture"
          git push origin HEAD:agent/fix-provider-manifest-fixture
