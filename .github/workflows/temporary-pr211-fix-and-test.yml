name: Temporary PR 211 portable-identity fix and validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-pr211-fix-and-test.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: temporary-pr211-fix-and-test
  cancel-in-progress: false

env:
  START_SHA: b7f899ed616b4615d2a2805abbec73d8bf5de70b
  BASE_SHA: 17e04a16b2a999ccd28b3196841f84951e0d48e2
  PRODUCT_BRANCH: agent/preacquisition-next-action
  ISSUE_NUMBER: "213"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fix-and-validate:
    name: Patch and validate the immutable product head
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out the exact product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/Causal4D
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${START_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test -z "$(git status --porcelain=v1)"

      - name: Correct the portable evidence identity
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/causal4d/preacquisition_next_action.py")
          source_lines = source_path.read_text(encoding="utf-8").splitlines()
          source_needle = '    payload.pop("evidence_sha256", None)'
          source_matches = [
              index
              for index, line in enumerate(source_lines)
              if line == source_needle
          ]
          if len(source_matches) != 1:
              raise SystemExit("portable identity insertion point is not unique")
          source_index = source_matches[0]
          expected_tail = [
              '    payload.pop("evidence_sha256", None)',
              '    payload.pop("status_sha256", None)',
              "    return _digest(_portable(payload, repository, dataset))",
          ]
          if source_lines[source_index : source_index + 3] != expected_tail:
              raise SystemExit("portable identity implementation changed unexpectedly")
          source_lines[source_index:source_index] = [
              '    payload.pop("readiness_status_sha256", None)',
              '    payload.pop("source_panel_status_sha256", None)',
          ]
          source_path.write_text(
              "\n".join(source_lines) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_preacquisition_next_action.py")
          test_lines = test_path.read_text(encoding="utf-8").splitlines()
          test_needle = '    second["dataset_root"] = "/different/data"'
          test_matches = [
              index for index, line in enumerate(test_lines) if line == test_needle
          ]
          if len(test_matches) != 1:
              raise SystemExit("portable identity regression insertion is not unique")
          test_index = test_matches[0] + 1
          test_lines[test_index:test_index] = [
              '    second["readiness_status_sha256"] = "1" * 64',
              '    second["source_panel_status_sha256"] = "2" * 64',
          ]
          test_path.write_text(
              "\n".join(test_lines) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --check
          git diff -- \
            src/causal4d/preacquisition_next_action.py \
            tests/test_preacquisition_next_action.py

      - name: Commit and publish the correction
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/preacquisition_next_action.py \
            tests/test_preacquisition_next_action.py
          git commit -m \
            "Exclude host-local status hashes from portable next-action identity"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          target_sha="$(git rev-parse HEAD)"
          echo "${target_sha}" > /tmp/pr211-target-sha
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify the exact seven-file product scope
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(cat /tmp/pr211-target-sha)"
          test "$(git rev-parse HEAD)" = "${target_sha}"
          git diff --name-only "${BASE_SHA}" "${target_sha}" | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          docs/causal4d_preacquisition_next_action.md
          docs/causal4d_source_panel_staging_preflight.md
          src/causal4d/cli/preacquisition_readiness.py
          src/causal4d/preacquisition_next_action.py
          src/causal4d/preacquisition_source_panel_staging.py
          tests/test_preacquisition_next_action.py
          tests/test_preacquisition_source_panel_staging.py
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -z "$(git status --porcelain=v1)"
          mkdir -p evidence
          cp /tmp/actual.txt /tmp/expected.txt evidence/
          {
            echo "start_sha=${START_SHA}"
            echo "target_sha=${target_sha}"
            echo "base_sha=${BASE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > evidence/revision.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Run Python 3.12 quality and complete tests
        id: quality
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m pip install \
              "pip==25.2" \
              "setuptools==80.9.0" \
              "wheel==0.45.1"
            python -m pip install -e ".[dev]"
            python -m pip check
            python -m ruff check .
            python -m ruff format --check \
              src/causal4d/cli/preacquisition_readiness.py \
              src/causal4d/preacquisition_next_action.py \
              src/causal4d/preacquisition_source_panel_staging.py \
              tests/test_preacquisition_next_action.py \
              tests/test_preacquisition_source_panel_staging.py
            python -m mypy \
              src/causal4d/preacquisition_next_action.py \
              src/causal4d/preacquisition_source_panel_staging.py
            python -W error -m compileall -q src tests scripts
            python -m pytest -q -p no:cacheprovider \
              tests/test_preacquisition_next_action.py \
              tests/test_preacquisition_source_panel_staging.py
            python scripts/ci/check_acquisition_runbook_commands.py
            python -m pytest -q -p no:cacheprovider \
              --junitxml=evidence/pytest-3.12.xml
          } 2>&1 | tee evidence/python-3.12.log
          python -m pip freeze --all > evidence/pip-freeze-3.12.txt

      - name: Build and validate installed artifacts
        id: distribution
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m build
            python -m twine check dist/*
            sha256sum dist/* > evidence/distribution-sha256.txt
            python -m venv "${RUNNER_TEMP}/pr211-wheel"
            "${RUNNER_TEMP}/pr211-wheel/bin/python" -m pip install --upgrade pip
            wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
            test -n "${wheel_path}"
            "${RUNNER_TEMP}/pr211-wheel/bin/python" -m pip install "${wheel_path}"
            "${RUNNER_TEMP}/pr211-wheel/bin/python" -m pip check
            (
              cd "${RUNNER_TEMP}"
              unset PYTHONPATH
              "${RUNNER_TEMP}/pr211-wheel/bin/causal4d" --help
              "${RUNNER_TEMP}/pr211-wheel/bin/causal4d" \
                protocol readiness next-action --help
              "${RUNNER_TEMP}/pr211-wheel/bin/causal4d" \
                protocol readiness source-panel-verify-staged --help
              "${RUNNER_TEMP}/pr211-wheel/bin/causal4d" \
                commands validate --require-installed
              "${RUNNER_TEMP}/pr211-wheel/bin/python" - <<PY
          import pathlib
          import causal4d

          package = pathlib.Path(causal4d.__file__).resolve()
          checkout = pathlib.Path("${GITHUB_WORKSPACE}").resolve()
          assert checkout not in package.parents, package
          print(package)
          PY
            )
          } 2>&1 | tee evidence/distribution.log

      - name: Read exact BayesianPhysTwin pin
        id: pin
        run: echo "sha=$(python scripts/ci/read_bpt_pin.py)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.pin.outputs.sha }}
          path: _bpt
          persist-credentials: false

      - name: Run pinned BayesianPhysTwin installed-wheel integration
        id: bpt
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            wheelhouse="${RUNNER_TEMP}/pr211-bpt-wheelhouse"
            mkdir -p "${wheelhouse}"
            python -m build --wheel --outdir "${wheelhouse}" .
            python -m build --wheel --outdir "${wheelhouse}" ./_bpt
            test "$(find "${wheelhouse}" -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
            python -m venv "${RUNNER_TEMP}/pr211-bpt"
            "${RUNNER_TEMP}/pr211-bpt/bin/python" -m pip install --upgrade pip
            "${RUNNER_TEMP}/pr211-bpt/bin/python" -m pip install \
              "${wheelhouse}"/*.whl pytest
            "${RUNNER_TEMP}/pr211-bpt/bin/python" -m pip check
            CAUSAL4D_REQUIRE_BPT_PROVIDER=1 \
              "${RUNNER_TEMP}/pr211-bpt/bin/python" \
              scripts/ci/run_bpt_integration_tests.py
          } 2>&1 | tee evidence/bayesian-phystwin.log

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Run complete Python 3.10 suite
        id: py310
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m pip install -e ".[dev]"
            python -m pip check
            python -m pytest -q -p no:cacheprovider \
              --junitxml=evidence/pytest-3.10.xml
          } 2>&1 | tee evidence/python-3.10.log

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Run complete Python 3.14 suite
        id: py314
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m pip install -e ".[dev]"
            python -m pip check
            python -m pytest -q -p no:cacheprovider \
              --junitxml=evidence/pytest-3.14.xml
          } 2>&1 | tee evidence/python-3.14.log

      - name: Upload exact-head validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr211-portable-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-head result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ steps.quality.outcome }}
          DISTRIBUTION_RESULT: ${{ steps.distribution.outcome }}
          BPT_RESULT: ${{ steps.bpt.outcome }}
          PY310_RESULT: ${{ steps.py310.outcome }}
          PY314_RESULT: ${{ steps.py314.outcome }}
        shell: bash
        run: |
          target_sha="unavailable"
          if test -f /tmp/pr211-target-sha; then
            target_sha="$(cat /tmp/pr211-target-sha)"
          fi
          cat > /tmp/result.md <<EOF
          ## Portable-identity correction and exact-head validation

          - Starting SHA: \`${START_SHA}\`
          - Patched target SHA: \`${target_sha}\`
          - Workflow run: \`${GITHUB_RUN_ID}\` attempt \`${GITHUB_RUN_ATTEMPT}\`
          - Python 3.12 quality, focused and complete tests: **${QUALITY_RESULT:-not-run}**
          - Distribution and installed CLI: **${DISTRIBUTION_RESULT:-not-run}**
          - Pinned BayesianPhysTwin integration: **${BPT_RESULT:-not-run}**
          - Complete Python 3.10 suite: **${PY310_RESULT:-not-run}**
          - Complete Python 3.14 suite: **${PY314_RESULT:-not-run}**

          Artifacts are retained for 30 days. No physical data or target outcomes
          were accessed, and the registered estimator was not changed.
          EOF
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body-file /tmp/result.md

      - name: Remove all temporary PR 211 workflows
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C cleanup rm --ignore-unmatch \
            .github/workflows/temporary-pr211-final-validation.yml \
            .github/workflows/temporary-pr211-fix-and-test.yml \
            .github/workflows/temporary-pr211-patch-and-validate.yml
          if ! git -C cleanup diff --cached --quiet; then
            git -C cleanup commit -m \
              "Remove temporary PR 211 validation workflows"
            git -C cleanup push origin HEAD:main
          fi

      - name: Enforce exact-head success
        if: always()
        env:
          QUALITY_RESULT: ${{ steps.quality.outcome }}
          DISTRIBUTION_RESULT: ${{ steps.distribution.outcome }}
          BPT_RESULT: ${{ steps.bpt.outcome }}
          PY310_RESULT: ${{ steps.py310.outcome }}
          PY314_RESULT: ${{ steps.py314.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pr211-target-sha
          test "${QUALITY_RESULT}" = "success"
          test "${DISTRIBUTION_RESULT}" = "success"
          test "${BPT_RESULT}" = "success"
          test "${PY310_RESULT}" = "success"
          test "${PY314_RESULT}" = "success"
