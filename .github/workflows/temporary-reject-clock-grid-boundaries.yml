name: Temporary reject censored clock-offset fits

on:
  push:
    branches: [agent/source-clock-offset-prior-v1]
    paths:
      - ".github/workflows/temporary-reject-clock-grid-boundaries.yml"

permissions:
  contents: write

concurrency:
  group: temporary-reject-clock-grid-boundaries
  cancel-in-progress: false

jobs:
  patch-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/source-clock-offset-prior-v1
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply reviewed boundary-censoring repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/causal4d/observation_clock_offset_prior.py")
          source = source_path.read_text(encoding="utf-8")
          old = '''    _require(
              grid[0] <= offset <= grid[-1],
              "best offset lies outside the declared grid",
          )
          return execution_id, artifact_id, offset, float(np.max(differences))
          '''
          new = '''    _require(
              grid[0] <= offset <= grid[-1],
              "best offset lies outside the declared grid",
          )
          _require(
              grid[0] < offset < grid[-1],
              "best offset is censored by the search-grid boundary",
          )
          return execution_id, artifact_id, offset, float(np.max(differences))
          '''
          if old not in source:
              raise RuntimeError("clock-grid validation insertion point changed")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_observation_clock_offset_prior.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\ndef test_too_few_or_duplicate_source_groups_are_rejected() -> None:\n"
          regression = '''

          def test_boundary_censored_source_offset_is_rejected() -> None:
              with pytest.raises(ValueError, match="censored"):
                  _fit(
                      [
                          _calibration("source-01", -0.020),
                          _calibration("source-02", -0.010),
                          _calibration("source-03", -0.009),
                      ]
                  )
          '''
          regression = "\n".join(line[10:] if line.startswith("          ") else line for line in regression.splitlines())
          if "def test_boundary_censored_source_offset_is_rejected" not in tests:
              if marker not in tests:
                  raise RuntimeError("clock-grid test insertion point changed")
              tests = tests.replace(marker, regression + marker, 1)
              test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install exact development environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          python -m pip check

      - name: Format and validate permanent files
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m ruff check \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m ruff format --check \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m mypy src/causal4d/observation_clock_offset_prior.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_observation_clock_offset_prior.py
          python -m py_compile \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py

      - name: Publish only permanent reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-reject-clock-grid-boundaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reject boundary-censored clock-offset fits"
          git push origin HEAD:agent/source-clock-offset-prior-v1
