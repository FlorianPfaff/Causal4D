name: PR 43 exact Ruff format output

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.0
      - name: Format changed Python files
        run: |
          ruff format \
            src/causal4d/prob4d_observation_contract.py \
            src/causal4d/prob4d_observation_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py \
            tests/test_prob4d_stream_contract_version.py
      - name: Commit exact formatter output
        run: |
          if git diff --quiet --exit-code; then
            echo "Ruff made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/prob4d_observation_contract.py \
            src/causal4d/prob4d_observation_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py \
            tests/test_prob4d_stream_contract_version.py
          git commit -m "Apply Ruff formatting to Prob4D contract changes"
          git push origin HEAD:${{ github.head_ref }}
