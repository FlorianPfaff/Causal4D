name: PR 43 exact Ruff format output

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.0
      - name: Format changed Python files
        run: |
          ruff format \
            src/causal4d/prob4d_observation_contract.py \
            src/causal4d/prob4d_observation_lineage.py \
            tests/test_prob4d_joint_contract_fixture.py \
            tests/test_prob4d_stream_contract_version.py
      - name: Archive exact formatter output
        run: |
          mkdir -p formatted/src/causal4d formatted/tests
          cp src/causal4d/prob4d_observation_contract.py formatted/src/causal4d/
          cp src/causal4d/prob4d_observation_lineage.py formatted/src/causal4d/
          cp tests/test_prob4d_joint_contract_fixture.py formatted/tests/
          cp tests/test_prob4d_stream_contract_version.py formatted/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: causal4d-pr43-ruff-output
          path: formatted
          if-no-files-found: error
