name: Publish clean PR 210 project-status v2

# This self-file refresh triggers the now-indexed one-shot publisher.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr210-project-status-v2.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pr210-project-status-v2
  cancel-in-progress: false

env:
  EXPECTED_HEAD: ba91b6dec00a5949460eccbd91c20ad58971dfbf
  PRODUCT_BRANCH: agent/project-status-v2-20260807

jobs:
  publish:
    name: Format and publish the nine-file status contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and verify immutable source head
        run: |
          set -euo pipefail
          git fetch origin \
            "${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${PRODUCT_BRANCH}")" \
            = "${EXPECTED_HEAD}"

      - name: Stage the reviewed status contract on current main
        run: |
          set -euo pipefail
          base_head="$(git rev-parse origin/main)"
          git checkout -B pr210-clean "${base_head}"
          git checkout "${EXPECTED_HEAD}" -- \
            ci/project_status_v2.json \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            docs/current_project_status.md \
            docs/project_status_contract.md \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          ci/project_status_v2.json
          ci/render_project_status.py
          ci/three_repository_golden_path.py
          ci/three_repository_status.py
          docs/current_project_status.md
          docs/project_status_contract.md
          tests/test_project_status_rendering.py
          tests/test_sdist_reproducibility.py
          tests/test_three_repository_project_status.py
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install and validate the product boundary
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          python -m ruff check .
          python -m ruff format --check \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f \
              ci/render_project_status.py \
              ci/three_repository_golden_path.py \
              ci/three_repository_status.py \
              tests/test_project_status_rendering.py \
              tests/test_sdist_reproducibility.py \
              tests/test_three_repository_project_status.py
          PYTHONPATH="$PWD/ci" python ci/render_project_status.py --check
          PYTHONPATH="$PWD/src:$PWD/ci" python -m pytest -q \
            tests/test_three_repository_project_status.py \
            tests/test_project_status_rendering.py
          git diff --check

      - name: Commit and publish with lease
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ci/project_status_v2.json \
            ci/render_project_status.py \
            ci/three_repository_golden_path.py \
            ci/three_repository_status.py \
            docs/current_project_status.md \
            docs/project_status_contract.md \
            tests/test_project_status_rendering.py \
            tests/test_sdist_reproducibility.py \
            tests/test_three_repository_project_status.py
          git commit -m "Add versioned project-status v2 evidence boundary"
          git push --force-with-lease=refs/heads/${PRODUCT_BRANCH}:${EXPECTED_HEAD} \
            origin HEAD:refs/heads/${PRODUCT_BRANCH}

      - name: Remove this temporary workflow from main
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cleanup
          git -C cleanup config user.name "github-actions[bot]"
          git -C cleanup config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f \
            cleanup/.github/workflows/publish-pr210-project-status-v2.yml; then
            git -C cleanup rm \
              .github/workflows/publish-pr210-project-status-v2.yml
            git -C cleanup commit -m \
              "Remove temporary PR 210 publisher workflow"
            git -C cleanup push origin HEAD:main
          fi
