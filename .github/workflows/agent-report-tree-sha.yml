name: Report implementation branch tree SHA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/harden-evidence-publication
          fetch-depth: 1
          persist-credentials: false
      - name: Report Git object identities
        shell: bash
        run: |
          echo "PARENT_SHA=$(git rev-parse HEAD)"
          echo "BASE_TREE_SHA=$(git rev-parse 'HEAD^{tree}')"
