name: Finalize topology covariance source hashes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-topology-covariance-hashes.yml"

permissions:
  contents: read

concurrency:
  group: finalize-topology-covariance-hashes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hash:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
      'agent/topology-conditioned-contact-covariance-v2'
    name: hash (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: hosted
            runs_on: '"ubuntu-latest"'
          - lane: workstation2
            runs_on: '["self-hosted","Linux","X64","nvidia-smi"]'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Publish exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            src/causal4d/contact_topology_covariance_diagnostic.py \
            scripts/ci/run_contact_topology_covariance_diagnostic.py \
            tests/test_contact_topology_covariance_diagnostic.py \
            tests/test_contact_topology_covariance_workflow_policy.py \
            docs/contact_topology_covariance.md \
            | tee topology-covariance-source-hashes.txt
          {
            echo "### Topology covariance source hashes"
            echo
            echo '```text'
            cat topology-covariance-source-hashes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
