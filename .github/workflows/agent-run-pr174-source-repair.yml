name: Run PR 174 source-only repair

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-run-pr174-source-repair.yml

permissions:
  contents: write

concurrency:
  group: run-pr174-source-only-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/schema4-factor-lineage
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply the reviewed source and regression patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path(".github/workflows/agent-execute-pr174-repair.yml").read_text(
                  encoding="utf-8"
              )
          )
          patch = next(
              step["run"]
              for step in workflow["jobs"]["repair"]["steps"]
              if step.get("name") == "Bind validation to exact hashed bytes"
          )
          subprocess.run(
              ["bash", "-euo", "pipefail", "-c", patch],
              check=True,
          )
          PY

      - name: Validate and publish source files only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            src/causal4d/observation_factor_lineage.py \
            tests/test_observation_factor_lineage_v4.py
          python -m ruff check \
            src/causal4d/observation_factor_lineage.py \
            tests/test_observation_factor_lineage.py \
            tests/test_observation_factor_lineage_v4.py
          python -m pytest -q \
            tests/test_observation_factor_lineage.py \
            tests/test_observation_factor_lineage_v4.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/observation_factor_lineage.py \
            tests/test_observation_factor_lineage_v4.py
          git commit -m "Validate factor lineage from exact hashed bytes"
          git push origin HEAD:agent/schema4-factor-lineage
